    var host = container;

    function visibleRows() {
      var rows = state.rows;
      rows = V.searchRows(rows, state.search);
      if (state.sort) {
        var col = V.COL_BY_KEY[state.sort.key];
        var keyFn = col && col.sortKey ? col.sortKey : function (r) { return V.colValue(r, state.sort.key); };
        rows = U.sortBy(rows, keyFn, state.sort.dir);
      }
      return rows;
    }

    function render() {
      U.clear(host);
      var all = visibleRows();
      var totalPages = Math.max(1, Math.ceil(all.length / state.pageSize));
      if (state.page >= totalPages) state.page = totalPages - 1;
      var pageRows = state.group ? all : all.slice(state.page * state.pageSize, (state.page + 1) * state.pageSize);

      if (!all.length) {
        host.appendChild(U.el('div', { class: 'table-wrap' },
          U.el('div', { class: 'empty' }, opts.emptyText || 'No devices match this view.')));
        return;
      }

      var wrap = U.el('div', { class: 'table-wrap' });
      var table = U.el('table', { class: 'grid' });

      /* ------------------------------------------------------- header */
      var thead = U.el('thead');
      var htr = U.el('tr');
      if (opts.selectable) {
        var allSelected = pageRows.length > 0 && pageRows.every(function (r) { return state.selection.has(r.id); });
        htr.appendChild(U.el('th', { class: 'nosort', style: { width: '30px' } },
          U.el('input', {
            type: 'checkbox', checked: allSelected,
            title: 'Select everything on this page',
            onchange: function (e) {
              pageRows.forEach(function (r) {
                if (e.target.checked) state.selection.add(r.id); else state.selection.delete(r.id);
              });
              if (opts.onSelectionChange) opts.onSelectionChange(state.selection);
              render();
            }
          })));
      }
      state.columns.forEach(function (key) {
        var col = V.COL_BY_KEY[key];
        if (!col) return;
        var active = state.sort && state.sort.key === key;
        var th = U.el('th', {
          title: 'Sort by ' + col.label,
          onclick: function () {
            if (active && state.sort.dir === 'asc') state.sort = { key: key, dir: 'desc' };
            else if (active) state.sort = null;
            else state.sort = { key: key, dir: 'asc' };
            render();
          }
        }, col.label);
        if (active) th.appendChild(U.el('span', { class: 'arrow' }, state.sort.dir === 'asc' ? '▲' : '▼'));
        htr.appendChild(th);
      });
      thead.appendChild(htr);
      table.appendChild(thead);

      /* --------------------------------------------------------- body */
      var tbody = U.el('tbody');
      var ctx = { onChipClick: opts.onChipClick, onNotesClick: opts.onNotesClick, rules: opts.rules };

      function addRow(r) {
        var tr = U.el('tr', {
          class: state.selection.has(r.id) ? 'selected' : '',
          onclick: function (e) {
            if (e.target.tagName === 'INPUT' || e.target.classList.contains('badge')) return;
            if (opts.onRowClick) opts.onRowClick(r);
          }
        });
        if (opts.selectable) {
          tr.appendChild(U.el('td', {}, U.el('input', {
            type: 'checkbox', checked: state.selection.has(r.id),
            onchange: function (e) {
              if (e.target.checked) state.selection.add(r.id); else state.selection.delete(r.id);
              tr.classList.toggle('selected', e.target.checked);
              if (opts.onSelectionChange) opts.onSelectionChange(state.selection);
            }
          })));
        }
        state.columns.forEach(function (key) {
          var col = V.COL_BY_KEY[key];
          if (!col) return;
          var td = U.el('td');
          renderCell(td, r, col, ctx);
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      }

      if (state.group) {
        var groups = U.groupBy(pageRows, function (r) { return V.colValue(r, state.group) || '(not set)'; });
        var keys = Array.from(groups.keys()).sort(function (a, b) { return String(a).localeCompare(String(b)); });
        keys.forEach(function (k) {
          var members = groups.get(k);
          var span = state.columns.length + (opts.selectable ? 1 : 0);
          var gtr = U.el('tr');
          gtr.appendChild(U.el('td', {
            colspan: span,
            style: {
              background: 'var(--surface-2)', fontWeight: '650', fontSize: '12.5px',
              position: 'sticky', top: '30px'
            }
          }, [
            String(k),
            U.el('span', { class: 'pill', style: { marginLeft: '8px' } },
              members.length + ' device' + (members.length === 1 ? '' : 's')),
            opts.onGroupExport ? U.el('button', {
              class: 'btn sm ghost no-print',
              style: { marginLeft: '8px' },
              onclick: function (e) { e.stopPropagation(); opts.onGroupExport(String(k), members); }
            }, 'Export this site') : null
          ]));
          tbody.appendChild(gtr);
          members.forEach(addRow);
        });
      } else {
        pageRows.forEach(addRow);
      }

      table.appendChild(tbody);
      wrap.appendChild(table);
      host.appendChild(wrap);

      /* -------------------------------------------------------- pager */
      var pager = U.el('div', { class: 'pager no-print' });
      pager.appendChild(U.el('span', {}, state.group
        ? U.num(all.length) + ' devices in ' + U.num(new Set(all.map(function (r) { return V.colValue(r, state.group); })).size) + ' groups'
        : 'Showing ' + U.num(Math.min(all.length, state.page * state.pageSize + 1)) + '–' +
          U.num(Math.min(all.length, (state.page + 1) * state.pageSize)) + ' of ' + U.num(all.length)));
      if (!state.group && totalPages > 1) {
        pager.appendChild(U.el('button', {
          class: 'btn sm', disabled: state.page === 0,
          onclick: function () { state.page--; render(); }
        }, '‹ Previous'));
        pager.appendChild(U.el('span', {}, 'Page ' + (state.page + 1) + ' of ' + totalPages));
        pager.appendChild(U.el('button', {
          class: 'btn sm', disabled: state.page >= totalPages - 1,
          onclick: function () { state.page++; render(); }
        }, 'Next ›'));
      }
      if (opts.selectable && state.selection.size) {
        pager.appendChild(U.el('span', { style: { marginLeft: 'auto', fontWeight: '600' } },
          U.num(state.selection.size) + ' selected'));
        pager.appendChild(U.el('button', {
          class: 'btn sm ghost',
          onclick: function () { state.selection.clear(); if (opts.onSelectionChange) opts.onSelectionChange(state.selection); render(); }
        }, 'Clear'));
      }
      host.appendChild(pager);
    }

    return {
      state: state,
      render: render,
      visibleRows: visibleRows,
      setRows: function (rows) { state.rows = rows; state.page = 0; },
      setColumns: function (cols) { state.columns = cols.slice(); },
      setSort: function (s) { state.sort = s; },
      setGroup: function (g) { state.group = g; },
      setSearch: function (q) { state.search = q; state.page = 0; },
      selected: function () {
        return state.rows.filter(function (r) { return state.selection.has(r.id); });
      }
    };
  }

  /* ------------------------------------------------------- detail drawer */

  function fieldRows(row) {
    return [
      ['Device name', row.fs ? row.fs.name : '', row.intune ? row.intune.name : ''],
      ['Serial number', row.fs ? row.fs.serial : '', row.intune ? row.intune.serial : ''],
      ['Assigned user', row.fsUser, row.intuneUser],
      ['User email / UPN', row.fs ? row.fs.userEmail : '', row.intune ? row.intune.primaryUpn : ''],
      ['Location', row.locationRaw, '—'],
      ['Asset state', row.state, '—'],
      ['Asset type', row.assetType, '—'],
      ['Asset tag', row.assetTag, '—'],
      ['Model', row.fs ? row.fs.model : '', row.intune ? row.intune.model : ''],
      ['Manufacturer', row.fs ? row.fs.manufacturer : '', row.intune ? row.intune.manufacturer : ''],
      ['Operating system', row.fs ? row.fs.os : '', row.intune ? row.intune.os : ''],
      ['OS version', row.fs ? row.fs.osVersion : '', row.intune ? row.intune.osVersion : ''],
      ['Compliance', '—', row.compliance],
      ['Ownership', '—', row.ownership],
      ['Last seen', row.lastAudit ? U.fmtDate(row.lastAudit) : 'never', row.lastCheckIn ? U.fmtDate(row.lastCheckIn) : 'never'],
      ['Department', row.department, '—']
    ];
  }

  /* Rules.BY_CODE on the PC side, NetMatch.RULE_BY_CODE on the network side —
     the same shape under two names. */
  function byCode(R) { return R.BY_CODE || R.RULE_BY_CODE || {}; }

  function openDrawer(row, onClose, opts) {
    var R = (opts && opts.rules) || global.Rules;
    var rowFields = (opts && opts.fieldRows) || fieldRows;
    opts = opts || {};
    var back = U.el('div', { class: 'drawer-back', onclick: close });
    var drawer = U.el('div', { class: 'drawer', role: 'dialog', 'aria-label': 'Device detail' });

    function close() {
      if (back.parentNode) document.body.removeChild(back);
      if (drawer.parentNode) document.body.removeChild(drawer);
      document.removeEventListener('keydown', esc);
      if (onClose) onClose();
    }
    function esc(e) { if (e.key === 'Escape') close(); }
    document.addEventListener('keydown', esc);

    drawer.appendChild(U.el('header', {}, [
      U.el('div', {}, [
        U.el('h2', {}, row.name),
        U.el('div', { class: 'hint' },
          (row.matchType === 'serial' ? 'Matched on serial number'
            : row.matchType === 'name' ? 'Matched on device name'
            : row.matchType === 'fs-only' ? 'Freshservice only — no Intune record'
            : 'Intune only — no Freshservice record'))
      ]),
      U.el('div', { class: 'spacer' }),
      U.el('button', { class: 'btn sm ghost', onclick: close, 'aria-label': 'Close' }, '✕')
    ]));

    var body = U.el('div', { class: 'body' });

    if (row.issues.length) {
      var issuesCard = U.el('div', { class: 'card', style: { marginBottom: '16px' } });
      issuesCard.appendChild(U.el('h3', { style: { marginBottom: '8px' } }, 'What is wrong'));
      row.issues.forEach(function (code) {
        var rule = byCode(R)[code];
        if (!rule) return;
        issuesCard.appendChild(U.el('div', { style: { marginBottom: '10px' } }, [
          U.el('div', { class: 'row tight' }, [
            U.el('span', { class: 'badge ' + rule.severity }, [U.el('span', { class: 'sev sev-' + rule.severity }), rule.label])
          ]),
          U.el('div', { style: { fontSize: '12.5px', marginTop: '3px' } }, (row.details && row.details[code]) || ''),
          U.el('div', { class: 'hint', style: { marginTop: '2px' } }, rule.help)
        ]));
      });
      body.appendChild(issuesCard);
    } else {
      body.appendChild(U.el('div', { class: 'card' }, [
        U.el('span', { class: 'badge ok' }, [U.el('span', { class: 'sev sev-ok' }), 'No issues found']),
        U.el('div', { class: 'hint', style: { marginTop: '6px' } },
          opts.cleanText || 'Both systems agree on this device, and nothing is stale.')
      ]));
    }

    var cmp = U.el('div', { class: 'card' });
    cmp.appendChild(U.el('h3', { style: { marginBottom: '10px' } }, 'Side by side'));
    var kv = U.el('div', { class: 'kv' });
    var sideLabels = opts.sideLabels || ['Freshservice', 'Intune'];
    kv.appendChild(U.el('div', { class: 'hdr' }, 'Field'));
    kv.appendChild(U.el('div', { class: 'hdr' }, sideLabels[0]));
    kv.appendChild(U.el('div', { class: 'hdr' }, sideLabels[1]));
    rowFields(row).forEach(function (f) {
      var a = N.clean(f[1]), b = N.clean(f[2]);
      var differs = a && b && a !== '—' && b !== '—' && !N.looseEqual(a, b);
      if (f[0] === 'Assigned user') differs = row.userStatus === 'mismatch';
      kv.appendChild(U.el('div', { class: 'k' }, f[0]));
      kv.appendChild(U.el('div', { class: differs ? 'mismatch' : '' }, a || '—'));
      kv.appendChild(U.el('div', { class: differs ? 'mismatch' : '' }, b || '—'));
    });
    cmp.appendChild(kv);
    body.appendChild(cmp);

    if (row.aw) {
      var vuln = U.el('div', { class: 'card' });
      vuln.appendChild(U.el('header', {}, [
        U.el('h3', {}, 'Vulnerability scan'),
        U.el('span', { class: 'sub' }, 'Arctic Wolf' + (row.awOn === 'mac' ? ' — matched on MAC address' : ''))
      ]));
      vuln.appendChild(U.el('div', { class: 'row', style: { gap: '24px', marginBottom: '8px' } }, [
        U.el('div', {}, [
          U.el('div', { class: 'hint' }, 'Risk score'),
          U.el('div', { style: { fontSize: '22px', fontWeight: '600' } },
            row.riskScore === null ? '—' : String(row.riskScore))
        ]),
        U.el('div', {}, [
          U.el('div', { class: 'hint' }, 'Open risks'),
          U.el('div', { style: { fontSize: '22px', fontWeight: '600' } },
            row.risks === null ? '—' : U.num(row.risks))
        ])
      ]));
      [['Last successful scan', row.awLastScan ? U.fmtDate(row.awLastScan) + ' (' + U.agoLabel(row.awLastScan) + ')' : 'never'],
       ['Last seen by Arctic Wolf', row.awLastSeen ? U.fmtDate(row.awLastSeen) : '—'],
       ['Criticality', row.awCriticality], ['Category', row.awCategory], ['State', row.awState]].forEach(function (p) {
        if (!p[1]) return;
        vuln.appendChild(U.el('div', { style: { fontSize: '12.5px' } }, [
          U.el('span', { style: { color: 'var(--text-secondary)' } }, p[0] + ': '),
          U.el('strong', {}, String(p[1]))
        ]));
      });
      body.appendChild(vuln);
    }

    if (row.ver) {
      var v = U.el('div', { class: 'card' });
      v.appendChild(U.el('h3', { style: { marginBottom: '8px' } }, 'Site verification return'));
      [['Device present', row.ver.confirmedPresent], ['Confirmed location', row.ver.confirmedLocation],
       ['Confirmed user', row.ver.confirmedUser], ['Confirmed status', row.ver.confirmedState],
       ['Notes', row.ver.notes]].forEach(function (p) {
        if (N.isBlank(p[1])) return;
        v.appendChild(U.el('div', { style: { fontSize: '12.5px' } }, [
          U.el('span', { style: { color: 'var(--text-secondary)' } }, p[0] + ': '),
          U.el('strong', {}, p[1])
        ]));
      });
      body.appendChild(v);
    }

    /* The running trail for this device, so the drawer answers "what have we
       already done about this?" without a second trip. */
    var notesCard = U.el('div', { class: 'card' });
    function drawNotes() {
      U.clear(notesCard);
      var entries = global.Notes.entriesFor(row);
      notesCard.appendChild(U.el('header', {}, [
        U.el('h3', {}, 'Notes'),
        U.el('span', { class: 'sub' }, entries.length ? U.num(entries.length) + ' entries' : 'none yet'),
        U.el('div', { class: 'spacer' }),
        U.el('button', {
          class: 'btn sm',
          onclick: function () {
            if (opts.onAddNote) opts.onAddNote(row, drawNotes);
          }
        }, 'Add note')
      ]));
      if (!entries.length) {
        notesCard.appendChild(U.el('div', { class: 'hint' },
          'Nothing recorded against this device yet.'));
      } else {
        entries.slice().reverse().forEach(function (e) {
          notesCard.appendChild(U.el('div', {
            style: { borderLeft: '2px solid var(--accent)', padding: '3px 0 5px 10px', marginBottom: '7px' }
          }, [
            U.el('div', { class: 'hint' },
              new Date(e.ts).toLocaleString('en-GB') + (e.by ? ' · ' + e.by : '')),
            U.el('div', { style: { whiteSpace: 'pre-wrap', fontSize: '12.5px' } }, e.text)
          ]));
        });
      }
    }
    drawNotes();
    body.appendChild(notesCard);

    if (row.site) {
      var st = U.el('div', { class: 'card' });
      st.appendChild(U.el('h3', { style: { marginBottom: '8px' } }, 'Site'));
      st.appendChild(U.el('div', { style: { fontSize: '12.5px' } }, N.clean(row.site.location)));
      var addr = global.Geo.addressOf(row.site);
      if (addr) st.appendChild(U.el('div', { class: 'hint' }, addr));
      if (row.region) st.appendChild(U.el('div', { class: 'hint' }, 'Region: ' + row.region));
      body.appendChild(st);
    }

    drawer.appendChild(body);
    document.body.appendChild(back);
    document.body.appendChild(drawer);
  }

  global.Table = { create: create, openDrawer: openDrawer, severityBadge: severityBadge, issueChips: issueChips };
})(window);

</script>
<script>
/* js/map.js */
/* Estate map: one dot per site, area proportional to the device count.

   Radius scales with the square root of the count so that area - not radius -
   carries magnitude, which is how people actually read bubble size. */
(function (global) {
  'use strict';

  var U = global.U, N = global.Norm;

  var map = null;
  var layer = null;
  var legendCtl = null;
  var lastFit = null;
  var savedView = null;

  /* Leaflet writes marker colours as SVG presentation attributes. Support for
     var() there is not universal, so resolve the tokens to concrete colours
     against the live theme before handing them over. */
  var varCache = {};
  function cssVar(name) {
    var key = name + '|' + (document.documentElement.getAttribute('data-theme') || 'auto');
    if (varCache[key]) return varCache[key];
    var v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    if (!v) v = '#2a78d6';
    varCache[key] = v;
    return v;
  }
  function resolve(c) {
    var m = /^var\((--[a-z0-9-]+)\)$/i.exec(String(c).trim());
    return m ? cssVar(m[1]) : c;
  }
  function clearVarCache() { varCache = {}; }

  var COLOUR_MODES = {
    count:    { label: 'Device count only', legend: 'One colour: size carries the count' },
    variance: { label: 'Variance vs expected', legend: 'Red = more devices than expected, blue = fewer' },
    issues:   { label: 'Share of devices with issues', legend: 'Darker = a higher proportion flagged' }
  };

  /* Roll reconciled rows up to sites. Rows whose location resolves to a row in
     the lookup get mapped; the rest are reported separately so nothing is
     silently dropped off the visual. */
  function aggregate(rows, opts) {
    opts = opts || {};
    var groups = new Map();
    var unlocated = [];       // no location at all
    var unmatched = new Map();// a location, but not in the lookup
    var unmapped = [];        // in the lookup, but no coordinates

    rows.forEach(function (r) {
      if (!opts.includeOther && r.fs && !r.inScope) return;
      if (!r.locationKey) { unlocated.push(r); return; }
      if (!r.site) {
        if (!unmatched.has(r.locationKey)) unmatched.set(r.locationKey, { name: r.location, rows: [] });
        unmatched.get(r.locationKey).rows.push(r);
        return;
      }
      var key = r.locationKey;
      if (!groups.has(key)) {
        groups.set(key, {
          key: key,
          name: N.clean(r.site.location) || r.location,
          site: r.site,
          rows: [],
          region: N.clean(r.site.region),
          expected: typeof r.site.expected === 'number' ? r.site.expected : null
        });
      }
      groups.get(key).rows.push(r);
    });

    var sites = [];
    groups.forEach(function (g) {
      var issues = g.rows.filter(function (r) { return r.issueCount > 0; }).length;
      var high = g.rows.filter(function (r) { return r.severity === 'high'; }).length;
      var lat = typeof g.site.lat === 'number' ? g.site.lat : null;
      var lon = typeof g.site.lon === 'number' ? g.site.lon : null;
      var s = {
        key: g.key,
        name: g.name,
        site: g.site,
        region: g.region,
        rows: g.rows,
        count: g.rows.length,
        issues: issues,
        high: high,
        issueRate: g.rows.length ? issues / g.rows.length : 0,
        expected: g.expected,
        variance: g.expected === null ? null : g.rows.length - g.expected,
        lat: lat, lon: lon,
        address: global.Geo.addressOf(g.site)
      };
      if (lat === null || lon === null) unmapped.push(s);
      sites.push(s);
    });

    return {
      sites: sites,
      mappable: sites.filter(function (s) { return s.lat !== null && s.lon !== null; }),
      unmapped: unmapped,
      unlocated: unlocated,
      unmatched: Array.from(unmatched.values())
    };
  }

  function radiusFor(count, maxCount) {
    var minR = 6, maxR = 34;
    if (maxCount <= 1) return minR + 4;
    var t = Math.sqrt(count) / Math.sqrt(maxCount);
    return minR + t * (maxR - minR);
  }

  function colourFor(site, mode, scale) {
    if (mode === 'variance') {
      if (site.variance === null) return 'var(--text-muted)';
      var v = site.variance;
      if (v === 0) return 'var(--div-mid)';
      var mag = Math.min(1, Math.abs(v) / (scale.maxAbsVariance || 1));
      if (v > 0) return mag > 0.5 ? 'var(--div-pos-strong)' : 'var(--div-pos)';
      return mag > 0.5 ? 'var(--div-neg-strong)' : 'var(--div-neg)';
    }
    if (mode === 'issues') {
      var r = site.issueRate;
      if (r >= 0.6) return 'var(--seq-700)';
      if (r >= 0.4) return 'var(--seq-550)';
      if (r >= 0.2) return 'var(--seq-400)';
      if (r > 0)    return 'var(--seq-250)';
      return 'var(--seq-100)';
    }
    return 'var(--series-1)';
  }

  /* Re-rendering the Map tab replaces the #map element, which would leave the
     cached Leaflet instance bound to a detached node - markers get drawn into
     a container that is no longer on the page, and the map reads as blank. So
     check the instance still owns the live element, and rebuild it if not,
     carrying the user's current pan and zoom across. */
  function ensureMap(elId) {
    if (!global.L) return null;
    var host = document.getElementById(elId);
    if (!host) return null;

    if (map) {
      var container = null;
      try { container = map.getContainer(); } catch (e) { container = null; }
      if (container === host && document.body.contains(container)) return map;

      try { savedView = { center: map.getCenter(), zoom: map.getZoom() }; } catch (e) { /* never rendered */ }
      try { map.remove(); } catch (e) { /* already torn down */ }
      map = null; layer = null; legendCtl = null;
    }

    map = global.L.map(host, { scrollWheelZoom: true, zoomControl: true, preferCanvas: false });
    if (savedView) map.setView(savedView.center, savedView.zoom);
    else map.setView([54.0, -2.4], 6);

    global.L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);
    return map;
  }

  function render(elId, agg, opts) {
    opts = opts || {};
    var host = document.getElementById(elId);
    if (!host) return;

    if (!global.L) {
      host.innerHTML = '';
      host.appendChild(U.el('div', { class: 'empty' }, [
        U.el('div', { style: { fontWeight: '600', marginBottom: '6px' } }, 'Map library unavailable'),
        U.el('div', {}, 'Leaflet is loaded from a CDN and could not be reached. Everything else in the tool works offline; the map needs internet access.')
      ]));
      return;
    }

    var m = ensureMap(elId);
    if (!m) return;
    clearVarCache();
    if (layer) { m.removeLayer(layer); layer = null; }
    layer = global.L.layerGroup().addTo(m);

    var mode = opts.mode || 'count';
    var pts = agg.mappable;
    if (!pts.length) {
      if (legendCtl) { m.removeControl(legendCtl); legendCtl = null; }
      setTimeout(function () { m.invalidateSize(); }, 60);
      return;
    }

    var maxCount = Math.max.apply(null, pts.map(function (s) { return s.count; }));
    var scale = {
      maxAbsVariance: Math.max.apply(null, pts.map(function (s) {
        return s.variance === null ? 0 : Math.abs(s.variance);
      })) || 1
    };

    // Bigger dots first so small ones stay clickable on top of them.
    pts.slice().sort(function (a, b) { return b.count - a.count; }).forEach(function (s) {
      var marker = global.L.circleMarker([s.lat, s.lon], {
        radius: radiusFor(s.count, maxCount),
        color: resolve('var(--surface-1)'),
        weight: 2,                       // surface ring, not a data border
        opacity: 0.9,
        fillColor: resolve(colourFor(s, mode, scale)),
        fillOpacity: 0.78
      });

      var lines = [
        '<h4>' + U.escapeHtml(s.name) + '</h4>',
        s.address ? '<div style="color:var(--text-secondary)">' + U.escapeHtml(s.address) + '</div>' : '',
        s.region ? '<div style="color:var(--text-muted)">' + U.escapeHtml(s.region) + '</div>' : '',
        '<div style="margin-top:8px"><strong>' + U.num(s.count) + '</strong> device' + (s.count === 1 ? '' : 's'),
        s.expected !== null ? ' · expected <strong>' + U.num(s.expected) + '</strong>' : '',
        '</div>',
        s.variance !== null && s.variance !== 0
          ? '<div style="color:' + (s.variance > 0 ? 'var(--div-pos-strong)' : 'var(--div-neg-strong)') + ';font-weight:600">' +
            (s.variance > 0 ? '+' : '') + s.variance + ' vs expected</div>'
          : '',
        '<div>' + U.num(s.issues) + ' flagged (' + Math.round(s.issueRate * 100) + '%)' +
          (s.high ? ' · <strong>' + s.high + '</strong> high severity' : '') + '</div>'
      ].join('');

      var content = U.el('div');
      content.innerHTML = lines;
      var btn = U.el('button', {
        class: 'btn sm primary',
        style: { marginTop: '10px' },
        onclick: function () { if (opts.onSelect) opts.onSelect(s); }
      }, 'View these ' + s.count + ' devices');
      content.appendChild(btn);

      marker.bindPopup(content, { maxWidth: 300 });
      marker.bindTooltip(s.name + ' · ' + s.count + ' device' + (s.count === 1 ? '' : 's'), { direction: 'top' });
      marker.addTo(layer);
    });

    /* --------------------------------------------------------- legend */
    if (legendCtl) { m.removeControl(legendCtl); legendCtl = null; }
    legendCtl = global.L.control({ position: 'bottomright' });
    legendCtl.onAdd = function () {
      var div = U.el('div', { class: 'map-legend' });
      div.appendChild(U.el('div', { class: 'lg-title' }, 'Dot size'));

      var sizes = U.uniq([1, Math.max(1, Math.round(maxCount / 4)), Math.max(2, Math.round(maxCount / 2)), maxCount])
        .filter(function (v) { return v > 0; });
      var sizeRow = U.el('div', { style: { display: 'flex', alignItems: 'flex-end', gap: '10px', margin: '4px 0 8px' } });
      sizes.forEach(function (v) {
        var r = radiusFor(v, maxCount);
        sizeRow.appendChild(U.el('div', { style: { textAlign: 'center' } }, [
          U.el('div', {
            style: {
              width: (r * 2) + 'px', height: (r * 2) + 'px', borderRadius: '50%',
              background: 'var(--series-1)', opacity: '0.55', margin: '0 auto 3px'
            }
          }),
          U.el('div', { style: { fontVariantNumeric: 'tabular-nums' } }, String(v))
        ]));
      });
      div.appendChild(sizeRow);

      if (mode !== 'count') {
        div.appendChild(U.el('div', { class: 'lg-title' }, mode === 'variance' ? 'Variance' : 'Issue rate'));
        var swatches = mode === 'variance'
          ? [['var(--div-neg-strong)', 'Well under'], ['var(--div-neg)', 'Under'], ['var(--div-mid)', 'On target'],
             ['var(--div-pos)', 'Over'], ['var(--div-pos-strong)', 'Well over']]
          : [['var(--seq-100)', 'None flagged'], ['var(--seq-250)', 'Under 20%'], ['var(--seq-400)', '20–40%'],
             ['var(--seq-550)', '40–60%'], ['var(--seq-700)', 'Over 60%']];
        swatches.forEach(function (s) {
          div.appendChild(U.el('div', { class: 'lg-row' }, [
            U.el('span', { class: 'lg-sw', style: { background: s[0] } }),
            U.el('span', {}, s[1])
          ]));
        });
      }
      global.L.DomEvent.disableClickPropagation(div);
      return div;
    };
    legendCtl.addTo(m);

    // Fit once per distinct set of points, so re-colouring doesn't yank the view.
    // A map rebuilt from scratch with no remembered view needs the fit too.
    var sig = pts.length + ':' + pts.map(function (s) { return s.key; }).join(',');
    if (sig !== lastFit || !savedView) {
      lastFit = sig;
      try {
        m.fitBounds(global.L.latLngBounds(pts.map(function (s) { return [s.lat, s.lon]; })).pad(0.12));
      } catch (e) { /* single point or bad coords: leave the default view */ }
    }
    setTimeout(function () { m.invalidateSize(); }, 60);
  }

  function invalidate() {
    if (!map) return;
    setTimeout(function () {
      try {
        map.invalidateSize();
        savedView = { center: map.getCenter(), zoom: map.getZoom() };
      } catch (e) { /* container gone; the next ensureMap rebuilds */ }
    }, 60);
  }

  /* Called when the underlying site set changes enough that the view should be
     re-fitted rather than preserved. */
  function reset() { lastFit = null; savedView = null; }

  global.EstateMap = {
    aggregate: aggregate,
    render: render,
    invalidate: invalidate,
    reset: reset,
    COLOUR_MODES: COLOUR_MODES,
    radiusFor: radiusFor
  };
})(window);

</script>
<script>
/* js/fortinet.js */
/* FortiManager's managed-device export is a rendered tree, not a table: the
   hierarchy lives in the leading spaces of the Device Name column, section
   rows carry nothing but a label, and an HA row stands for two physical
   firewalls with both serials packed into one cell.

   This module turns that into one record per physical device, and says out
   loud everywhere it could not be sure. */
(function (global) {
  'use strict';

  var U = global.U, N = global.Norm;

  /* Section labels FortiManager uses for the two managed-device families.
     Anything else at that depth is a grouping row we do not recognise —
     a Security Fabric group, for instance — and we say so rather than
     assuming its children are switches. */
  var SECTIONS = { FSW: 'FortiSwitch', FAP: 'FortiAP' };

  var GATE = 'FortiGate';

  /* ------------------------------------------------------------ firmware */

  /* One version, four spellings across the two environments:
       FortiGate 7.6.7,build3704 (GA) (Mature)
       S108FF-v7.6.6-build1137,251212 (GA)
       FP431F-v7.6.5-build1105
       Enforced Version 7.4.11-b2878,Low Vulnerability
     A lone "-" (sometimes Excel-guarded as "'-") means the device is
     registered but has never reported in. */
  function firmware(raw) {
    var s = String(raw == null ? '' : raw).trim().replace(/^'/, '');
    if (!s || s === '-') return { version: '', build: '', text: s, reported: false };
    var v = s.match(/(\d+\.\d+(?:\.\d+)?)/);
    var b = s.match(/build\s*(\d+)/i) || s.match(/-b(\d+)/i);
    return {
      version: v ? v[1] : '',
      build: b ? b[1] : '',
      text: s,
      reported: !!v
    };
  }

  /* Compare two firmware strings on version and build only, so
     "S148FF-v7.4.6-build895,250129 (GA)" and "7.4.6 build 895" agree. */
  function sameFirmware(a, b) {
    var x = firmware(a), y = firmware(b);
    if (!x.version || !y.version) return false;
    if (x.version !== y.version) return false;
    if (x.build && y.build) return x.build === y.build;
    return true;
  }

  /* ------------------------------------------------------------------ HA */

  /* An HA row's Serial Number is "SER1 (Primary),SER2 (Secondary)" and its
     HA Status is "name1 (Primary, Synchronized),name2 (Secondary, Out of
     Sync)". The status field has commas inside its brackets, so it cannot be
     split on commas — match the bracketed groups instead. */
  function haMembers(serialCell, statusCell) {
    var serials = String(serialCell || '').split(',').map(function (s) {
      var t = s.trim();
      var m = t.match(/^(.*?)\s*\((Primary|Secondary)\)\s*$/i);
      return m ? { serial: m[1].trim(), role: cap(m[2]) } : { serial: t, role: '' };
    }).filter(function (s) { return s.serial; });

    var members = [];
    var re = /([^,(]+)\(([^)]*)\)/g, m;
    while ((m = re.exec(String(statusCell || '')))) {
      var inner = m[2].split(',').map(function (x) { return x.trim(); });
      members.push({
        name: m[1].trim().replace(/^,\s*/, ''),
        role: cap(inner[0] || ''),
        sync: inner.slice(1).join(', ')
      });
    }
    return { serials: serials, members: members };
  }

  function cap(s) {
    s = String(s || '').trim();
    return s ? s.charAt(0).toUpperCase() + s.slice(1).toLowerCase() : '';
  }

  function isHaRow(rec) {
    return String(rec.serial || '').indexOf(',') >= 0 ||
           /\(\s*(Primary|Secondary)\s*[,)]/i.test(String(rec.haStatus || ''));
  }

  /* -------------------------------------------------------------- site */

  /* The leading number in a device name is the site code, zero-padded to
     three. It is right for the overwhelming majority and wrong in a handful
     of named cases, which is what the override table is for — this never
     tries to be clever about the rest. */
  function codeFromName(name) {
    var m = String(name || '').match(/^(\d{1,5})[-_ ]/);
    if (!m) return '';
    var n = m[1].replace(/^0+/, '');
    return n ? n.padStart(3, '0') : '';
  }

  /* Words that say what a device is, or who owns it, rather than where it is.
     A name built only from these carries no location evidence at all, so
     there is nothing for the site to agree or disagree with. */
  var NOISE = ('fw fw1 fw01 fwa fwb sw sw1 sw01 sws ap wap aps fs fgt gate ' +
               'pri sec ha hq poe fpoe lan wan vlan ' +
               'ivo ivolve std shr site network ' +
               // Address words shared by half the estate: "Stanley Road" and
               // "Stenson Road" agree on "road" and on nothing that matters.
               'road street avenue close lane court house lodge cottage the ' +
               'view park gardens garden way drive hill place mews bungalow').split(' ');

  function nameTokens(s) {
    return String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim().split(' ')
      .filter(Boolean)
      .map(function (t) { return t.replace(/\d+$/, ''); })   // "ap04" -> "ap", "sw01" -> "sw"
      .filter(function (t) {
        return t.length > 2 && NOISE.indexOf(t) < 0 && !/^\d+$/.test(t);
      });
  }

  /* A Fortinet serial is a single unbroken run of letters and digits, with no
     separators at all — "S108FFTV25016309". A device still named after one
     tells you nothing about where it is. The no-separator test matters:
     stripping punctuation first made "113-117-StanleyRoad-FW1" look like a
     serial and exempted the very case this is here to catch. */
  function looksLikeSerial(s) {
    var t = String(s || '').trim();
    return /^[A-Za-z0-9]{10,}$/.test(t) && /\d/.test(t) && /[A-Za-z]/.test(t);
  }

  /* Do a device name and the site it resolved to have any word in common?
     Only judged when the name actually offers a word to judge: this is meant
     to catch "113-117-StanleyRoad-FW1" resolving to Moorgreen, not to complain
     about "IVO-111-AP-03", which names no place at all. */
  function nameAgrees(deviceName, siteName) {
    if (looksLikeSerial(deviceName)) return true;
    var a = nameTokens(deviceName);
    var b = nameTokens(siteName);
    if (!a.length || !b.length) return true;          // no evidence either way
    return a.some(function (t) {
      return b.some(function (u) { return u.indexOf(t) >= 0 || t.indexOf(u) >= 0 || near(t, u); });
    });
  }

  /* "Gorefield" against "Gorefeld", "Spinnyfield" against "Spinneyfield":
     one system has a typo, but the device is still at that site, so this is
     not the kind of disagreement the flag is for. Only long tokens qualify —
     two characters of slack on a short word matches almost anything. */
  function near(a, b) {
    if (a.length < 6 || b.length < 6) return false;
    if (Math.abs(a.length - b.length) > 2) return false;
    return distance(a, b, 2) <= 2;
  }

  /* Levenshtein, abandoned as soon as every cell in a row exceeds the cap. */
  function distance(a, b, cap) {
    var prev = [], cur = [], i, j;
    for (j = 0; j <= b.length; j++) prev[j] = j;
    for (i = 1; i <= a.length; i++) {
      cur[0] = i;
      var best = cur[0];
      for (j = 1; j <= b.length; j++) {
        cur[j] = Math.min(
          prev[j] + 1,
          cur[j - 1] + 1,
          prev[j - 1] + (a.charAt(i - 1) === b.charAt(j - 1) ? 0 : 1)
        );
        if (cur[j] < best) best = cur[j];
      }
      if (best > cap) return cap + 1;
      prev = cur.slice();
    }
    return prev[b.length];
  }

  /* ---------------------------------------------------------- flattening */

  /* records: projected fortimanager rows, in file order, each carrying its
              indent depth and environment tag on _raw.
     opts.sites:     { code: { code, name, ... } } from the location lookup
     opts.overrides: { deviceNameLower: siteCode } the user maintains
  */
  function flatten(records, opts) {
    opts = opts || {};
    var sites = opts.sites || {};
    var overrides = {};
    Object.keys(opts.overrides || {}).forEach(function (k) {
      overrides[String(k).trim().toLowerCase()] = String(opts.overrides[k]).trim();
    });
    var indentKey = (global.CSV && global.CSV.INDENT) || '__indent';

    var out = [], warnings = [];
    var gate = null, section = null, sectionEnv = null;

    (records || []).forEach(function (rec) {
      var raw = rec._raw || {};
      var depth = Number(raw[indentKey] || 0);
      var env = raw.__env || '';
      var name = String(rec.name || '').trim();
      if (!name) return;

      if (depth === 0) {
        section = null;
        gate = { name: name, env: env };
        if (isHaRow(rec)) {
          var ha = haMembers(rec.serial, rec.haStatus);
          var count = Math.max(ha.serials.length, ha.members.length);
          if (ha.serials.length !== ha.members.length) {
            warnings.push({
              kind: 'ha-mismatch', device: name, env: env,
              text: name + ': the HA row lists ' + ha.serials.length + ' serial(s) but ' +
                    ha.members.length + ' cluster member(s), so they were paired as far as they go.'
            });
          }
          for (var i = 0; i < count; i++) {
            var s = ha.serials[i] || { serial: '', role: '' };
            var mem = ha.members[i] || { name: '', role: '', sync: '' };
            out.push(device(rec, {
              kind: GATE,
              name: mem.name || s.serial || name,
              serial: s.serial,
              env: env,
              parent: '',
              haRow: name,
              haRole: s.role || mem.role,
              haSync: mem.sync
            }));
          }
        } else {
          out.push(device(rec, { kind: GATE, name: name, serial: String(rec.serial || '').trim(), env: env, parent: '' }));
        }
        return;
      }

      if (depth <= 4) {
        section = name;
        sectionEnv = env;
        if (!SECTIONS[name]) {
          warnings.push({
            kind: 'unknown-section', device: name, env: env,
            text: 'Unrecognised grouping row "' + name + '"' +
                  (gate ? ' under ' + gate.name : '') + '. Anything listed beneath it is ' +
                  'reported as "' + label(name) + '" rather than guessed at.'
          });
        }
        return;
      }

      out.push(device(rec, {
        kind: SECTIONS[section] || label(section),
        name: name,
        serial: String(rec.serial || '').trim(),
        env: env || sectionEnv,
        parent: gate ? gate.name : ''
      }));
    });

    // Resolve the site for every device, then say where the answer looks wrong.
    var byName = {};
    out.forEach(function (d) { byName[d.name.toLowerCase()] = d; });

    out.forEach(function (d) {
      var ov = overrides[d.name.toLowerCase()];
      var own = codeFromName(d.name);
      var parent = d.parent ? codeFromName(d.parent) : '';

      if (ov) {
        d.siteCode = ov;
        d.siteSource = 'override';
      } else if (own && sites[own]) {
        d.siteCode = own;
        d.siteSource = 'name';
      } else if (parent && sites[parent]) {
        d.siteCode = parent;
        d.siteSource = 'parent';
      } else {
        d.siteCode = '';
        d.siteSource = own || parent ? 'unknown-code' : 'none';
      }

      var site = d.siteCode ? sites[d.siteCode] : null;
      d.siteName = site ? site.name : '';
      d.site = site || null;
      d.siteAgrees = !site || d.siteSource === 'override' || d.namedBySerial ||
                     nameAgrees(d.name, site.name);
    });

    return { devices: out, warnings: warnings };
  }

  function label(section) {
    return section ? 'Unknown (' + section + ')' : 'Unknown';
  }

  function device(rec, over) {
    var fw = firmware(rec.firmware);
    var d = {
      kind: over.kind,
      name: over.name,
      serial: over.serial,
      serialKey: N.serial(over.serial),
      env: over.env || '',
      parent: over.parent || '',
      haRow: over.haRow || '',
      haRole: over.haRole || '',
      haSync: over.haSync || '',
      platform: String(rec.platform || '').trim(),
      firmwareText: fw.text,
      firmwareVersion: fw.version,
      firmwareBuild: fw.build,
      reported: fw.reported,
      hostName: String(rec.hostName || '').trim(),
      configStatus: String(rec.configStatus || '').trim(),
      ipAddress: String(rec.ipAddress || '').trim(),
      description: String(rec.description || '').trim(),
      controllers: String(rec.controllers || '').trim(),
      policyPkg: String(rec.policyPkg || '').trim(),
      fortiguard: String(rec.fortiguard || '').trim(),
      mgmtMode: String(rec.mgmtMode || '').trim(),
      upgrade: String(rec.upgrade || '').trim(),
      fwTemplate: String(rec.fwTemplate || '').trim(),
      fabric: String(rec.fabric || '').trim(),
      autoLink: String(rec.autoLink || '').trim(),
      row: rec._row
    };
    // A device still carrying its factory name has never been renamed after
    // joining the fabric — worth seeing, and harmless for matching.
    d.namedBySerial = !!d.serial && N.serial(d.name) === N.serial(d.serial);
    return d;
  }

  global.Fortinet = {
    SECTIONS: SECTIONS,
    flatten: flatten,
    firmware: firmware,
    sameFirmware: sameFirmware,
    codeFromName: codeFromName,
    nameAgrees: nameAgrees,
    looksLikeSerial: looksLikeSerial,
    nameTokens: nameTokens,
    haMembers: haMembers,
    isHaRow: isHaRow
  };
})(window);

</script>
<script>
/* js/netmatch.js */
/* Reconciling network assets is a different job from reconciling PCs: there
   are two systems rather than three, the question is mostly presence rather
   than field agreement, and the answer drives a Freshservice import of kit
   that was never recorded in the first place.

   One row per physical device, keyed on serial number — which on Fortinet
   hardware is clean, unique and printed on the box. */
(function (global) {
  'use strict';

  var U = global.U, N = global.Norm, F = global.Fortinet;

  var DEFAULTS = {
    firmwareDrift: true,          // report a Freshservice firmware that has gone stale
    treatUnreportedAsIssue: true, // a device that has never phoned home
    staleAuditDays: 365           // a Freshservice record not audited in this long
  };

  function settings(saved) {
    return Object.assign({}, DEFAULTS, saved || {});
  }

  /* ---------------------------------------------------------------- rules */

  var SEVERITY_ORDER = { low: 1, medium: 2, high: 3 };

  var RULES = [
    {
      code: 'missing-from-fs',
      label: 'Not in Freshservice',
      severity: 'high',
      hint: 'FortiManager manages this device and Freshservice has no record of it. These are the rows to import.',
      test: function (r) { return !!r.forti && !r.fs; }
    },
    {
      code: 'missing-from-forti',
      label: 'Not in FortiManager',
      severity: 'high',
      hint: 'Freshservice holds this device but no FortiManager environment manages it — it may have been replaced or decommissioned.',
      test: function (r) { return !!r.fs && !r.forti && !r.fsRetired; }
    },
    {
      code: 'retired-but-managed',
      label: 'Retired in FS, still managed',
      severity: 'high',
      hint: 'Freshservice says this is retired or disposed, but FortiManager is still managing it.',
      test: function (r) { return !!r.forti && !!r.fs && r.fsRetired; }
    },
    {
      code: 'duplicate-in-forti',
      label: 'Duplicate in FortiManager',
      severity: 'high',
      hint: 'This serial appears more than once across the FortiManager exports — usually a stale record left behind by a rebuild or a migration.',
      test: function (r) { return r.fortiCount > 1; },
      detail: function (r) {
        return r.fortiAll.map(function (d) {
          return d.name + ' (' + (d.env || 'unknown environment') + (d.parent ? ', under ' + d.parent : '') + ')';
        }).join(' vs ');
      }
    },
    {
      code: 'duplicate-in-fs',
      label: 'Duplicate in Freshservice',
      severity: 'medium',
      hint: 'This serial appears on more than one Freshservice asset.',
      test: function (r) { return r.fsCount > 1; },
      detail: function (r) { return r.fsAll.map(function (a) { return a.name; }).join(' vs '); }
    },
    {
      code: 'cross-environment',
      label: 'In both FortiManager environments',
      severity: 'medium',
      hint: 'The same serial is managed by both environments — expected mid-migration, worth checking otherwise.',
      test: function (r) { return r.envCount > 1; },
      detail: function (r) { return r.envs.join(' and '); }
    },
    {
      code: 'firmware-drift',
      label: 'Firmware differs from Freshservice',
      severity: 'medium',
      hint: 'The version FortiManager reports is not the version recorded in Freshservice.',
      test: function (r, cfg) {
        if (!cfg.firmwareDrift) return false;
        if (!r.forti || !r.fs) return false;
        if (!r.forti.firmwareVersion) return false;
        var recorded = r.fs.firmwareVersion || r.fs.firmware;
        if (N.isBlank(recorded)) return false;
        return !F.sameFirmware(r.forti.firmwareText, recorded);
      },
      detail: function (r) {
        return 'FortiManager ' + (r.forti.firmwareVersion || '?') +
               ' vs Freshservice ' + (r.fs.firmwareVersion || r.fs.firmware || '?');
      }
    },
    {
      code: 'firmware-missing-in-fs',
      label: 'Firmware not recorded',
      severity: 'low',
      hint: 'FortiManager knows the firmware version and the Freshservice record has none.',
      test: function (r) {
        return !!r.forti && !!r.fs && !!r.forti.firmwareVersion &&
               N.isBlank(r.fs.firmwareVersion) && N.isBlank(r.fs.firmware);
      }
    },
    {
      code: 'never-reported',
      label: 'Never reported in',
      severity: 'medium',
      hint: 'Authorised in FortiManager but has never reported a firmware version — pre-registered, or it never came online.',
      test: function (r, cfg) { return cfg.treatUnreportedAsIssue && !!r.forti && !r.forti.reported; }
    },
    {
      code: 'location-mismatch',
      label: 'Location disagrees',
      severity: 'medium',
      hint: 'The site derived from the FortiManager name is not the location on the Freshservice record.',
      test: function (r) {
        if (!r.forti || !r.fs) return false;
        if (!r.siteName || N.isBlank(r.fs.location)) return false;
        return N.locationKey(r.siteName) !== N.locationKey(r.fs.location);
      },
      detail: function (r) { return r.siteName + ' vs ' + r.fs.location; }
    },
    {
      code: 'location-missing-in-fs',
      label: 'No location in Freshservice',
      severity: 'low',
      test: function (r) { return !!r.forti && !!r.fs && N.isBlank(r.fs.location); }
    },
    {
      code: 'site-unresolved',
      label: 'Site not resolved',
      severity: 'medium',
      hint: 'The device name carries no site code that matches your site list, and it inherits nothing usable from its firewall. Add it to the site overrides.',
      test: function (r, cfg, ctx) { return ctx.hasSites && !!r.forti && !r.siteCode; }
    },
    {
      code: 'site-name-suspect',
      label: 'Site looks wrong',
      severity: 'medium',
      hint: 'The site code resolved, but the device name and the site name have no word in common — the number may be a house number rather than a site code.',
      test: function (r) { return !!r.forti && !!r.siteCode && r.forti.siteAgrees === false; },
      detail: function (r) { return r.forti.name + ' resolved to ' + r.siteCode + ' ' + r.siteName; }
    },
    {
      code: 'named-by-serial',
      label: 'Still named after its serial',
      severity: 'low',
      hint: 'Never renamed after joining the fabric.',
      test: function (r) { return !!r.forti && r.forti.namedBySerial; }
    },
    {
      code: 'name-differs',
      label: 'Name differs',
      severity: 'low',
      test: function (r) {
        if (!r.forti || !r.fs) return false;
        return N.deviceName(r.forti.name) !== N.deviceName(r.fs.name);
      },
      detail: function (r) { return r.forti.name + ' vs ' + r.fs.name; }
    },
    {
      code: 'product-missing-in-fs',
      label: 'No product on the FS record',
      severity: 'low',
      test: function (r) { return !!r.fs && N.isBlank(r.fs.product); }
    },
    {
      code: 'ha-out-of-sync',
      label: 'HA member out of sync',
      severity: 'high',
      hint: 'The cluster reports this member as anything other than synchronized.',
      test: function (r) {
        return !!r.forti && !!r.forti.haSync && !/^synchronized$/i.test(r.forti.haSync.trim());
      },
      detail: function (r) { return r.forti.haRole + ': ' + r.forti.haSync; }
    },
    {
      code: 'no-serial',
      label: 'No serial number',
      severity: 'medium',
      hint: 'Matched on name only, because one side has no serial. Every other check on this row is weaker as a result.',
      test: function (r) { return !r.serial; }
    },
    {
      code: 'stale-audit',
      label: 'Freshservice record is stale',
      severity: 'low',
      test: function (r, cfg) {
        if (!r.fs || !r.fs.lastAudit) return false;
        var days = U.daysSince(r.fs.lastAudit);
        return days !== null && days > cfg.staleAuditDays;
      },
      detail: function (r) { return 'last audited ' + U.agoLabel(r.fs.lastAudit); }
    }
  ];

  var RULE_BY_CODE = {};
  RULES.forEach(function (r) { RULE_BY_CODE[r.code] = r; });

  function isEnabled(rule, enabled) {
    if (enabled && Object.prototype.hasOwnProperty.call(enabled, rule.code)) return !!enabled[rule.code];
    return !rule.defaultOff;
  }

  /* -------------------------------------------------------- reconciliation */

  /* fortiDevices: the output of Fortinet.flatten
     fsRecords:    projected fsnetwork rows
     sites:        { code: site }
  */
  function reconcile(fortiDevices, fsRecords, cfg, sites) {
    cfg = settings(cfg);
    sites = sites || {};
    var forti = fortiDevices || [], fs = fsRecords || [];

    // Index both sides on serial, then on name for the rows with no serial.
    var fortiBySerial = groupBy(forti, function (d) { return d.serialKey; });
    var fortiByName = groupBy(forti, function (d) { return N.deviceName(d.name); });
    var fsBySerial = groupBy(fs, function (a) { return N.serial(a.serial); });
    var fsByName = groupBy(fs, function (a) { return N.deviceName(a.name); });

    var rows = [], seenFs = {}, id = 0;

    forti.forEach(function (d) {
      var key = d.serialKey;
      var group = key ? fortiBySerial[key] : [d];
      // Only the first of a duplicated serial builds a row; the rest are
      // reported on it, so a stale twin cannot look like a separate device.
      if (key && group[0] !== d) return;

      var matches = key ? (fsBySerial[key] || []) : (fsByName[N.deviceName(d.name)] || []);
      var matchedBy = key && matches.length ? 'serial' : (matches.length ? 'name' : '');
      if (!matches.length && key) {
        // A Freshservice record with no serial can still be the same device.
        var byName = fsByName[N.deviceName(d.name)] || [];
        matches = byName.filter(function (a) { return N.isBlank(a.serial); });
        if (matches.length) matchedBy = 'name';
      }
      matches.forEach(function (a) { seenFs[a._row] = true; });
      rows.push(build(++id, group, matches, matchedBy, sites));
    });

    fs.forEach(function (a) {
      if (seenFs[a._row]) return;
      var key = N.serial(a.serial);
      var group = key ? (fsBySerial[key] || [a]) : [a];
      if (key && group[0] !== a) return;
      if (!key && (fsByName[N.deviceName(a.name)] || [])[0] !== a) return;
      rows.push(build(++id, [], group, '', sites));
    });

    return {
      rows: rows,
      counts: {
        forti: forti.length,
        fs: fs.length,
        rows: rows.length,
        environments: distinct(forti.map(function (d) { return d.env; }))
      },
      sites: sites
    };
  }

  function build(id, fortiGroup, fsGroup, matchedBy, sites) {
    var d = fortiGroup[0] || null;
    var a = fsGroup[0] || null;
    var envs = distinct(fortiGroup.map(function (x) { return x.env; }).filter(Boolean));

    var row = {
      id: 'n' + id,
      forti: d,
      fs: a,
      fortiAll: fortiGroup,
      fsAll: fsGroup,
      fortiCount: fortiGroup.length,
      fsCount: fsGroup.length,
      matchedBy: matchedBy,
      envs: envs,
      envCount: envs.length,
      env: envs.join(', '),

      name: d ? d.name : (a ? a.name : ''),
      serial: d ? d.serial : (a ? a.serial : ''),
      kind: d ? d.kind : kindFromFs(a),
      platform: d ? d.platform : (a ? a.product : ''),

      siteCode: d ? d.siteCode : '',
      siteName: d ? d.siteName : '',
      siteSource: d ? d.siteSource : '',
      site: d ? d.site : null,

      firmware: d ? d.firmwareVersion : '',
      firmwareText: d ? d.firmwareText : '',
      reported: d ? d.reported : null,

      parent: d ? d.parent : '',
      haRole: d ? d.haRole : '',
      haSync: d ? d.haSync : '',
      configStatus: d ? d.configStatus : '',
      ipForti: d ? d.ipAddress : '',
      ipFs: a ? a.ipAddress : '',

      fsName: a ? a.name : '',
      fsLocation: a ? a.location : '',
      fsState: a ? a.state : '',
      fsAssetType: a ? a.assetType : '',
      fsProduct: a ? a.product : '',
      fsTag: a ? a.assetTag : '',
      // Notes key a device on serial, then name, then asset tag; giving the
      // row the tag under the name Notes looks for keeps a note attached
      // through a rename on either side.
      assetTag: a ? a.assetTag : '',
      fsFirmware: a ? (a.firmwareVersion || a.firmware) : '',
      fsRetired: a ? N.isRetiredState(a.state) : false,
      lastAudit: a ? U.parseDate(a.lastAudit) : null
    };
    row.status = d && a ? 'matched' : (d ? 'forti-only' : 'fs-only');
    row.locationKey = row.siteName ? N.locationKey(row.siteName) : N.locationKey(row.fsLocation);
    return row;
  }

  /* Freshservice's own asset type, when there is no FortiManager side to
     take the kind from. */
  function kindFromFs(a) {
    if (!a) return '';
    var t = (a.assetType || a.ciType || '').toLowerCase();
    if (t.indexOf('access point') >= 0 || t.indexOf('wireless') >= 0) return 'FortiAP';
    if (t.indexOf('switch') >= 0) return 'FortiSwitch';
    if (t.indexOf('firewall') >= 0 || t.indexOf('router') >= 0) return 'FortiGate';
    return a.assetType || '';
  }

  function groupBy(list, keyFn) {
    var out = {};
    list.forEach(function (x) {
      var k = keyFn(x);
      if (!k) return;
      (out[k] = out[k] || []).push(x);
    });
    return out;
  }

  function distinct(list) {
    var seen = {}, out = [];
    list.forEach(function (x) { if (x && !seen[x]) { seen[x] = true; out.push(x); } });
    return out;
  }

  /* ------------------------------------------------------------ rule pass */

  function apply(result, cfg, enabled) {
    cfg = settings(cfg);
    var ctx = { hasSites: result.sites && Object.keys(result.sites).length > 0 };
    var active = RULES.filter(function (r) { return isEnabled(r, enabled); });
    var tally = {};
    active.forEach(function (r) { tally[r.code] = 0; });

    result.rows.forEach(function (row) {
      row.issues = [];
      row.details = {};
      var worst = null;
      active.forEach(function (rule) {
        var hit = false;
        try { hit = !!rule.test(row, cfg, ctx); } catch (e) { hit = false; }
        if (!hit) return;
        row.issues.push(rule.code);
        try { row.details[rule.code] = rule.detail ? rule.detail(row) : ''; } catch (e) { row.details[rule.code] = ''; }
        tally[rule.code]++;
        if (!worst || SEVERITY_ORDER[rule.severity] > SEVERITY_ORDER[worst]) worst = rule.severity;
      });
      row.severity = worst;
      row.issueCount = row.issues.length;
    });

    result.tally = tally;
    result.rulesUsed = active.map(function (r) { return r.code; });
    return result;
  }

  global.NetMatch = {
    DEFAULTS: DEFAULTS,
    RULES: RULES,
    RULE_BY_CODE: RULE_BY_CODE,
    SEVERITY_ORDER: SEVERITY_ORDER,
    settings: settings,
    isEnabled: isEnabled,
    reconcile: reconcile,
    apply: apply
  };
})(window);

</script>
<script>
/* js/dupes.js */
/* Finding duplicate entries *within* each source file, keyed on serial number.

   This is deliberately separate from reconciliation. Reconciliation produces
   one row per physical device and hides the fact that a file held it twice;
   here the question is the opposite one - which rows in this particular export
   are stale copies that should be deleted from the system that produced it.

   The wrinkle is Arctic Wolf, which carries no serial column at all. Where the
   build names a machine after its serial with a build-type prefix
   (STD-5CD4092H17, SHR-5CD4092H17), the serial can be recovered from the name,
   which is also what makes a rebuild under a different build type visible as
   the duplicate it is. */
(function (global) {
  'use strict';

  var N = global.Norm, U = global.U;

  var DEFAULT_PREFIXES = 'STD|SHR|IVOLVE|LAP|DSK';

  /* The date each source uses to say "this record is current". */
  var RECENCY = {
    freshservice: ['lastAudit', 'createdAt'],
    intune: ['lastCheckIn', 'enrolled'],
    arcticwolf: ['lastSeen', 'lastScan']
  };

  var LABEL_FIELDS = {
    freshservice: ['name', 'assetTag', 'state', 'user', 'location'],
    intune: ['name', 'primaryUser', 'compliance', 'ownership'],
    arcticwolf: ['name', 'riskScore', 'risks', 'criticality']
  };

  function prefixRegex(prefixes) {
    // An empty string means "no prefixes", not "use the defaults" - otherwise
    // the setting cannot be switched off and quietly ignores what was typed.
    var raw = (prefixes === undefined || prefixes === null) ? DEFAULT_PREFIXES : String(prefixes);
    var list = raw
      .split(/[|,;\s]+/).map(function (p) { return p.trim(); }).filter(Boolean)
      .map(function (p) { return p.replace(/[.*+?^${}()[\]\\]/g, '\\$&'); });
    if (!list.length) return null;
    try { return new RegExp('^(?:' + list.join('|') + ')[-_ ]+', 'i'); }
    catch (e) { return null; }
  }

  /* Recover the serial a device name encodes, if it encodes one. */
  function serialFromName(name, prefixes) {
    var s = N.deviceName(name);
    if (!s) return '';
    var re = prefixRegex(prefixes);
    var stripped = re ? s.replace(re, '') : s;
    if (stripped === s) return '';          // no build prefix, so no claim made
    return N.serial(stripped);
  }

  /* The serial to group a record on, and where it came from. */
  function serialKey(rec, sourceId, prefixes) {
    var direct = N.serial(rec.serial);
    if (direct) return { key: direct, from: 'serial column' };
    var derived = serialFromName(rec.name, prefixes);
    if (derived) return { key: derived, from: 'device name' };
    return { key: '', from: '' };
  }

  function recencyOf(rec, sourceId) {
    var fields = RECENCY[sourceId] || [];
    for (var i = 0; i < fields.length; i++) {
      var d = U.parseDate(rec[fields[i]]);
      if (d) return { at: d, field: fields[i] };
    }
    return { at: null, field: '' };
  }

  /* Group one source's records by serial and return only the groups with more
     than one entry, newest first within each group. */
  function findDuplicates(sourceId, records, prefixes) {
    var groups = new Map();

    (records || []).forEach(function (rec, idx) {
      var sk = serialKey(rec, sourceId, prefixes);
      if (!sk.key) return;                        // nothing reliable to group on
      if (!groups.has(sk.key)) groups.set(sk.key, { serial: sk.key, entries: [] });
      var r = recencyOf(rec, sourceId);
      groups.get(sk.key).entries.push({
        rec: rec,
        row: rec._row || (idx + 2),
        name: N.clean(rec.name),
        keyFrom: sk.from,
        at: r.at,
        atField: r.field
      });
    });

    var out = [];
    groups.forEach(function (g) {
      if (g.entries.length < 2) return;

      // Newest first. An entry with no date cannot be the current one while a
      // dated entry exists, so it sorts last.
      g.entries.sort(function (a, b) {
        if (a.at && b.at) return b.at - a.at;
        if (a.at) return -1;
        if (b.at) return 1;
        return 0;
      });

      var newest = g.entries[0].at;
      var tied = !!newest && g.entries.filter(function (e) {
        return e.at && Math.abs(e.at - newest) < 60000;      // within a minute
      }).length > 1;

      g.entries.forEach(function (e, i) {
        e.keep = i === 0;
        e.ambiguous = tied || (!newest && true);
      });

      // A rebuild under a different build type is the case worth calling out,
      // because the names differ and the duplicate is easy to miss.
      var names = g.entries.map(function (e) { return N.deviceName(e.name); });
      g.namesDiffer = names.some(function (n) { return n !== names[0]; });
      g.ambiguous = g.entries.some(function (e) { return e.ambiguous; });
      g.count = g.entries.length;
      out.push(g);
    });

    // Worst first: most copies, then the ones whose names disagree.
    out.sort(function (a, b) {
      return b.count - a.count ||
             (b.namesDiffer ? 1 : 0) - (a.namesDiffer ? 1 : 0) ||
             String(a.serial).localeCompare(String(b.serial));
    });
    return out;
  }

  function summarise(groups) {
    var toRemove = 0, ambiguous = 0;
    groups.forEach(function (g) {
      toRemove += g.count - 1;
      if (g.ambiguous) ambiguous++;
    });
    return { serials: groups.length, toRemove: toRemove, ambiguous: ambiguous };
  }

  /* Rows for the export. mode 'remove' gives only the stale copies; 'all'
     gives every entry in every duplicate group, keep flag included. */
  function exportRows(sourceId, groups, mode) {
    var label = (global.Schema.SOURCES[sourceId] || {}).label || sourceId;
    var extra = LABEL_FIELDS[sourceId] || ['name'];
    var rows = [];

    groups.forEach(function (g) {
      g.entries.forEach(function (e) {
        if (mode === 'remove' && e.keep) return;
        var row = {
          'Source': label,
          'Serial': g.serial,
          'Matched on': e.keyFrom,
          'Row in export': e.row,
          'Device name': e.name,
          'Copies of this serial': g.count,
          'Action': e.keep ? 'KEEP (most recent)' : 'Remove (superseded)',
          'Last seen': e.at ? U.fmtDate(e.at) : 'no date in export',
          'Names differ across copies': g.namesDiffer ? 'yes' : 'no',
          'Needs a human decision': e.ambiguous ? 'yes — dates equal or missing' : 'no'
        };
        extra.forEach(function (f) {
          if (f === 'name') return;
          var def = global.Schema.fieldDef(sourceId, f);
          if (!def) return;
          var v = e.rec[f];
          row[def.label] = v === null || v === undefined ? '' : v;
        });
        rows.push(row);
      });
    });
    return rows;
  }

  /* Can this source be grouped at all? Arctic Wolf has no serial column, so
     with no build prefixes configured there is nothing to group on - which is
     a different answer from "no duplicates found". */
  function groupable(sourceId, records, prefixes) {
    var anySerial = (records || []).some(function (r) { return N.serial(r.serial); });
    if (anySerial) return { ok: true, via: 'serial column' };
    var anyDerived = (records || []).some(function (r) { return serialFromName(r.name, prefixes); });
    if (anyDerived) return { ok: true, via: 'device name' };
    return {
      ok: false,
      why: prefixRegex(prefixes)
        ? 'No row in this file has a serial number, and no device name matches one of the build prefixes.'
        : 'This file has no serial column, and no build prefixes are configured, so there is nothing to group on.'
    };
  }

  global.Dupes = {
    groupable: groupable,
    DEFAULT_PREFIXES: DEFAULT_PREFIXES,
    serialFromName: serialFromName,
    serialKey: serialKey,
    findDuplicates: findDuplicates,
    summarise: summarise,
    exportRows: exportRows
  };
})(window);

</script>
<script>
/* js/netviews.js */
/* Columns and views for network assets. Same filter engine as the PC side,
   a wholly different set of columns and questions. */
(function (global) {
  'use strict';

  var U = global.U, N = global.Norm;

  var KIND_ORDER = { FortiGate: 1, FortiSwitch: 2, FortiAP: 3 };

  /* Rows carry the export file they came from, which is unique but unreadable.
     The app supplies the name the user gave that environment. */
  var labelEnv = function (key) { return key; };
  function envLabel(key) { return labelEnv(key); }

  var COLUMNS = [
    { key: 'notes',      label: 'Notes',        width: 64, type: 'notes',
      get: function (r) { return global.Notes.countFor(r); },
      sortKey: function (r) { return -global.Notes.countFor(r); } },
    { key: 'name',       label: 'Device name',  width: 190, get: function (r) { return r.name; }, strong: true },
    { key: 'kind',       label: 'Type',         width: 100, get: function (r) { return r.kind; },
      sortKey: function (r) { return (KIND_ORDER[r.kind] || 9) + r.name; } },
    { key: 'severity',   label: 'Severity',     width: 90,  get: function (r) { return r.severity || ''; },
      sortKey: function (r) { return r.severity ? -global.NetMatch.SEVERITY_ORDER[r.severity] : 9; } },
    { key: 'issues',     label: 'Issues',       width: 300, type: 'issues', get: function (r) { return r.issues; },
      sortKey: function (r) { return -r.issueCount; } },
    { key: 'issueCount', label: 'Issue count',  width: 70, type: 'number', get: function (r) { return r.issueCount; } },
    { key: 'status',     label: 'Present in',   width: 120,
      get: function (r) {
        return r.status === 'matched' ? 'both' : (r.status === 'forti-only' ? 'FortiManager only' : 'Freshservice only');
      } },
    { key: 'serial',     label: 'Serial',       width: 150, get: function (r) { return r.serial; } },
    { key: 'platform',   label: 'Platform',     width: 160, get: function (r) { return r.platform; } },
    { key: 'env',        label: 'Environment',  width: 130,
      get: function (r) { return r.envs.map(envLabel).join(', '); } },

    { key: 'siteCode',   label: 'Site code',    width: 80,  get: function (r) { return r.siteCode; } },
    { key: 'siteName',   label: 'Site',         width: 180, get: function (r) { return r.siteName; } },
    { key: 'siteSource', label: 'Site from',    width: 100, get: function (r) { return r.siteSource; } },
    { key: 'town',       label: 'Town',         width: 130, get: function (r) { return r.site ? N.clean(r.site.town) : ''; } },
    { key: 'postcode',   label: 'Postcode',     width: 95,  get: function (r) { return r.site ? N.clean(r.site.postcode) : ''; } },
    { key: 'region',     label: 'Region',       width: 130, get: function (r) { return r.site ? N.clean(r.site.region) : ''; } },

    { key: 'parent',     label: 'Under firewall', width: 190, get: function (r) { return r.parent; } },
    { key: 'haRole',     label: 'HA role',      width: 90,  get: function (r) { return r.haRole; } },
    { key: 'haSync',     label: 'HA sync',      width: 120, get: function (r) { return r.haSync; } },
    { key: 'configStatus', label: 'Config status', width: 150, get: function (r) { return r.configStatus; } },

    { key: 'firmware',   label: 'Firmware (Forti)', width: 120, get: function (r) { return r.firmware; } },
    { key: 'firmwareText', label: 'Firmware (full)', width: 260, get: function (r) { return r.firmwareText; } },
    { key: 'fsFirmware', label: 'Firmware (FS)', width: 120, get: function (r) { return r.fsFirmware; } },
    { key: 'reported',   label: 'Reported in?', width: 100,
      get: function (r) { return r.forti ? (r.reported ? 'yes' : 'never') : ''; } },

    { key: 'fsName',     label: 'FS name',      width: 190, get: function (r) { return r.fsName; } },
    { key: 'fsLocation', label: 'FS location',  width: 180, get: function (r) { return r.fsLocation; } },
    { key: 'fsState',    label: 'FS state',     width: 110, get: function (r) { return r.fsState; } },
    { key: 'fsAssetType',label: 'FS asset type',width: 130, get: function (r) { return r.fsAssetType; } },
    { key: 'fsProduct',  label: 'FS product',   width: 170, get: function (r) { return r.fsProduct; } },
    { key: 'fsTag',      label: 'FS asset tag', width: 110, get: function (r) { return r.fsTag; } },
    { key: 'lastAudit',  label: 'FS last audit',width: 120, type: 'date', get: function (r) { return r.lastAudit; },
      sortKey: function (r) { return r.lastAudit ? r.lastAudit.getTime() : 0; } },

    { key: 'ipForti',    label: 'IP (Forti)',   width: 130, get: function (r) { return r.ipForti; } },
    { key: 'ipFs',       label: 'IP (FS)',      width: 130, get: function (r) { return r.ipFs; } },
    { key: 'matchedBy',  label: 'Matched on',   width: 100, get: function (r) { return r.matchedBy; } }
  ];

  var BASE_COLS = ['name', 'kind', 'severity', 'status', 'serial', 'siteName', 'firmware', 'issues'];

  var E = global.Views.engine(COLUMNS, BASE_COLS);

  function issueView(id, name, description, codes, columns) {
    return {
      id: id, name: name, description: description, columns: columns || BASE_COLS,
      filter: { match: 'any', conditions: codes.map(function (c) { return { field: '__issue', op: 'is', value: c }; }) },
      sort: { key: 'severity', dir: 'asc' }
    };
  }

  var BUILT_IN = [
    {
      id: 'net-attention',
      name: 'Needs attention',
      description: 'Every network device with at least one open discrepancy, worst first.',
      columns: ['name', 'kind', 'severity', 'status', 'siteName', 'firmware', 'fsFirmware', 'issues'],
      filter: { match: 'all', conditions: [{ field: '__anyIssue', op: 'is' }] },
      sort: { key: 'severity', dir: 'asc' }
    },
    issueView('net-new', 'New since last import',
      'Managed by FortiManager with no Freshservice record at all. These are the rows to build an import from.',
      ['missing-from-fs'],
      ['name', 'kind', 'serial', 'platform', 'siteCode', 'siteName', 'env', 'firmware', 'parent']),
    issueView('net-replaced', 'Possibly replaced',
      'On a Freshservice record but managed by neither FortiManager environment — replaced, decommissioned, or never removed.',
      ['missing-from-forti'],
      ['fsName', 'kind', 'serial', 'fsProduct', 'fsLocation', 'fsState', 'lastAudit', 'fsTag']),
    issueView('net-retired-managed', 'Retired but still managed',
      'Freshservice says retired or disposed; FortiManager is still managing it.',
      ['retired-but-managed'],
      ['name', 'kind', 'serial', 'fsState', 'siteName', 'fsLocation', 'env', 'issues']),
    issueView('net-dupes', 'Duplicates',
      'One serial on more than one record, in FortiManager or in Freshservice, or managed by both environments.',
      ['duplicate-in-forti', 'duplicate-in-fs', 'cross-environment'],
      ['name', 'kind', 'serial', 'env', 'parent', 'siteName', 'issues']),
    issueView('net-firmware', 'Firmware to update',
      'What FortiManager reports does not match what Freshservice records — including records with no firmware at all.',
      ['firmware-drift', 'firmware-missing-in-fs'],
      ['name', 'kind', 'serial', 'firmware', 'fsFirmware', 'platform', 'siteName', 'issues']),
    issueView('net-location', 'Location to fix',
      'The site the device name resolves to disagrees with Freshservice, is missing, or could not be worked out at all.',
      ['location-mismatch', 'location-missing-in-fs', 'site-unresolved', 'site-name-suspect'],
      ['name', 'kind', 'siteCode', 'siteName', 'siteSource', 'fsLocation', 'parent', 'issues']),
    issueView('net-never-reported', 'Never reported in',
      'Authorised in FortiManager but has never reported a firmware version — pre-staged, or it never came online.',
      ['never-reported'],
      ['name', 'kind', 'serial', 'platform', 'siteName', 'parent', 'env', 'configStatus']),
    {
      id: 'net-ha',
      name: 'HA clusters',
      description: 'Both members of every high-availability pair, split out of the single row FortiManager exports.',
      columns: ['name', 'serial', 'haRole', 'haSync', 'siteCode', 'siteName', 'platform', 'firmware', 'env'],
      filter: { match: 'all', conditions: [{ field: 'haRole', op: 'notEmpty' }] },
      sort: { key: 'name', dir: 'asc' }
    },
    issueView('net-unnamed', 'Still named after serial',
      'Never renamed after joining the fabric.',
      ['named-by-serial'],
      ['name', 'kind', 'serial', 'platform', 'siteName', 'parent', 'env']),
    {
      id: 'net-firewalls',
      name: 'Firewalls',
      description: 'Every FortiGate, one row per physical unit.',
      columns: ['name', 'severity', 'status', 'serial', 'platform', 'siteName', 'firmware', 'configStatus', 'ipForti'],
      filter: { match: 'all', conditions: [{ field: 'kind', op: 'is', value: 'FortiGate' }] },
      sort: { key: 'siteCode', dir: 'asc' }
    },
    {
      id: 'net-switches',
      name: 'Switches',
      description: 'Every FortiSwitch, with the firewall it sits under.',
      columns: ['name', 'severity', 'status', 'serial', 'platform', 'siteName', 'parent', 'firmware'],
      filter: { match: 'all', conditions: [{ field: 'kind', op: 'is', value: 'FortiSwitch' }] },
      sort: { key: 'siteCode', dir: 'asc' }
    },
    {
      id: 'net-aps',
      name: 'Access points',
      description: 'Every FortiAP, with the firewall it sits under.',
      columns: ['name', 'severity', 'status', 'serial', 'platform', 'siteName', 'parent', 'firmware'],
      filter: { match: 'all', conditions: [{ field: 'kind', op: 'is', value: 'FortiAP' }] },
      sort: { key: 'siteCode', dir: 'asc' }
    },
    {
      id: 'net-all',
      name: 'All network devices',
      description: 'Everything from both systems after matching, whether or not anything is wrong with it.',
      columns: ['name', 'kind', 'status', 'serial', 'platform', 'siteName', 'env', 'firmware', 'issues'],
      filter: null,
      sort: { key: 'siteCode', dir: 'asc' }
    }
  ];

  global.NetViews = Object.assign({
    engine: global.Views.engine,
    BUILT_IN: BUILT_IN,
    setEnvLabeller: function (fn) { labelEnv = fn || function (k) { return k; }; }
  }, E);
})(window);
