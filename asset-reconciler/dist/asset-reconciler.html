      help: 'The operating system recorded in Freshservice does not match what Intune reports. Off by default: ' +
            'the two are populated from different agents — Freshservice discovery typically gives "Windows 11" ' +
            'where Intune gives "Windows" — so they disagree structurally rather than meaningfully.',
      test: function (r) {
        return r.fs && r.intune && !N.isBlank(r.fs.os) && !N.isBlank(r.intune.os) &&
               !N.looseEqual(r.fs.os, r.intune.os);
      },
      detail: function (r) { return 'Freshservice "' + r.fs.os + '" · Intune "' + r.intune.os + '"'; },
      fix: { field: 'os', from: 'intune' }
    },
    {
      code: 'ip-location-mismatch',
      label: 'IP says it is at another site',
      severity: 'high',
      help: 'The address this device was last seen on belongs to a different site than the one Freshservice has ' +
            'it assigned to. Devices move between services and the paperwork rarely follows, so this is usually ' +
            'the asset register being out of date rather than anything wrong with the device.',
      test: function (r) { return r.ipStatus === 'other-site'; },
      detail: function (r) {
        return 'Last seen on ' + r.ip + ' (' + r.ipSubnet + ') which belongs to ' + r.ipSiteName +
               ', but Freshservice says ' + (r.location || 'no location');

    },
    {
      code: 'ip-suggests-location',

      test: function (r) { return r.ipStatus === 'suggests'; },
      detail: function (r) {
        return r.locationRaw
          ? 'Freshservice says "' + r.locationRaw + '", which is not in the lookup; last seen on ' + r.ip +

      fix: { field: 'location', from: 'ip' }
    },
    {
      code: 'ip-off-network',
      label: 'Last seen off the site network',
      severity: 'low',
      help: 'The address is a private or home one that matches none of your site ranges — normally a remote ' +
            'worker on their own broadband, or a site whose subnet is not in the lookup yet. It says nothing ' +
            'about the device being lost, so it is informational rather than something to chase.',
      test: function (r) { return r.ipStatus === 'off-network'; },
      detail: function (r) {
        return 'Last seen on ' + r.ip +
               (r.ipClass === 'home' ? ' (a 192.168 home range)'
                : r.ipClass === 'public' ? ' (a public address)' : ' (no matching site range)');
      }
    },
    {
      code: 'ip-site-no-subnet',
      label: 'Assigned site has no subnet recorded',
      severity: 'low',
      defaultOff: true,
      help: 'The device has an address but the site it is assigned to has no IP range in the location lookup, so ' +
            'there is nothing to check it against. Off by default because it fires once per device at every ' +
            'such site; use the subnet coverage figure on the dashboard instead, and turn this on when you want ' +
            'the device-level list.',
      test: function (r) { return r.ipStatus === 'unassigned'; },
      detail: function (r) { return 'Last seen on ' + r.ip + '; no range recorded for ' + r.location; }
    },
    {
      code: 'duplicate-record',
      label: 'Duplicate row in one export',
      severity: 'medium',
      help: 'Another row in the same export already matched this device on its serial number or name, so this ' +
            'one is a second record for hardware that is accounted for — typically a machine re-enrolled after ' +
            'a rebuild, or an asset raised twice. It is not missing from the other system; tidy the duplicate ' +
            'rather than chasing the device.',
      test: function (r) { return !!r.shadowed; },
      detail: function (r) {
        return 'A row in ' + (r.fs ? 'Freshservice' : 'Intune') + ' with the same ' +
               (r.serial ? 'serial number (' + r.serial + ')' : 'device name') +
               ' has already been matched to the other system';
      }
    },
    {
      code: 'duplicate-name',
      label: 'Duplicate device name',
      severity: 'medium',
      help: 'This device name appears more than once in one of the exports. Usually a rebuilt machine whose old record was never retired.',
      test: function (r) { return r.dupNames > 0; },
      detail: function (r) { return 'Name "' + r.name + '" is not unique in one of the source files'; }
    },
    {
      code: 'high-risk-score',
      label: 'High vulnerability risk score',
      severity: 'high',
      help: 'Arctic Wolf scores this device at or above the high-risk threshold in Settings. The score reflects ' +
            'the severity of the worst findings rather than how many there are, so a high score on a device ' +
            'with few risks still means something serious is open on it.',
      test: function (r, cfg) {
        return r.riskScore !== null && r.riskScore >= cfg.riskScoreThreshold;

      detail: function (r) {
        return 'Risk score ' + r.riskScore + (r.risks !== null ? ' across ' + global.U.num(r.risks) + ' open risks' : '') +

      test: function (r, cfg) {
        return r.risks !== null && r.risks >= cfg.risksThreshold;
      },
      detail: function (r) {

      }
    },
    {
      code: 'not-scanned',
      label: 'Not covered by Arctic Wolf',
      severity: 'medium',
      help: 'This device is live in Intune or Freshservice but has no Arctic Wolf record, so nothing is scanning ' +
            'it for vulnerabilities. That is a coverage gap rather than a data mismatch: the agent is probably ' +
            'not deployed to it.',
      test: function (r, cfg, ctx) {
        if (!ctx.hasArcticWolf || r.aw) return false;
        if (!r.inScope) return false;                       // printers and phones are not in scope
        if (N.isRetiredState(r.state)) return false;
        // Only claim a gap for machines that are demonstrably alive.
        return r.daysSinceCheckIn !== null && r.daysSinceCheckIn <= cfg.staleDays;
      },
      detail: function (r) {
        return 'Checked in to Intune ' + global.U.agoLabel(r.lastCheckIn) + ', but no vulnerability scan record';
      }
    },
    {
      code: 'scan-stale',
      label: 'Vulnerability scan is stale',
      severity: 'low',
      help: 'Arctic Wolf knows this device but has not completed a scan of it recently, so its risk figures are ' +
            'out of date and may understate what is open on it now.',
      test: function (r, cfg) {
        return r.aw && r.daysSinceScan !== null && r.daysSinceScan > cfg.scanStaleDays;
      },
      detail: function (r) {
        return 'Last successful scan ' + global.U.agoLabel(r.awLastScan);
      }
    },
    {
      code: 'scan-only',
      label: 'Scanned but not in either system',
      severity: 'medium',
      help: 'Arctic Wolf is scanning a device that neither Freshservice nor Intune knows about. Either the asset ' +
            'register and Intune are both missing it, or it is not a corporate machine at all — both worth knowing.',
      test: function (r) { return r.matchType === 'aw-only'; },
      detail: function (r) {

               (r.ip ? ' on ' + r.ip : '') + ', with no Freshservice or Intune record';

    {
      code: 'non-compliant',
      label: 'Not compliant in Intune',
      severity: 'medium',
      help: 'Intune reports this device as non-compliant with policy.',
      test: function (r) {
        var c = N.text(r.compliance);
        return !!c && /non[- ]?compliant|not compliant|in grace|error|conflict/.test(c);
      },
      detail: function (r) { return 'Intune compliance: ' + r.compliance; }
    },
    {
      code: 'verification-moved',
      label: 'Site confirmed a different location',
      severity: 'high',
      help: 'A returned verification sheet gives a location that differs from Freshservice. The site has told you where the device actually is.',
      test: function (r) {
        if (!r.ver || N.isBlank(r.ver.confirmedLocation)) return false;
        return N.locationKey(r.ver.confirmedLocation, 'leaf') !== r.locationKey;
      },
      detail: function (r) {
        return 'Freshservice "' + (r.location || 'blank') + '" · site confirmed "' + r.ver.confirmedLocation + '"';
      },
      fix: { field: 'location', from: 'verification' }
    },
    {
      code: 'verification-missing',
      label: 'Site reported device missing',
      severity: 'high',
      help: 'A returned verification sheet says this device could not be found at the site.',
      test: function (r) {
        return r.ver && /^(n|no|not found|missing|gone)/i.test(N.clean(r.ver.confirmedPresent));
      },
      detail: function (r) { return 'Site note: ' + (r.ver.notes || 'not found on site'); }
    }
  ];

  var BY_CODE = {};
  RULES.forEach(function (r) { BY_CODE[r.code] = r; });

  var SEVERITY_ORDER = { high: 3, medium: 2, low: 1 };

  /* A rule with no stored preference falls back to its own default, so a check
     that is noise for most estates can ship switched off without preventing
     anyone turning it on. */
  function isEnabled(rule, enabled) {
    var stored = enabled ? enabled[rule.code] : undefined;
    if (stored === undefined) return !rule.defaultOff;
    return stored !== false;
  }

  /* Run every enabled rule over every row, writing `issues` and `severity`. */
  function apply(result, cfg, enabled) {
    var ctx = {
      hasLocations: result.sites && result.sites.size > 0,
      hasArcticWolf: !!(result.counts && result.counts.arcticWolf)
    };
    var active = RULES.filter(function (r) { return isEnabled(r, enabled); });
    var tally = {};
    active.forEach(function (r) { tally[r.code] = 0; });

    result.rows.forEach(function (row) {
      row.issues = [];
      row.details = {};
      var worst = null;
      active.forEach(function (rule) {
        var hit = false;
        try { hit = !!rule.test(row, cfg, ctx); } catch (e) { hit = false; }
        if (!hit) return;
        row.issues.push(rule.code);
        try { row.details[rule.code] = rule.detail ? rule.detail(row) : ''; } catch (e) { row.details[rule.code] = ''; }
        tally[rule.code]++;
        if (!worst || SEVERITY_ORDER[rule.severity] > SEVERITY_ORDER[worst]) worst = rule.severity;
      });
      row.severity = worst;
      row.issueCount = row.issues.length;
    });

    result.tally = tally;
    result.rulesUsed = active.map(function (r) { return r.code; });
    return result;
  }

  /* What would we propose to change in Freshservice for this row and field? */
  function proposedValue(row, field, sourcePref, opts) {
    var pick = sourcePref || 'auto';
    var ver = row.ver;
    opts = opts || {};

    if (field === 'user') {
      if ((pick === 'verification' || pick === 'auto') && ver && !N.isBlank(ver.confirmedUser)) return ver.confirmedUser;
      if (pick === 'verification') return null;
      if (!row.intune) return null;
      // Freshservice matches a requester on their address, so the UPN is what
      // makes an import land on the right person; the display name is offered
      // for instances that are set up the other way round. Either falls back
      // to the other rather than writing nothing.
      if (opts.userValue === 'name') {
        return N.personDisplay(row.intune.primaryUser, row.intune.primaryUpn) || null;
      }
      return N.personEmail(row.intune.primaryUpn, row.intune.primaryUser) ||
             N.personDisplay(row.intune.primaryUser, row.intune.primaryUpn) || null;
    }
    if (field === 'location') {
      // A site's own answer beats an inference from the network, but the IP is
      // a good deal better than nothing.
      if (pick !== 'ip' && ver && !N.isBlank(ver.confirmedLocation)) return ver.confirmedLocation;
      if (pick === 'verification') return null;
      if (row.ipSite && (row.ipStatus === 'other-site' || row.ipStatus === 'suggests')) {
        return N.clean(row.ipSite.location) || null;
      }
      if (pick === 'ip') return null;
      return null;
    }
    if (field === 'state') {
      if (ver && !N.isBlank(ver.confirmedState)) return ver.confirmedState;
      return null;
    }
    if (field === 'serial') return row.intune ? N.clean(row.intune.serial) || null : null;
    if (field === 'model') return row.intune ? N.clean(row.intune.model) || null : null;
    if (field === 'os') return row.intune ? N.clean(row.intune.os) || null : null;
    if (field === 'osVersion') return row.intune ? N.clean(row.intune.osVersion) || null : null;
    if (field === 'lastSeen') return row.lastCheckIn || null;
    return null;
  }

  function currentValue(row, field) {
    var fs = row.fs;
    if (!fs) return '';
    if (field === 'user') return row.fsUser;
    if (field === 'location') return N.clean(fs.location);
    if (field === 'state') return N.clean(fs.state);
    if (field === 'serial') return N.clean(fs.serial);
    if (field === 'model') return N.clean(fs.model);
    if (field === 'os') return N.clean(fs.os);
    if (field === 'osVersion') return N.clean(fs.osVersion);
    if (field === 'lastSeen') return fs.lastAudit;
    return '';
  }

  global.Rules = {
    RULES: RULES,
    BY_CODE: BY_CODE,
    apply: apply,
    isEnabled: isEnabled,
    proposedValue: proposedValue,
    currentValue: currentValue,
    SEVERITY_ORDER: SEVERITY_ORDER
  };
})(window);

<script>
/* js/views.js */
/* Columns, the filter engine, and the built-in + saved views. */
(function (global) {
  'use strict';

  var U = global.U, N = global.Norm;

  /* ------------------------------------------------------------ columns */

  var COLUMNS = [
    { key: 'notes',       label: 'Notes',         width: 64, type: 'notes',
      get: function (r) { return global.Notes.countFor(r); },
      sortKey: function (r) { return -global.Notes.countFor(r); } },
    { key: 'name',        label: 'Device name',   width: 150, get: function (r) { return r.name; }, strong: true },
    { key: 'severity',    label: 'Severity',      width: 90,  get: function (r) { return r.severity || ''; },
      sortKey: function (r) { return r.severity ? -global.Rules.SEVERITY_ORDER[r.severity] : 9; } },
    { key: 'issues',      label: 'Issues',        width: 300, type: 'issues', get: function (r) { return r.issues; },
      sortKey: function (r) { return -r.issueCount; } },
    { key: 'issueCount',  label: 'Issue count',   width: 70,  type: 'number', get: function (r) { return r.issueCount; } },
    { key: 'location',    label: 'Location',      width: 150, get: function (r) { return r.location; } },
    { key: 'locationRaw', label: 'Location (raw)',width: 190, get: function (r) { return r.locationRaw; } },
    { key: 'region',      label: 'Region',        width: 120, get: function (r) { return r.region; } },
    { key: 'fsUser',      label: 'FS user',       width: 150, get: function (r) { return r.fsUser; } },
    { key: 'intuneUser',  label: 'Intune user',   width: 150, get: function (r) { return r.intuneUser; } },
    { key: 'userStatus',  label: 'User agrees?',  width: 100, get: function (r) { return r.userStatus; } },
    { key: 'lastLoginBy', label: 'Last login by', width: 150, get: function (r) { return r.lastLoginBy; } },
    { key: 'loginVsAssigned', label: 'Login vs assigned', width: 120, get: function (r) { return r.loginVsAssigned; } },
    { key: 'state',       label: 'FS state',      width: 110, get: function (r) { return r.state; } },
    { key: 'assetType',   label: 'Asset type',    width: 120, get: function (r) { return r.assetType; } },
    { key: 'serial',      label: 'Serial',        width: 130, get: function (r) { return r.serial; } },
    { key: 'assetTag',    label: 'Asset tag',     width: 110, get: function (r) { return r.assetTag; } },
    { key: 'model',       label: 'Model',         width: 160, get: function (r) { return r.model; } },
    { key: 'os',          label: 'OS',            width: 130, get: function (r) { return r.os; } },
    { key: 'osVersion',   label: 'OS version',    width: 110, get: function (r) { return r.osVersion; } },
    { key: 'compliance',  label: 'Compliance',    width: 110, get: function (r) { return r.compliance; } },
    { key: 'ownership',   label: 'Ownership',     width: 100, get: function (r) { return r.ownership; } },
    { key: 'riskScore',   label: 'Risk score',    width: 80, type: 'number', get: function (r) { return r.riskScore; } },
    { key: 'risks',       label: 'Open risks',    width: 85, type: 'number', get: function (r) { return r.risks; } },
    { key: 'awLastScan',  label: 'Last scan',     width: 115, type: 'date', get: function (r) { return r.awLastScan; } },
    { key: 'awCriticality', label: 'AW criticality', width: 110, get: function (r) { return r.awCriticality; } },
    { key: 'awCategory',  label: 'AW category',   width: 100, get: function (r) { return r.awCategory; } },
    { key: 'ip',          label: 'Last seen IP',  width: 120, get: function (r) { return r.ip; } },
    { key: 'ipSiteName',  label: 'Site by IP',    width: 150, get: function (r) { return r.ipSiteName; } },
    { key: 'ipStatus',    label: 'IP vs location',width: 130, get: function (r) { return r.ipStatus; } },
    { key: 'ipSubnet',    label: 'Matched subnet',width: 170, get: function (r) { return r.ipSubnet; } },
    { key: 'ipFrom',      label: 'IP reported by',width: 110, get: function (r) { return r.ipFrom; } },
    { key: 'lastCheckIn', label: 'Intune check-in', width: 120, type: 'date', get: function (r) { return r.lastCheckIn; } },
    { key: 'daysSinceCheckIn', label: 'Days since check-in', width: 90, type: 'number', get: function (r) { return r.daysSinceCheckIn; } },
    { key: 'lastAudit',   label: 'FS last audit', width: 120, type: 'date', get: function (r) { return r.lastAudit; } },
    { key: 'department',  label: 'Department',    width: 130, get: function (r) { return r.department; } },
    { key: 'matchType',   label: 'Matched on',    width: 100, get: function (r) { return r.matchType; } },
    { key: 'verLocation', label: 'Site confirmed location', width: 150, get: function (r) { return r.ver ? N.clean(r.ver.confirmedLocation) : ''; } },
    { key: 'verUser',     label: 'Site confirmed user', width: 150, get: function (r) { return r.ver ? N.clean(r.ver.confirmedUser) : ''; } },
    { key: 'verNotes',    label: 'Site notes',    width: 200, get: function (r) { return r.ver ? N.clean(r.ver.notes) : ''; } },
    { key: 'address',     label: 'Address',       width: 220, get: function (r) { return r.site ? [N.clean(r.site.address), N.clean(r.site.town), N.clean(r.site.postcode)].filter(Boolean).join(', ') : ''; } },
    { key: 'postcode',    label: 'Postcode',      width: 90,  get: function (r) { return r.site ? N.clean(r.site.postcode) : ''; } }
  ];

  var OPERATORS = [
    { op: 'is',          label: 'is',             needsValue: true },
    { op: 'isNot',       label: 'is not',         needsValue: true },
    { op: 'contains',    label: 'contains',       needsValue: true },
    { op: 'notContains', label: 'does not contain', needsValue: true },
    { op: 'empty',       label: 'is empty',       needsValue: false },
    { op: 'notEmpty',    label: 'is not empty',   needsValue: false },
    { op: 'gt',          label: 'is more than',   needsValue: true, numeric: true },
    { op: 'lt',          label: 'is less than',   needsValue: true, numeric: true },
    { op: 'olderThan',   label: 'is older than (days)', needsValue: true, numeric: true },
    { op: 'newerThan',   label: 'is newer than (days)', needsValue: true, numeric: true }
  ];

  /* ------------------------------------------------------ filter engine */

  /* The engine is the same whatever the rows are: it only ever reaches a row
     through the column registry it is given. Network assets have their own
     columns and their own views, so they build their own engine over the same
     code rather than a second copy of it. */
  function engine(columns, baseCols) {
    var COL_BY_KEY = {};
    columns.forEach(function (c) { COL_BY_KEY[c.key] = c; });

    function colValue(row, key) {
      var c = COL_BY_KEY[key];
      return c ? c.get(row) : '';
    }

    /* ------------------------------------------------------ filter engine */

    function testCondition(row, cond) {
      // Pseudo-field: issue codes.
      if (cond.field === '__issue') {
        var has = row.issues.indexOf(cond.value) >= 0;
        return cond.op === 'isNot' ? !has : has;
      }
      if (cond.field === '__anyIssue') {
        return cond.op === 'isNot' ? row.issueCount === 0 : row.issueCount > 0;
      }

      var v = colValue(row, cond.field);
      var col = COL_BY_KEY[cond.field] || {};
      var isDate = col.type === 'date' || v instanceof Date;
      var target = cond.value;

      switch (cond.op) {
        case 'empty':    return v === null || v === undefined || v === '' || (Array.isArray(v) && !v.length);
        case 'notEmpty': return !(v === null || v === undefined || v === '' || (Array.isArray(v) && !v.length));
        case 'gt':       return v !== null && v !== '' && Number(v) > Number(target);
        case 'lt':       return v !== null && v !== '' && Number(v) < Number(target);
        case 'olderThan': {
          var d1 = U.daysSince(v);
          return d1 !== null && d1 > Number(target);
        }
        case 'newerThan': {
          var d2 = U.daysSince(v);
          return d2 !== null && d2 < Number(target);
        }
        default: {
          var s = (Array.isArray(v) ? v.join(' ') : (isDate ? U.fmtDate(v) : String(v === null || v === undefined ? '' : v))).toLowerCase();
          var t = String(target === null || target === undefined ? '' : target).toLowerCase().trim();
          if (cond.op === 'is') return s === t;
          if (cond.op === 'isNot') return s !== t;
          if (cond.op === 'contains') return s.indexOf(t) >= 0;
          if (cond.op === 'notContains') return s.indexOf(t) < 0;
          return true;
        }
      }
    }

    function testFilter(row, filter) {
      if (!filter || !filter.conditions || !filter.conditions.length) return true;
      var results = filter.conditions.map(function (c) { return testCondition(row, c); });
      return filter.match === 'any' ? results.some(Boolean) : results.every(Boolean);
    }

    /* ------------------------------------------------------- built-in views */

    var SEARCHABLE = null;
    function searchRows(rows, q) {
      q = String(q || '').toLowerCase().trim();
      if (!q) return rows;
      if (!SEARCHABLE) SEARCHABLE = columns.map(function (c) { return c.key; });
      return rows.filter(function (r) {
        for (var i = 0; i < SEARCHABLE.length; i++) {
          var v = colValue(r, SEARCHABLE[i]);
          if (v === null || v === undefined || v === '') continue;
          if (Array.isArray(v)) v = v.join(' ');
          else if (v instanceof Date) v = global.U.fmtDate(v);
          if (String(v).toLowerCase().indexOf(q) >= 0) return true;
        }
        return false;
      });
    }

    function applyView(view, rows) {
      var out = rows;
      if (view.custom) out = view.custom(out);
      else if (view.filter) out = out.filter(function (r) { return testFilter(r, view.filter); });
      if (view.sort) {
        var col = COL_BY_KEY[view.sort.key];
        var keyFn = col && col.sortKey ? col.sortKey : function (r) { return colValue(r, view.sort.key); };
        out = U.sortBy(out, keyFn, view.sort.dir);
      }
      return out;
    }

    return {
      COLUMNS: columns,
      COL_BY_KEY: COL_BY_KEY,
      BASE_COLS: (baseCols || []).slice(),
      OPERATORS: OPERATORS,
      colValue: colValue,
      testCondition: testCondition,
      testFilter: testFilter,
      searchRows: searchRows,
      applyView: applyView
    };
  }

  var BASE_COLS = ['name', 'location', 'fsUser', 'intuneUser', 'state', 'lastCheckIn', 'issues'];

  var BUILT_IN = [
    {
      id: 'all',
      name: 'All devices',
      description: 'Every record from both systems after matching, whether or not anything is wrong with it.',
      columns: ['name', 'severity', 'location', 'fsUser', 'intuneUser', 'state', 'serial', 'lastCheckIn', 'matchType', 'issues'],

    },
    {
      id: 'attention',
      name: 'Needs attention',
      description: 'Anything with at least one open discrepancy, worst first. The general working list.',
      columns: ['name', 'severity', 'location', 'fsUser', 'intuneUser', 'state', 'lastCheckIn', 'issues'],
      filter: { match: 'all', conditions: [{ field: '__anyIssue', op: 'is' }] },
      sort: { key: 'severity', dir: 'asc' }
    },
    {

      name: 'Fix: assigned user',
      description: 'Freshservice disagrees with Intune about who has the device, or has nobody recorded at all. These are the rows the import file can correct automatically.',
      columns: ['name', 'location', 'fsUser', 'intuneUser', 'lastLoginBy', 'userStatus', 'lastCheckIn', 'issues'],
      filter: { match: 'any', conditions: [
        { field: '__issue', op: 'is', value: 'user-mismatch' },
        { field: '__issue', op: 'is', value: 'login-differs-from-assigned' },
        { field: '__issue', op: 'is', value: 'user-missing-fs' },
        { field: '__issue', op: 'is', value: 'user-similar' }
      ] }
    },
    {
      id: 'fix-location',
      name: 'Fix: location',
      description: 'Assets with no location, or a location that is not in the lookup file. These are the ones to send out to services to confirm.',
      columns: ['name', 'locationRaw', 'fsUser', 'intuneUser', 'state', 'lastCheckIn', 'issues'],
      filter: { match: 'any', conditions: [
        { field: '__issue', op: 'is', value: 'location-missing' },
        { field: '__issue', op: 'is', value: 'location-unknown' }
      ] }
    },
    {
      id: 'not-in-intune',
      name: 'Missing from Intune',
      description: 'Freshservice holds the asset but Intune does not manage it. Not enrolled, disposed of without an update, or switched off long-term.',
      columns: ['name', 'location', 'fsUser', 'state', 'assetType', 'serial', 'lastAudit', 'issues'],
      filter: { match: 'all', conditions: [{ field: '__issue', op: 'is', value: 'not-in-intune' }] }
    },
    {
      id: 'not-in-fs',
      name: 'Missing from Freshservice',
      description: 'Intune manages the device but there is no asset record. Usually a missing Freshservice agent.',
      columns: ['name', 'intuneUser', 'model', 'os', 'serial', 'lastCheckIn', 'ownership', 'issues'],

    },

      columns: ['name', 'location', 'fsUser', 'state', 'lastCheckIn', 'daysSinceCheckIn', 'issues'],

      filter: { match: 'any', conditions: [

    },
    {

      columns: ['location', 'name', 'assetTag', 'fsUser', 'intuneUser', 'state', 'lastCheckIn'],
      filter: { match: 'all', conditions: [{ field: '__anyIssue', op: 'is' }] },

    },
    {
      id: 'moved-by-ip',

                   'assigned to. The strongest evidence you have that kit has physically moved.',
      columns: ['name', 'location', 'ipSiteName', 'ip', 'ipSubnet', 'fsUser', 'lastCheckIn', 'issues'],
      filter: { match: 'any', conditions: [

    },
    {

      description: 'Last seen on an address matching none of your site ranges — usually remote workers on home ' +
                   'broadband, but also sites whose subnet is missing from the lookup.',
      columns: ['name', 'location', 'ip', 'fsUser', 'intuneUser', 'lastCheckIn', 'issues'],
      filter: { match: 'all', conditions: [{ field: '__issue', op: 'is', value: 'ip-off-network' }] }
    },
    {
      id: 'risk-score',

                   'of the worst finding on the machine rather than how many there are.',
      columns: ['name', 'riskScore', 'risks', 'location', 'fsUser', 'awLastScan', 'lastCheckIn', 'issues'],
      filter: { match: 'all', conditions: [{ field: 'riskScore', op: 'notEmpty' }] },
      sort: { key: 'riskScore', dir: 'desc' }
    },
    {
      id: 'most-risks',
      name: 'Vulnerability: most open risks',
      description: 'Devices ranked by how many open findings they carry, most first. A long tail usually means ' +
                   'the machine is behind on patching.',
      columns: ['name', 'risks', 'riskScore', 'location', 'fsUser', 'awLastScan', 'lastCheckIn', 'issues'],
      filter: { match: 'all', conditions: [{ field: 'risks', op: 'notEmpty' }] },
      sort: { key: 'risks', dir: 'desc' }
    },
    {
      id: 'not-scanned',
      name: 'No vulnerability scan',
      description: 'Live devices with no Arctic Wolf record at all — a scanning coverage gap rather than a data ' +
                   'mismatch, usually meaning the agent is not deployed.',
      columns: ['name', 'location', 'fsUser', 'os', 'lastCheckIn', 'state', 'issues'],
      filter: { match: 'any', conditions: [
        { field: '__issue', op: 'is', value: 'not-scanned' },
        { field: '__issue', op: 'is', value: 'scan-stale' }
      ] }
    },
    {
      id: 'duplicates',
      name: 'Duplicate names',
      description: 'The same device name appears more than once in a source export.',
      columns: ['name', 'location', 'fsUser', 'state', 'serial', 'lastCheckIn', 'matchType', 'issues'],
      filter: { match: 'all', conditions: [{ field: '__issue', op: 'is', value: 'duplicate-name' }] },
      sort: { key: 'name', dir: 'asc' }
    },
    {
      id: 'clean',
      name: 'Clean records',
      description: 'Matched in both systems with nothing flagged. Useful as a denominator, and for sense-checking the rules.',
      columns: ['name', 'location', 'fsUser', 'state', 'serial', 'model', 'lastCheckIn'],
      filter: { match: 'all', conditions: [{ field: '__anyIssue', op: 'isNot' }] }
    },
    {
      id: 'other-assets',
      name: 'Other asset types',
      description: 'Freshservice assets outside the computer types — network hardware, phones, screens. Not compared against Intune, but counted and mapped.',
      columns: ['name', 'assetType', 'location', 'fsUser', 'state', 'serial', 'model', 'assetTag'],
      filter: null,
      custom: function (rows) { return rows.filter(function (r) { return r.fs && !r.inScope; }); }
    }
  ];

  /* The quick-search box over a list of rows.

     It searches every field, not only the columns currently on screen. Tying
     it to the visible columns made the result depend on the column picker,
     which meant the table and the export could disagree about what "shown"
     meant - and typing a value whose column you had not added found nothing.
     Searching everything is both more useful (a serial number is findable
     without adding the column) and impossible to get out of step. */
  var PC = engine(COLUMNS, BASE_COLS);

  global.Views = Object.assign({ engine: engine, BUILT_IN: BUILT_IN }, PC);
})(window);

<script>
/* js/charts.js */
/* Inline-SVG charts. No chart library: two forms are all this tool needs, and
   hand-rolling them keeps the page dependency-free and theme-aware.

   Specs follow the house data-viz rules - bars capped at 24px with a 4px
   rounded data-end squared off at the baseline, hairline solid axes, one hue
   per single-series chart, values direct-labelled at the tip, and a table
   twin behind a toggle so no value is reachable only by hover. */
(function (global) {
  'use strict';

  var U = global.U;
  var SVGNS = 'http://www.w3.org/2000/svg';

  function svgEl(tag, attrs) {
    var n = document.createElementNS(SVGNS, tag);
    Object.keys(attrs || {}).forEach(function (k) { n.setAttribute(k, attrs[k]); });
    return n;
  }

  /* A rectangle with only its data-end rounded. Horizontal bars round the
     right edge; the baseline edge stays square. */
  function barPath(x, y, w, h, r, dir) {
    r = Math.max(0, Math.min(r, h / 2, Math.abs(w)));
    if (Math.abs(w) < 0.5) return 'M' + x + ',' + y + 'h0';
    if (dir === 'left') {
      var xe = x - w;
      return 'M' + x + ',' + y +
             'H' + (xe + r) + 'a' + r + ',' + r + ' 0 0 0 ' + (-r) + ',' + r +
             'V' + (y + h - r) + 'a' + r + ',' + r + ' 0 0 0 ' + r + ',' + r +
             'H' + x + 'Z';
    }
    return 'M' + x + ',' + y +
           'H' + (x + w - r) + 'a' + r + ',' + r + ' 0 0 1 ' + r + ',' + r +
           'V' + (y + h - r) + 'a' + r + ',' + r + ' 0 0 1 ' + (-r) + ',' + r +
           'H' + x + 'Z';
  }

  function measureText(text, size, weight) {
    // Rough advance-width estimate; good enough to decide whether a label fits.
    return String(text).length * size * (weight >= 600 ? 0.58 : 0.53);
  }

  function shell(container, opts) {
    U.clear(container);
    var wrap = U.el('div');
    container.appendChild(wrap);
    return wrap;
  }

  function tableTwin(rows, headers) {
    var t = U.el('table', { class: 'grid', style: { fontSize: '12px' } });
    var thead = U.el('thead');
    var tr = U.el('tr');
    headers.forEach(function (h, i) { tr.appendChild(U.el('th', { class: 'nosort' }, h)); });
    thead.appendChild(tr);
    t.appendChild(thead);
    var tb = U.el('tbody');
    rows.forEach(function (r) {
      var row = U.el('tr');
      r.forEach(function (c, i) {
        row.appendChild(U.el('td', { class: i > 0 ? 'num' : '' }, c));
      });
      tb.appendChild(row);
    });
    t.appendChild(tb);
    return t;
  }

  /* The table twin sits behind a toggle placed *below* the plot: anchoring it
     over the chart would cover the first bar's value label. */
  function addToggle(container, svgNode, tableNode) {
    var showing = 'chart';
    var btn = U.el('button', {
      class: 'btn sm ghost no-print',
      onclick: function () {
        showing = showing === 'chart' ? 'table' : 'chart';
        svgNode.style.display = showing === 'chart' ? '' : 'none';
        tableNode.style.display = showing === 'table' ? '' : 'none';
        btn.textContent = showing === 'chart' ? 'Show as table' : 'Show as chart';
      }
    }, 'Show as table');
    tableNode.style.display = 'none';
    container.appendChild(U.el('div', {
      class: 'no-print',
      style: { display: 'flex', justifyContent: 'flex-end', marginTop: '8px' }
    }, btn));
  }

  /* Swatch + label rows. Present whenever colour carries meaning, so identity
     never rests on hue alone. */
  function legendRow(items) {
    return U.el('div', {
      class: 'row tight',
      style: { marginBottom: '10px', fontSize: '11.5px', color: 'var(--text-secondary)' }
    }, items.map(function (it) {
      return U.el('span', { class: 'row tight', style: { gap: '5px' } }, [
        U.el('span', {
          style: {
            width: '10px', height: '10px', borderRadius: '2px',
            background: it.color, display: 'inline-block', flex: 'none'
          }
        }),
        it.label
      ]);
    }));
  }

  /* ------------------------------------------------------- ranked bars */

  /* data: [{ label, value, sub, onClick }] - one series, one colour. */
  function barChart(container, data, opts) {
    opts = opts || {};
    var wrap = shell(container);
    if (!data.length) {
      wrap.appendChild(U.el('div', { class: 'empty' }, opts.emptyText || 'Nothing to show.'));
      return;
    }
    if (opts.legend) wrap.appendChild(legendRow(opts.legend));

    var width = Math.max(320, container.clientWidth || 560);
    var barH = Math.min(24, opts.barHeight || 18);
    var band = barH + 8;                       // >= 2px surface gap between bars
    var padT = 4, padB = 4;
    var labelW = Math.min(opts.labelWidth || 190, Math.round(width * 0.42));
    var valueW = 54;
    var plotW = Math.max(60, width - labelW - valueW - 12);
    var height = padT + padB + data.length * band;

    var max = Math.max.apply(null, data.map(function (d) { return Math.abs(d.value); }));
    if (!max) max = 1;

    var svg = svgEl('svg', {
      class: 'chart', width: '100%', height: height,
      viewBox: '0 0 ' + width + ' ' + height, role: 'img',
      'aria-label': opts.ariaLabel || 'Bar chart'
    });

    data.forEach(function (d, i) {
      var y = padT + i * band;
      var w = (Math.abs(d.value) / max) * plotW;

      var label = svgEl('text', { x: labelW - 8, y: y + barH / 2 + 4, 'text-anchor': 'end' });
      label.textContent = U.truncate(d.label, Math.floor(labelW / 6.4));
      svg.appendChild(label);

      var bar = svgEl('path', {
        d: barPath(labelW, y, w, barH, 4, 'right'),
        fill: d.color || 'var(--series-1)',
        class: 'bar'
      });
      svg.appendChild(bar);

      var val = svgEl('text', {
        x: labelW + w + 7, y: y + barH / 2 + 4, class: 'value'
      });
      val.textContent = opts.format ? opts.format(d.value) : U.num(d.value);
      svg.appendChild(val);

      // Hit area spans the whole band so the target clears 24px.
      var hit = svgEl('rect', {
        x: 0, y: y - 4, width: width, height: band, class: 'hit'
      });
      hit.addEventListener('mousemove', function (ev) {
        bar.classList.add('hot');
        U.tooltip(
          '<div class="tt-title">' + U.escapeHtml(d.label) + '</div>' +
          '<div class="tt-row">' + U.escapeHtml(opts.valueLabel || 'Devices') + ': ' +
          (opts.format ? opts.format(d.value) : U.num(d.value)) + '</div>' +
          (d.sub ? '<div class="tt-row">' + U.escapeHtml(d.sub) + '</div>' : ''),
          ev.clientX, ev.clientY
        );
      });
      hit.addEventListener('mouseleave', function () { bar.classList.remove('hot'); U.tooltip(null); });
      if (d.onClick) {
        hit.style.cursor = 'pointer';
        hit.addEventListener('click', function () { U.tooltip(null); d.onClick(d); });
      }
      svg.appendChild(hit);
    });

    wrap.appendChild(svg);
    var twin = tableTwin(
      data.map(function (d) { return [d.label, opts.format ? opts.format(d.value) : U.num(d.value)]; }),
      [opts.categoryLabel || 'Item', opts.valueLabel || 'Devices']
    );
    wrap.appendChild(twin);
    addToggle(container, svg, twin);
  }

  /* ---------------------------------------------------- diverging bars */

  /* Signed values around a neutral zero line: two poles that read as opposite
     (red above expectation, blue below), grey axis as the "nothing" midpoint. */
  function divergingBarChart(container, data, opts) {
    opts = opts || {};
    var wrap = shell(container);
    if (!data.length) {
      wrap.appendChild(U.el('div', { class: 'empty' }, opts.emptyText || 'Nothing to show.'));
      return;
    }

    var width = Math.max(320, container.clientWidth || 560);
    var barH = Math.min(24, opts.barHeight || 18);
    var band = barH + 8;
    var padT = 18, padB = 4;
    var labelW = Math.min(opts.labelWidth || 170, Math.round(width * 0.38));
    var valueW = 44;
    var plotW = Math.max(80, width - labelW - valueW - 16);
    var mid = labelW + plotW / 2;
    var height = padT + padB + data.length * band;

    var max = Math.max.apply(null, data.map(function (d) { return Math.abs(d.value); })) || 1;
    var half = plotW / 2;

    var svg = svgEl('svg', {
      class: 'chart', width: '100%', height: height,
      viewBox: '0 0 ' + width + ' ' + height, role: 'img',
      'aria-label': opts.ariaLabel || 'Variance chart'
    });

    // Neutral midpoint rule.
    var axis = svgEl('line', { x1: mid, y1: padT - 6, x2: mid, y2: height - padB, class: 'axis-line' });
    svg.appendChild(axis);

    var capLeft = svgEl('text', { x: mid - 6, y: padT - 9, 'text-anchor': 'end', class: 'tick' });
    capLeft.textContent = opts.negLabel || 'fewer than expected';
    svg.appendChild(capLeft);
    var capRight = svgEl('text', { x: mid + 6, y: padT - 9, class: 'tick' });
    capRight.textContent = opts.posLabel || 'more than expected';
    svg.appendChild(capRight);

    data.forEach(function (d, i) {
      var y = padT + i * band;
      var w = (Math.abs(d.value) / max) * half;
      var positive = d.value >= 0;

      var label = svgEl('text', { x: labelW - 8, y: y + barH / 2 + 4, 'text-anchor': 'end' });
      label.textContent = U.truncate(d.label, Math.floor(labelW / 6.4));
      svg.appendChild(label);

      var bar = svgEl('path', {
        d: positive ? barPath(mid, y, w, barH, 4, 'right') : barPath(mid, y, w, barH, 4, 'left'),
        fill: positive ? 'var(--div-pos-strong)' : 'var(--div-neg-strong)',
        class: 'bar'
      });
      svg.appendChild(bar);

      var vx = positive ? mid + w + 6 : mid - w - 6;
      var val = svgEl('text', {
        x: vx, y: y + barH / 2 + 4, class: 'value',
        'text-anchor': positive ? 'start' : 'end'
      });
      val.textContent = (d.value > 0 ? '+' : '') + U.num(d.value);
      svg.appendChild(val);

      var hit = svgEl('rect', { x: 0, y: y - 4, width: width, height: band, class: 'hit' });
      hit.addEventListener('mousemove', function (ev) {
        bar.classList.add('hot');
        U.tooltip(
          '<div class="tt-title">' + U.escapeHtml(d.label) + '</div>' +
          '<div class="tt-row">' + U.escapeHtml(d.sub || '') + '</div>',
          ev.clientX, ev.clientY
        );
      });
      hit.addEventListener('mouseleave', function () { bar.classList.remove('hot'); U.tooltip(null); });
      if (d.onClick) {
        hit.style.cursor = 'pointer';
        hit.addEventListener('click', function () { U.tooltip(null); d.onClick(d); });
      }
      svg.appendChild(hit);
    });

    wrap.appendChild(svg);
    var twin = tableTwin(
      data.map(function (d) { return [d.label, (d.value > 0 ? '+' : '') + U.num(d.value), d.sub || '']; }),
      [opts.categoryLabel || 'Site', 'Variance', 'Detail']
    );
    wrap.appendChild(twin);
    addToggle(container, svg, twin);
  }

  /* --------------------------------------------------------- stat tiles */

  function tile(label, value, foot, onClick) {
    return U.el('div', {
      class: 'tile' + (onClick ? ' clickable' : ''),
      onclick: onClick || null,
      role: onClick ? 'button' : null,
      tabindex: onClick ? '0' : null,
      onkeydown: onClick ? function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onClick(); } } : null
    }, [
      U.el('div', { class: 'label' }, label),
      U.el('div', { class: 'value' }, typeof value === 'number' ? U.num(value) : value),
      foot ? U.el('div', { class: 'foot' }, foot) : null
    ]);
  }

  global.Charts = { barChart: barChart, divergingBarChart: divergingBarChart, tile: tile };
})(window);

</script>
<script>
/* js/table.js */
/* The data grid: sorting, paging, selection, grouping and the row detail
   drawer. Kept deliberately simple - a thousand rows is nothing for the DOM
   once it is paged. */
(function (global) {
  'use strict';

  var U = global.U, V = global.Views, R = global.Rules, N = global.Norm;

  function severityBadge(sev) {
    if (!sev) return U.el('span', { class: 'badge ok' }, [U.el('span', { class: 'sev sev-ok' }), 'Clean']);
    var label = sev === 'high' ? 'High' : sev === 'medium' ? 'Medium' : 'Low';
    return U.el('span', { class: 'badge ' + sev }, [U.el('span', { class: 'sev sev-' + sev }), label]);
  }

  /* The rule registry is an argument for the same reason the column registry
     is: network assets have their own rules, and a chip drawn from the PC
     registry would come out blank. */
  function issueChips(row, onChipClick, rules) {
    var R = rules || global.Rules;
    var frag = document.createDocumentFragment();
    if (!row.issues.length) {
      frag.appendChild(U.el('span', { class: 'badge ok' }, [U.el('span', { class: 'sev sev-ok' }), 'No issues']));
      return frag;
    }
    var ordered = row.issues.slice().sort(function (a, b) {
      return R.SEVERITY_ORDER[(byCode(R)[b] || {}).severity] - R.SEVERITY_ORDER[(byCode(R)[a] || {}).severity];
    });
    ordered.forEach(function (code) {
      var rule = byCode(R)[code];
      if (!rule) return;
      var chip = U.el('span', {
        class: 'badge ' + rule.severity,
        title: (row.details && row.details[code]) || rule.help
      }, [U.el('span', { class: 'sev sev-' + rule.severity }), rule.label]);
      if (onChipClick) {
        chip.style.cursor = 'pointer';
        chip.addEventListener('click', function (e) { e.stopPropagation(); onChipClick(code); });
      }
      frag.appendChild(chip);
    });
    return frag;
  }

  function renderCell(td, row, col, ctx) {
    var v = col.get(row);

    if (col.key === 'issues') {
      td.className = 'chips';
      td.appendChild(issueChips(row, ctx.onChipClick, ctx.rules));
      return;
    }
    if (col.key === 'notes') {
      var n = v || 0;
      var flag = U.el('button', {
        class: 'btn sm ghost',
        style: { padding: '0 5px', lineHeight: '1.2', color: n ? 'var(--accent)' : 'var(--text-muted)' },
        title: n ? n + ' note' + (n === 1 ? '' : 's') + ' — click to read' : 'No notes yet — click to add one',
        onclick: function (e) { e.stopPropagation(); if (ctx.onNotesClick) ctx.onNotesClick(row); }
      }, n ? '\u2691 ' + n : '\u2690');
      td.appendChild(flag);
      return;
    }
    if (col.key === 'severity') {
      td.appendChild(severityBadge(row.severity));
      return;
    }
    if (col.key === 'userStatus') {
      var map = { match: ['ok', 'Agrees'], mismatch: ['high', 'Differs'], partial: ['medium', 'Similar'], unknown: ['low', 'Unknown'] };
      var m = map[v] || ['low', v || '—'];
      td.appendChild(U.el('span', { class: 'badge ' + m[0] }, [U.el('span', { class: 'sev sev-' + (m[0] === 'ok' ? 'ok' : m[0]) }), m[1]]));
      return;
    }
    if (col.type === 'date') {
      if (!v) { td.appendChild(U.el('span', { class: 'muted' }, 'never')); return; }
      td.appendChild(U.el('span', { title: U.fmtDate(v) }, U.fmtDate(v)));
      td.appendChild(U.el('div', { class: 'muted', style: { fontSize: '11px' } }, U.agoLabel(v)));
      return;
    }
    if (col.type === 'number') {
      td.className = 'num';
      td.textContent = (v === null || v === undefined || v === '') ? '—' : U.num(v);
      return;
    }

    var s = v === null || v === undefined ? '' : String(v);
    if (!s) { td.appendChild(U.el('span', { class: 'muted' }, '—')); return; }

    // Highlight the two fields the reconciliation is really about when they
    // disagree, so a scan down the column finds the problems.
    var isDiff = (col.key === 'fsUser' || col.key === 'intuneUser') && row.userStatus === 'mismatch';
    td.appendChild(U.el('span', {
      class: (col.strong ? 'strong ' : '') + (isDiff ? 'diff' : ''),
      title: s.length > 40 ? s : null,
      style: col.strong ? { fontWeight: '600' } : null

  }

  function create(container, opts) {
    opts = opts || {};
    /* The grid does not care what a row is, only how to read a column out of
       one, so the column registry is an argument. Network assets pass their
       own; everything else gets the PC one. */
    var V = opts.views || global.Views;
    var state = {
      rows: [],
      columns: V.BASE_COLS.slice(),
      sort: null,
      page: 0,
      pageSize: opts.pageSize || 150,
