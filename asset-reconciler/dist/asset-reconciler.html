<script>
/* js/fsexport.js */
/* Builds the files that go back out: the Freshservice update import, the
   change log that documents it, and the site verification packs. */
(function (global) {
  'use strict';

  var U = global.U, N = global.Norm, R = global.Rules;

  /* Freshservice's import expects your instance's own column labels, and
     those differ between tenants (and between the default and custom fields).
     Every header here is editable in the UI and remembered. */
  var DEFAULT_HEADERS = {
    name:      'Name',
    assetTag:  'Asset Tag',
    serial:    'Serial Number',
    user:      'Used By',
    location:  'Location',
    state:     'Asset State',
    model:     'Product',
    os:        'OS',
    osVersion: 'OS Version',
    department:'Department'
  };

  var UPDATABLE = [
    { field: 'user',      label: 'Assigned user (Used By)', sources: ['intune', 'verification'], defaultSource: 'intune' },
    { field: 'location',  label: 'Location',                sources: ['verification', 'ip'],     defaultSource: 'verification' },
    { field: 'state',     label: 'Asset state',             sources: ['verification', 'manual'], defaultSource: 'verification' },
    { field: 'serial',    label: 'Serial number',           sources: ['intune'],                 defaultSource: 'intune' },
    { field: 'model',     label: 'Model',                   sources: ['intune'],                 defaultSource: 'intune' },
    { field: 'os',        label: 'Operating system',        sources: ['intune'],                 defaultSource: 'intune' },
    { field: 'osVersion', label: 'OS version',              sources: ['intune'],                 defaultSource: 'intune' }
  ];

  var SOURCE_LABELS = {
    intune: 'Intune',
    verification: 'Site verification return',
    ip: 'Site matching the last-seen IP',
    manual: 'Fixed value'
  };

  /* Columns that appear on every row regardless of what is being corrected.

     Freshservice rejects an asset import that is missing a mandatory field, so
     these are not decoration: an instance that requires Workspace, Name and
     Product needs all three present on every line, including lines where none
     of them is the thing being changed. A column can take a fixed value or the
     value Freshservice already holds for a field. Where a column names a field
     that is also being corrected, the corrected value wins for the rows that
     have one and the current value fills the rest, so the column is never
     blank. */

  /* Where a column's value comes from. Which system is authoritative differs
     per field and is not something the tool can decide: Freshservice's Product
     is written by its own discovery agent and Intune reports hardware
     separately, so for that column Freshservice is right and copying Intune
     over it would be destructive - while for the assigned user Intune is the
     fresher of the two. So the choice is explicit, per column. */
  var COLUMN_SOURCES = {
    fs: [
      { field: 'name',        label: 'Device name (Display Name)' },
      { field: 'model',       label: 'Product / model' },
      { field: 'assetTag',    label: 'Asset tag' },
      { field: 'serial',      label: 'Serial number' },
      { field: 'location',    label: 'Location' },
      { field: 'user',        label: 'Assigned user' },
      { field: 'state',       label: 'Asset state' },
      { field: 'assetType',   label: 'Asset type' },
      { field: 'department',  label: 'Department' },
      { field: 'os',          label: 'Operating system' },
      { field: 'osVersion',   label: 'OS version' },
      { field: 'ipAddress',   label: 'Last seen IP address' }
    ],
    intune: [
      { field: 'name',        label: 'Device name' },
      { field: 'user',        label: 'Primary user' },
      { field: 'serial',      label: 'Serial number' },
      { field: 'model',       label: 'Model' },
      { field: 'manufacturer',label: 'Manufacturer' },
      { field: 'os',          label: 'Operating system' },
      { field: 'osVersion',   label: 'OS version' },
      { field: 'lastCheckIn', label: 'Last check-in' },
      { field: 'compliance',  label: 'Compliance' },
      { field: 'ownership',   label: 'Ownership' },
      { field: 'category',    label: 'Category' },
      { field: 'ipAddress',   label: 'Last seen IP address' }
    ]
  };

  function fsFieldValue(row, field) {
    if (field === 'name') return row.name;
    if (field === 'ipAddress') return row.fsIp || '';
    if (field === 'assetTag') return row.assetTag;
    if (field === 'assetType') return row.assetType;
    if (field === 'department') return row.department;
    return R.currentValue(row, field);
  }

  function intuneFieldValue(row, field) {
    var i = row.intune;
    if (!i) return '';
    if (field === 'user') return N.personDisplay(i.primaryUser, i.primaryUpn);
    if (field === 'lastCheckIn') return row.lastCheckIn ? U.fmtDate(row.lastCheckIn) : '';
    if (field === 'ipAddress') return row.intuneIp || '';
    return N.clean(i[field]);
  }

  /* One accessor for any column spec. */
  function columnValue(row, col) {
    if (!col) return '';
    if (col.kind === 'fixed') return col.value === undefined ? '' : col.value;
    if (col.kind === 'intune') return intuneFieldValue(row, col.field);
    return fsFieldValue(row, col.field);          // 'fs', and legacy 'field'
  }

  function sourceLabel(col) {
    if (!col) return '';
    if (col.kind === 'fixed') return 'Fixed value';
    var group = col.kind === 'intune' ? 'intune' : 'fs';
    var def = COLUMN_SOURCES[group].filter(function (f) { return f.field === col.field; })[0];
    return (group === 'intune' ? 'Intune: ' : 'Freshservice: ') + (def ? def.label : col.field);
  }

  /* The three columns a stock Freshservice asset import will not accept a file
     without. Product deliberately comes from Freshservice: overwriting it with
     Intune's wording would change good data on every row. */
  function defaultAlwaysColumns() {
    return [
      { header: 'Workspace', kind: 'fixed', value: 'IT' },
      { header: 'Name',      kind: 'fs', field: 'name' },
      { header: 'Product',   kind: 'fs', field: 'model' }
    ];
  }

  function defaultConfig() {
    return {
      matchField: 'name',
      headers: Object.assign({}, DEFAULT_HEADERS),
      fields: {
        user:      { enabled: true,  source: 'intune' },
        location:  { enabled: true,  source: 'verification' },
        state:     { enabled: false, source: 'verification', manualValue: '' },
        serial:    { enabled: false, source: 'intune' },
        model:     { enabled: false, source: 'intune' },
        os:        { enabled: false, source: 'intune' },
        osVersion: { enabled: false, source: 'intune' }
      },
      userValue: 'upn',           // write the assigned user as an address, not a display name
      onlyChanged: true,
      requireIntuneMatch: true,
      skipRetired: true,
      alwaysColumns: defaultAlwaysColumns()
    };
  }

  function matchValue(row, matchField) {
    if (matchField === 'assetTag') return row.assetTag;
    if (matchField === 'serial') return N.clean(row.fs && row.fs.serial) || row.serial;
    return row.name;
  }

  /* Work out every change the current configuration would make.
     Returns [{ row, key, changes: [{field, current, proposed, source, reason}] }] */
  function buildProposals(rows, cfg) {
    cfg = cfg || defaultConfig();
    var out = [];

    rows.forEach(function (row) {
      if (!row.fs) return;                                   // nothing to update
      // Skipping retired assets is about not disturbing genuinely dead kit. An
      // asset flagged "retired but still in use" is demonstrably not dead, and
      // correcting that state is the whole point of the row - so the skip must
      // not remove exactly the assets the rule was written to find.
      if (cfg.skipRetired && N.isRetiredState(row.state) &&
          row.issues.indexOf('state-conflict-active') < 0) return;
      if (cfg.requireIntuneMatch && !row.intune && !row.ver) return;

      var key = matchValue(row, cfg.matchField);
      if (N.isBlank(key)) return;                            // cannot be matched on import

      var changes = [];
      Object.keys(cfg.fields).forEach(function (field) {
        var fcfg = cfg.fields[field];
        if (!fcfg || !fcfg.enabled) return;

        var proposed;
        if (fcfg.source === 'manual') {
          proposed = N.clean(fcfg.manualValue);
          // A fixed value only applies where the rule that motivated it fired.
          if (field === 'state' && row.issues.indexOf('state-conflict-active') < 0) return;
        } else {
          proposed = R.proposedValue(row, field, fcfg.source, { userValue: cfg.userValue });
        }
        if (proposed === null || proposed === undefined || N.isBlank(proposed)) return;

        var current = R.currentValue(row, field);
        if (cfg.onlyChanged) {
          if (field === 'user') {
            if (N.comparePeople(current, proposed) === 'match') return;
          } else if (N.text(current) === N.text(proposed)) return;
        }

        changes.push({
          field: field,
          label: (UPDATABLE.filter(function (u) { return u.field === field; })[0] || {}).label || field,
          current: current === null || current === undefined ? '' : String(current),
          proposed: String(proposed),
          source: fcfg.source,
          reason: reasonFor(row, field)
        });
      });

      if (changes.length) out.push({ row: row, key: key, changes: changes });
    });

    return out;
  }

  function reasonFor(row, field) {
    var codes = row.issues.filter(function (c) {
      var rule = R.BY_CODE[c];
      return rule && rule.fix && rule.fix.field === field;
    });
    if (!codes.length) return '';
    return codes.map(function (c) { return R.BY_CODE[c].label; }).join('; ');
  }

  /* The file to upload to Freshservice: the match column plus one column per
     field being corrected. Rows carry only the fields that actually change,
     so an unrelated blank never overwrites good data. */
  function toImportCsv(proposals, cfg) {
    cfg = cfg || defaultConfig();
    var H = cfg.headers;
    var matchHeader = H[cfg.matchField] || 'Name';

    var fieldsUsed = [];
    proposals.forEach(function (p) {
      p.changes.forEach(function (c) {
        if (fieldsUsed.indexOf(c.field) < 0) fieldsUsed.push(c.field);
      });
    });
    var order = UPDATABLE.map(function (u) { return u.field; });
    fieldsUsed.sort(function (a, b) { return order.indexOf(a) - order.indexOf(b); });

    /* Build the column list once, each with its own accessor, so headers and
       values cannot drift apart. Order: the match column, then the always-on
       columns, then whatever is left of the corrections. */
    var columns = [];
    var taken = {};

    function add(header, get) {
      header = String(header || '').trim();
      if (!header || taken[header]) return;      // never emit a duplicate heading
      taken[header] = true;
      columns.push({ header: header, get: get });
    }

    function changeFor(p, field) {
      return p.changes.filter(function (c) { return c.field === field; })[0] || null;
    }

    add(matchHeader, function (p) { return p.key; });

    // A column says where its value comes from, and that is what it gets. A
    // correction never quietly overrides it - Product is configured to come
    // from Freshservice precisely so that a Model correction cannot rewrite it.
    (cfg.alwaysColumns || []).forEach(function (col) {
      add(col.header, function (p) { return columnValue(p.row, col); });
    });

    // Corrections fill the rows that have one; the rest keep their current
    // Freshservice value so the column is never blank on an unchanged row.
    fieldsUsed.forEach(function (f) {
      add(H[f] || f, function (p) {
        var ch = changeFor(p, f);
        return ch ? ch.proposed : fsFieldValue(p.row, f);
      });
    });

    var headers = columns.map(function (c) { return c.header; });
    var rows = proposals.map(function (p) {
      var obj = {};
      columns.forEach(function (c) { obj[c.header] = c.get(p); });
      return obj;
    });
    return global.CSV.stringify(rows, headers);
  }

  /* Columns whose heading is claimed by a correction, or vice versa - the
     always-column wins, so say so rather than let the correction vanish. */
  function columnConflicts(cfg) {
    var out = [];
    (cfg.alwaysColumns || []).forEach(function (col) {
      if (col.kind === 'fixed') return;
      var f = cfg.fields[col.field];
      if (f && f.enabled) {
        out.push({ header: col.header, field: col.field, source: sourceLabel(col) });
      }
    });
    return out;
  }

  /* How many rows would have nothing in a given column. */
  function blankCount(proposals, col) {
    return proposals.filter(function (p) {
      return N.isBlank(columnValue(p.row, col));
    }).length;
  }

  /* Which mandatory columns are missing from the current configuration. */
  function missingRequired(cfg) {
    var have = {};
    var matchHeader = (cfg.headers[cfg.matchField] || '').trim().toLowerCase();
    if (matchHeader) have[matchHeader] = true;
    (cfg.alwaysColumns || []).forEach(function (c) {
      var h = String(c.header || '').trim().toLowerCase();
      if (h) have[h] = true;
    });
    return ['Workspace', 'Name', 'Product'].filter(function (r) {
      return !have[r.toLowerCase()];
    });
  }

  /* A separate audit file: what changed, from what, to what, and why. */
  function toChangeLogCsv(proposals, cfg) {
    var headers = ['Device name', 'Asset tag', 'Match value', 'Field', 'Current value in Freshservice',
                   'Proposed value', 'Source of proposed value', 'Reason', 'Location', 'Last Intune check-in'];
    var rows = [];
    proposals.forEach(function (p) {
      p.changes.forEach(function (c) {
        rows.push({
          'Device name': p.row.name,
          'Asset tag': p.row.assetTag,
          'Match value': p.key,
          'Field': c.label,
          'Current value in Freshservice': c.current,
          'Proposed value': c.proposed,
          'Source of proposed value': SOURCE_LABELS[c.source] || c.source,
          'Reason': c.reason,
          'Location': p.row.location,
          'Last Intune check-in': p.row.lastCheckIn ? U.fmtDate(p.row.lastCheckIn) : ''
        });
      });
    });
    return global.CSV.stringify(rows, headers);
  }

  /* The sheet that goes out to a service. Freshservice's view of each device
     plus blank columns for the site to complete; drop the completed file back
     in as a verification return and the answers feed the import builder. */
  var PACK_BLANKS = ['Device present?', 'Confirmed location', 'Confirmed user', 'Confirmed status', 'Notes'];

  function sitePackCsv(rows, siteName) {
    var headers = ['Device name', 'Asset tag', 'Serial number', 'Freshservice location',
                   'Freshservice user', 'Intune user', 'Freshservice status',
                   'Last seen by Intune', 'What we think is wrong'].concat(PACK_BLANKS);

    var data = rows.map(function (r) {
      var obj = {
        'Device name': r.name,
        'Asset tag': r.assetTag,
        'Serial number': r.serial,
        'Freshservice location': r.locationRaw,
        'Freshservice user': r.fsUser,
        'Intune user': r.intuneUser,
        'Freshservice status': r.state,
        'Last seen by Intune': r.lastCheckIn ? U.fmtDate(r.lastCheckIn) : 'never',
        'What we think is wrong': r.issues.map(function (c) {
          return (R.BY_CODE[c] || {}).label || c;
        }).join('; ')
      };
      PACK_BLANKS.forEach(function (b) { obj[b] = ''; });
      return obj;
    });
    return global.CSV.stringify(data, headers);
  }

  /* Export whatever the user is currently looking at. */
  function viewCsv(rows, columnKeys) {
    var V = global.Views;
    var headers = columnKeys.map(function (k) {
      return (V.COL_BY_KEY[k] || { label: k }).label;
    });
    var data = rows.map(function (r) {
      var obj = {};
      columnKeys.forEach(function (k, i) {
        var v = V.colValue(r, k);
        if (Array.isArray(v)) {
          v = v.map(function (c) { return (R.BY_CODE[c] || {}).label || c; }).join('; ');
        } else if (v instanceof Date) {
          v = U.fmtDate(v);
        }
        obj[headers[i]] = v === null || v === undefined ? '' : v;
      });
      return obj;
    });
    return global.CSV.stringify(data, headers);
  }

  /* Re-export the location lookup with any coordinates that were found, so
     geocoding is a one-time job. */
  function locationsCsv(locations) {
    var headers = ['Location', 'Address', 'Town', 'Postcode', 'Latitude', 'Longitude',
                   'Expected devices', 'Region', 'Site type', 'Contact'];
    var rows = locations.map(function (l) {
      return {
        'Location': l.location,
        'Address': l.address || '',
        'Town': l.town || '',
        'Postcode': l.postcode || '',
        'Latitude': typeof l.lat === 'number' ? l.lat : '',
        'Longitude': typeof l.lon === 'number' ? l.lon : '',
        'Expected devices': typeof l.expected === 'number' ? l.expected : '',
        'Region': l.region || '',
        'Site type': l.siteType || '',
        'Contact': l.contact || ''
      };
    });
    return global.CSV.stringify(rows, headers);
  }

  global.FSExport = {
    DEFAULT_HEADERS: DEFAULT_HEADERS,
    UPDATABLE: UPDATABLE,
    COLUMN_SOURCES: COLUMN_SOURCES,
    columnValue: columnValue,
    sourceLabel: sourceLabel,
    columnConflicts: columnConflicts,
    blankCount: blankCount,
    fsFieldValue: fsFieldValue,
    defaultAlwaysColumns: defaultAlwaysColumns,
    missingRequired: missingRequired,
    SOURCE_LABELS: SOURCE_LABELS,
    defaultConfig: defaultConfig,
    buildProposals: buildProposals,
    toImportCsv: toImportCsv,
    toChangeLogCsv: toChangeLogCsv,
    sitePackCsv: sitePackCsv,
    viewCsv: viewCsv,
    locationsCsv: locationsCsv,
    matchValue: matchValue
  };
})(window);

</script>
<script>
/* js/netexport.js */
/* The Freshservice import for network assets.

   Unlike the PC import this mostly *creates* records rather than correcting
   them, which changes what matters: Workspace, Name, Asset Type and Product
   are mandatory, and three of those have to match a list Freshservice keeps
   its own way. A value the tool invents there either fails the import or
   quietly creates a duplicate product, so the mappings are explicit, seeded
   from what Freshservice already holds, and the export refuses to run while
   any of them is blank. */
(function (global) {
  'use strict';

  var U = global.U, N = global.Norm;

  /* Rows carry the export file they came from; the app supplies the name the
     user gave that environment, which is what belongs in a Freshservice
     record rather than "managed_devices_root_20260902153522". */
  var labelEnv = function (k) { return k; };

  var DEFAULT_HEADERS = {
    workspace:  'Workspace',
    name:       'Name',
    assetType:  'Asset Type',
    product:    'Product',
    serial:     'Serial Number',
    location:   'Location',
    state:      'Asset State',
    vendor:     'Vendor',
    firmware:   'Firmware Version',
    ip:         'IP Address',
    tag:        'Asset Tag',
    description:'Description'
  };

  /* Every column the import can carry, in the order Freshservice reads them.
     required marks the ones an asset import is rejected without. */
  var COLUMNS = [
    { key: 'workspace',  label: 'Workspace',        required: true,  fixed: true },
    { key: 'name',       label: 'Name',             required: true },
    { key: 'assetType',  label: 'Asset Type',       required: true,  lookup: 'assetTypes' },
    { key: 'product',    label: 'Product',          required: true,  lookup: 'products' },
    { key: 'serial',     label: 'Serial Number' },
    { key: 'location',   label: 'Location',                          lookup: 'locations' },
    { key: 'state',      label: 'Asset State',      fixed: true },
    { key: 'vendor',     label: 'Vendor',           fixed: true },
    { key: 'firmware',   label: 'Firmware Version' },
    { key: 'ip',         label: 'IP Address' },
    { key: 'tag',        label: 'Asset Tag' },
    { key: 'description',label: 'Description' }
  ];

  var LOOKUPS = [
    { id: 'products',   label: 'Platform → Product',
      keyOf: function (r) { return r.platform; },
      keyLabel: 'FortiManager platform', valueLabel: 'Freshservice Product',
      fsValue: function (r) { return r.fsProduct; } },
    { id: 'assetTypes', label: 'Device type → Asset Type',
      keyOf: function (r) { return r.kind; },
      keyLabel: 'Device type', valueLabel: 'Freshservice Asset Type',
      fsValue: function (r) { return r.fsAssetType; } },
    { id: 'locations',  label: 'Site → Location',
      keyOf: function (r) { return r.siteCode; },
      keyLabel: 'Site code', valueLabel: 'Freshservice Location',
      fsValue: function (r) { return r.fsLocation; },
      hint: function (r) { return r.siteName; } }
  ];

  var LOOKUP_BY_ID = {};
  LOOKUPS.forEach(function (l) { LOOKUP_BY_ID[l.id] = l; });

  function defaultConfig() {
    return {
      headers: Object.assign({}, DEFAULT_HEADERS),
      include: {
        workspace: true, name: true, assetType: true, product: true, serial: true,
        location: true, state: true, vendor: true, firmware: true, ip: true,
        tag: false, description: true
      },
      fixed: { workspace: 'IT', state: 'In Use', vendor: 'Fortinet' },
      products: {},
      assetTypes: {},
      locations: {},
      // Fall back to the site list's own name where no Freshservice location
      // has been mapped. Off by default: a name Freshservice does not know
      // is an import error, and a blank is at least visible.
      locationFallback: false,
      describeParent: true
    };
  }

  /* ------------------------------------------------------------- lookups */

  /* Learn each mapping from the records Freshservice already holds: where a
     matched device has a Product, that is by definition a value Freshservice
     accepts for that platform. The most common value wins, and anything with
     no matched example at all is left blank for the user to fill. */
  function seedLookups(rows, config) {
    var out = {};
    LOOKUPS.forEach(function (l) {
      var votes = {};
      (rows || []).forEach(function (r) {
        if (!r.forti || !r.fs) return;                 // only matched rows teach us anything
        var k = l.keyOf(r);
        var v = N.clean(l.fsValue(r));
        if (!k || !v) return;
        votes[k] = votes[k] || {};
        votes[k][v] = (votes[k][v] || 0) + 1;
      });
      var map = Object.assign({}, (config && config[l.id]) || {});
      Object.keys(votes).forEach(function (k) {
        if (map[k]) return;                            // never overwrite a user's own answer
        var best = '', n = 0;
        Object.keys(votes[k]).forEach(function (v) {
          if (votes[k][v] > n) { n = votes[k][v]; best = v; }
        });
        if (best) map[k] = best;
      });
      out[l.id] = map;
    });
    return out;
  }

  /* Every distinct key a set of rows needs, with what we know about it. */
  function lookupKeys(rows, config, lookupId) {
    var l = LOOKUP_BY_ID[lookupId];
    if (!l) return [];
    var seen = {};
    (rows || []).forEach(function (r) {
      if (!r.forti) return;                            // only rows we would export
      var k = l.keyOf(r);
      if (!k) return;
      if (!seen[k]) seen[k] = { key: k, count: 0, hint: '', examples: [] };
      seen[k].count++;
      if (!seen[k].hint && l.hint) seen[k].hint = N.clean(l.hint(r));
      if (seen[k].examples.length < 3) seen[k].examples.push(r.name);
    });
    var map = (config && config[lookupId]) || {};
    return Object.keys(seen).sort().map(function (k) {
      return Object.assign(seen[k], { value: N.clean(map[k]) });
    });
  }

  /* Which lookup keys are still unanswered for these rows. The export is
     blocked while any remain, because a blank Product or Asset Type is a
     rejected import and a blank Location silently loses the site. */
  function unmapped(rows, config) {
    var out = [];
    LOOKUPS.forEach(function (l) {
      var col = COLUMNS.filter(function (c) { return c.lookup === l.id; })[0];
      if (col && config.include && !config.include[col.key]) return;
      lookupKeys(rows, config, l.id).forEach(function (k) {
        if (k.value) return;
        if (l.id === 'locations' && config.locationFallback && k.hint) return;
        out.push({ lookup: l.id, lookupLabel: l.label, key: k.key, hint: k.hint,
                   count: k.count, required: !!(col && col.required) });
      });
    });
    return out;
  }

  /* --------------------------------------------------------------- values */

  function cellValue(row, key, config) {
    var col = COLUMNS.filter(function (c) { return c.key === key; })[0];
    if (!col) return '';
    if (col.fixed) return N.clean(config.fixed[key]);
    if (col.lookup) {
      var l = LOOKUP_BY_ID[col.lookup];
      var k = l.keyOf(row);
      var v = k ? N.clean((config[col.lookup] || {})[k]) : '';
      if (!v && col.lookup === 'locations' && config.locationFallback) v = N.clean(row.siteName);
      return v;
    }
    switch (key) {
      case 'name':     return N.clean(row.name);
      case 'serial':   return N.clean(row.serial);
      case 'firmware': return row.forti ? N.clean(row.forti.firmwareText) : '';
      case 'ip':       return N.clean(row.ipForti || row.ipFs);
      case 'tag':      return N.clean(row.fsTag);
      case 'description': return description(row, config);
      default: return '';
    }
  }

  /* What a switch or AP is plugged into is the single most useful thing to
     record about it, and Freshservice has nowhere better to put it. */
  function description(row, config) {
    if (!config.describeParent) return '';
    var bits = [];
    if (row.parent) bits.push('Managed by ' + row.parent);
    if (row.haRole) bits.push('HA ' + row.haRole.toLowerCase() + (row.haSync ? ' (' + row.haSync + ')' : ''));
    if (row.envs && row.envs.length) {
      bits.push('FortiManager: ' + row.envs.map(labelEnv).join(' and '));
    }
    if (row.siteCode) bits.push('Site ' + row.siteCode);
    return bits.join('; ');
  }

  function activeColumns(config) {
    return COLUMNS.filter(function (c) { return config.include[c.key]; });
  }

  /* A required column left blank on any row is a rejected import, so say
     which rows and which column before anyone uploads it. */
  function blankRequired(rows, config) {
    var out = [];
    activeColumns(config).forEach(function (c) {
      if (!c.required) return;
      var n = 0;
      rows.forEach(function (r) { if (!cellValue(r, c.key, config)) n++; });
      if (n) out.push({ key: c.key, label: header(c, config), rows: n });
    });
    return out;
  }

  function missingRequired(config) {
    return COLUMNS.filter(function (c) { return c.required && !config.include[c.key]; })
                  .map(function (c) { return header(c, config); });
  }

  function header(col, config) {
    return N.clean((config.headers || {})[col.key]) || col.label;
  }

  /* ---------------------------------------------------------------- output */

  function toImportCsv(rows, config) {
    var cols = activeColumns(config);
    // Two columns carrying the same Freshservice header would make the import
    // ambiguous; the first one wins, as it does on the PC side.
    var seen = {}, keep = [];
    cols.forEach(function (c) {
      var h = header(c, config);
      if (seen[h]) return;
      seen[h] = true;
      keep.push({ col: c, header: h });
    });
    var headers = keep.map(function (k) { return k.header; });
    var out = rows.map(function (r) {
      var o = {};
      keep.forEach(function (k) { o[k.header] = cellValue(r, k.col.key, config); });
      return o;
    });
    return global.CSV.stringify(out, headers);
  }

  /* A record of what the import claimed, for the change log. */
  function toManifestCsv(rows, config) {
    var headers = ['Device name', 'Type', 'Serial', 'Platform', 'Site code', 'Site',
                   'Under firewall', 'Environment', 'Firmware', 'Asset Type', 'Product', 'Location'];
    var out = rows.map(function (r) {
      return {
        'Device name': r.name, 'Type': r.kind, 'Serial': r.serial, 'Platform': r.platform,
        'Site code': r.siteCode, 'Site': r.siteName, 'Under firewall': r.parent,
        'Environment': (r.envs || []).map(labelEnv).join(' and '), 'Firmware': r.firmwareText,
        'Asset Type': cellValue(r, 'assetType', config),
        'Product': cellValue(r, 'product', config),
        'Location': cellValue(r, 'location', config)
      };
    });
    return global.CSV.stringify(out, headers);
  }

  global.NetExport = {
    setEnvLabeller: function (fn) { labelEnv = fn || function (k) { return k; }; },
    COLUMNS: COLUMNS,
    LOOKUPS: LOOKUPS,
    LOOKUP_BY_ID: LOOKUP_BY_ID,
    DEFAULT_HEADERS: DEFAULT_HEADERS,
    defaultConfig: defaultConfig,
    seedLookups: seedLookups,
    lookupKeys: lookupKeys,
    unmapped: unmapped,
    cellValue: cellValue,
    activeColumns: activeColumns,
    blankRequired: blankRequired,
    missingRequired: missingRequired,
    header: header,
    toImportCsv: toImportCsv,
    toManifestCsv: toManifestCsv
  };
})(window);

</script>

<script>
/* js/app.js */
/* Application controller: state, the tab views, and everything that wires the
   modules together. */
(function (global) {
  'use strict';

  var U = global.U, V = global.Views, R = global.Rules, N = global.Norm,
      S = global.Schema, C = global.Charts, T = global.Table, FX = global.FSExport,
      NV = global.NetViews, NM = global.NetMatch, NX = global.NetExport, FT = global.Fortinet;

  /* Two populations, reconciled separately. PC_SOURCES feed the device
     reconciliation; NET_SOURCES feed the network one. The location lookup is
     shared, because a site is a site. */
  var PC_SOURCES = ['freshservice', 'intune', 'arcticwolf', 'locations', 'verification'];
  var NET_SOURCES = ['fortimanager', 'fsnetwork'];
  var SOURCE_IDS = PC_SOURCES.concat(NET_SOURCES);

  /* FortiManager is exported per environment, and the two exports do not have
     the same columns, so they are unioned by header name on load rather than
     pasted together in a spreadsheet, where the differing column order would
     silently shift every field. */
  var MULTI_FILE = { fortimanager: true };

  /* A config saved by an older build can be missing whole sections, and a
     shallow merge would leave the UI dereferencing keys that aren't there.
     Merge the nested objects one level down so new fields always get their
     defaults. */
  function mergeFsConfig(saved) {
    var base = FX.defaultConfig();
    if (!saved || typeof saved !== 'object') return base;
    var out = Object.assign({}, base, saved);
    // A config saved before required columns existed has no alwaysColumns; give
    // it the defaults rather than an import that Freshservice will reject.
    if (!Array.isArray(out.alwaysColumns) || !out.alwaysColumns.length) {
      out.alwaysColumns = FX.defaultAlwaysColumns();
    } else {
      // Columns saved before the source could be Intune used kind:'field',
      // which always meant Freshservice.
      out.alwaysColumns = out.alwaysColumns.map(function (c) {
        return c && c.kind === 'field' ? Object.assign({}, c, { kind: 'fs' }) : c;
      });
    }
    delete out.reference;
    delete out.referenceHeaders;

    ['fields', 'headers'].forEach(function (k) {
      out[k] = Object.assign({}, base[k], saved[k] || {});
      if (k === 'fields') {
        // Each field is itself an object; fill in any it is missing.
        Object.keys(base.fields).forEach(function (f) {
          out.fields[f] = Object.assign({}, base.fields[f], (saved.fields || {})[f] || {});
        });
      }
    });
    return out;
  }

  /* Same problem as mergeFsConfig: a config saved by an older build can be
     missing whole sections, and the lookup maps must survive untouched. */
  function mergeNetConfig(saved) {
    var base = NX.defaultConfig();
    if (!saved || typeof saved !== 'object') return base;
    var out = Object.assign({}, base, saved);
    ['headers', 'include', 'fixed'].forEach(function (k) {
      out[k] = Object.assign({}, base[k], saved[k] || {});
    });
    NX.LOOKUPS.forEach(function (l) {
      out[l.id] = Object.assign({}, saved[l.id] || {});
    });
    return out;
  }

  var state = {
    sources: {},                 // id -> { fileName, headers, raw, mapping, records }
    result: null,
    cfg: global.Match.settings(global.Store.get('cfg', null) || {}),
    enabledRules: global.Store.get('enabledRules', {}),
    customViews: global.Store.get('customViews', []),
    fsConfig: mergeFsConfig(global.Store.get('fsConfig', {})),
    tab: 'data',
    viewId: 'attention',
    mapMode: global.Store.get('mapMode', 'count'),
    siteFilter: null,
    issueFilter: null,
    includeOtherOnMap: false,
    exportScope: 'all',         // 'all' | 'view' | 'selection'
    viewSearch: '',             // the quick-search box on the Devices tab
    viewColumns: null,          // the columns the current view is showing
    viewColumnsById: global.Store.get('viewColumns', {}),   // per-view column choices
    selectedIds: [],            // rows ticked on the Devices tab
    persist: global.Store.get('persist', true),   // keep the working set between visits
    author: global.Store.get('author', ''),       // name attached to notes you write
    restoredAt: null,

    /* --- network assets, reconciled separately from the PCs --- */
    netResult: null,
    netWarnings: [],
    netCfg: NM.settings(global.Store.get('netCfg', null) || {}),
    netEnabledRules: global.Store.get('netEnabledRules', {}),
    netViewId: 'net-new',
    netSearch: '',
    netColumns: null,
    netColumnsById: global.Store.get('netColumns', {}),
    netSelectedIds: [],
    netExportScope: 'view',
    netConfig: mergeNetConfig(global.Store.get('netConfig', {})),
    siteOverrides: global.Store.get('siteOverrides', {}),  // device name -> site code
    envLabels: global.Store.get('envLabels', {}),          // export file -> your name for it
    envOrder: global.Store.get('envOrder', [])
  };

  var grid = null;
  var renderNoteBar = function () {};

  /* ==================================================================== */
  /*  data loading                                                        */
  /* ==================================================================== */

  function loadFiles(files, forcedSource) {
    var list = Array.prototype.slice.call(files || []);
    if (!list.length) return;

    /* Whether each population was already complete before this batch. Only a
       population that becomes complete moves you off the Data tab: without
       this, every file dropped after Freshservice and Intune were loaded
       bounced you to the Dashboard, which made adding the FortiManager
       exports afterwards a fight. */
    var hadPc = !!(state.sources.freshservice && state.sources.intune);
    var hadNet = !!(state.sources.fortimanager && state.sources.fsnetwork);

    var jobs = list.map(function (file) {
      return global.CSV.readFile(file).then(function (parsed) {
        if (!parsed.headers.length) throw new Error(file.name + ' has no readable columns.');

        var sourceId = forcedSource;
        if (!sourceId) {
          var det = S.detectSource(parsed.headers);
          sourceId = det.source;
          if (!sourceId) {
            throw new Error('Could not tell what "' + file.name + '" is. Drop it on one of the four ' +
                            'labelled boxes to say which system it came from.');
          }
        }

        var saved = global.Store.getMapping(sourceId, parsed.headers);
        var mapping, filled = [];
        if (saved) {
          var res = S.fillMapping(sourceId, parsed.headers, saved.mapping, saved.knownFields);
          mapping = res.mapping;
          filled = res.filled;
        } else {
          mapping = S.autoMap(sourceId, parsed.headers);
        }

        // Each row remembers which file it came from, so a device can be
        // reported as being in one FortiManager environment or both.
        var envName = environmentKey(file.name);
        // Only a source that is loaded from several files has environments to
        // name; the site list is not one of them.
        if (MULTI_FILE[sourceId]) noteEnvironment(envName);
        parsed.rows.forEach(function (r) { r.__env = envName; });

        var prior = MULTI_FILE[sourceId] ? state.sources[sourceId] : null;
        if (prior && prior.files && prior.files.indexOf(file.name) >= 0) {
          // Re-dropping the same file replaces its rows rather than doubling them.
          prior.raw = prior.raw.filter(function (r) { return r.__env !== envName; });
        }

        var headers = prior ? unionHeaders(prior.headers, parsed.headers) : parsed.headers;
        var rows = prior ? prior.raw.concat(parsed.rows) : parsed.rows;
        var files = prior ? prior.files.filter(function (f) { return f !== file.name; }).concat([file.name]) : [file.name];

        if (prior) {
          /* Adding a second export to a source keeps the mapping already
             decided for the first and fills only what the union has newly
             gained — here, the IP Address column one environment exports and
             the other does not. Starting from a mapping computed for this
             file's headers alone would drop every column the other file
             contributed and then re-find it, which reads as though the saved
             mapping had been wrong. */
          var re = S.fillMapping(sourceId, headers, prior.mapping, null);
          mapping = re.mapping;
          filled = re.filled;
        }

        state.sources[sourceId] = {
          id: sourceId,
          fileName: files.join(' + '),
          files: files,
          headers: headers,
          raw: rows,
          mapping: mapping,
          knownFields: S.fieldKeys(sourceId),
          autoMapped: !saved,
          filled: filled,
          loadedAt: new Date()
        };
        project(sourceId);
        return { sourceId: sourceId, file: file.name, rows: parsed.rows.length,
                 total: rows.length, files: files.length };
      });
    });

    Promise.all(jobs).then(function (results) {
      results.forEach(function (r) {
        U.toast(S.SOURCES[r.sourceId].label + ': ' + U.num(r.rows) + ' rows from ' + r.file +
          (r.files > 1 ? ' (' + U.num(r.total) + ' rows across ' + r.files + ' files)' : ''), 'ok');
        var f = state.sources[r.sourceId] && state.sources[r.sourceId].filled;
        if (f && f.length) {
          U.toast(S.SOURCES[r.sourceId].label + ': matched ' + f.length + ' column' +
            (f.length === 1 ? '' : 's') + ' your saved mapping did not cover — ' +
            f.map(function (x) { return x.label; }).join(', ') +
            '. Check them under "Check columns".', 'ok', 11000);
        }
      });
      recompute();
      if (state.tab === 'data') render();
      if (state.tab === 'data') {
        /* Only leave the Data tab when a population has just become complete.
           Jumping away after the first FortiManager export also took the drop
           boxes off screen before the second environment could be added. */
        var hasPc = !!(state.sources.freshservice && state.sources.intune);
        var hasNet = !!(state.sources.fortimanager && state.sources.fsnetwork);
        if (hasPc && !hadPc) setTab('dashboard');
        else if (hasNet && !hadNet) setTab('network');
      }
    }).catch(function (err) {
      U.toast(err.message || String(err), 'err', 8000);
      render();
    });
  }

  /* Two exports of the same system rarely offer the same columns — the two
     FortiManager environments differ by four — so the union is by header
     name. Order follows the first file, with anything new appended. */
  function unionHeaders(a, b) {
    var out = (a || []).slice();
    (b || []).forEach(function (h) { if (out.indexOf(h) < 0) out.push(h); });
    return out;
  }

  /* Which environment a row came from.

     FortiManager names every export the same way — managed_devices_root_ plus
     a timestamp — so the file name says nothing about which environment it is,
     and two exports taken the same day would collapse into one label. The row
     is therefore tagged with the file name, which is unique, and the file name
     is what the user renames to something meaningful on the Data tab. */
  function environmentKey(fileName) {
    return String(fileName || '').replace(/\.[^.]+$/, '');
  }

  function envLabel(key) {
    var named = state.envLabels[key];
    if (named) return named;
    var order = state.envOrder.indexOf(key);
    return order >= 0 ? 'Export ' + (order + 1) : key;
  }

  function noteEnvironment(key) {
    if (state.envOrder.indexOf(key) < 0) state.envOrder.push(key);
  }

  function project(sourceId) {
    var src = state.sources[sourceId];
    if (!src) return;
    src.records = S.project(sourceId, src.raw, src.mapping);
  }

  function recompute() {
    var data = {};
    SOURCE_IDS.forEach(function (id) {
      data[id] = state.sources[id] ? state.sources[id].records : [];
    });
    if (!data.freshservice.length && !data.intune.length) {
      state.result = null;
    } else {
      state.result = R.apply(global.Match.reconcile(data, state.cfg), state.cfg, state.enabledRules);
    }
    recomputeNet(data);
    saveWorkingSet();
  }

  /* The site list keyed by site code, which is how network devices find their
     location. Built from the same location lookup the map uses. */
  function siteIndex() {
    var src = state.sources.locations;
    var out = {};
    if (!src || !src.records) return out;
    src.records.forEach(function (r) {
      var code = normCode(r.siteCode) || codeOf(r);
      if (!code) return;
      out[code] = {
        code: code, name: N.clean(r.location), town: N.clean(r.town),
        postcode: N.clean(r.postcode), region: N.clean(r.region),
        lat: r.lat, lon: r.lon, subnet: r.subnet
      };
    });
    return out;
  }

  /* A site code is whatever the lookup calls it, normalised to three digits so
     "1", "01" and "001" are the same site. */
  function normCode(v) {
    v = String(v == null ? '' : v).trim();
    if (!v) return '';
    return /^\d+$/.test(v) ? v.replace(/^0+/, '').padStart(3, '0') : v;
  }

  /* Fallback for a site list loaded before the code column existed in the
     schema, or one whose code column the mapper could not place. */
  function codeOf(rec) {
    var raw = rec._raw || {};
    var v = '';
    Object.keys(raw).forEach(function (h) {
      if (v) return;
      if (/^\s*site\s*code\s*$/i.test(h) || /^\s*code\s*$/i.test(h)) v = raw[h];
    });
    return normCode(v);
  }

  function recomputeNet(data) {
    data = data || {};
    var forti = data.fortimanager || [];
    var fsnet = data.fsnetwork || [];
    if (!forti.length && !fsnet.length) {
      state.netResult = null;
      state.netWarnings = [];
      return;
    }
    var sites = siteIndex();
    var flat = FT.flatten(forti, { sites: sites, overrides: state.siteOverrides });
    state.netWarnings = flat.warnings;
    state.netResult = NM.apply(
      NM.reconcile(flat.devices, fsnet, state.netCfg, sites),
      state.netCfg, state.netEnabledRules);
    // Learn any lookup values the Freshservice records already answer, without
    // ever overwriting one the user typed.
    Object.assign(state.netConfig, NX.seedLookups(state.netResult.rows, state.netConfig));
  }

  /* ------------------------------------------------------ working set */

  function workingSet() {
    var payload = {
      version: 1,
      savedAt: new Date().toISOString(),
      savedBy: state.author || '',
      cfg: state.cfg,
      enabledRules: state.enabledRules,
      customViews: state.customViews,
      fsConfig: state.fsConfig,
      netCfg: state.netCfg,
      netEnabledRules: state.netEnabledRules,
      netConfig: state.netConfig,
      siteOverrides: state.siteOverrides,
      envLabels: state.envLabels,
      envOrder: state.envOrder,
      sources: {}
    };
    SOURCE_IDS.forEach(function (id) {
      var src = state.sources[id];
      if (!src) return;
      payload.sources[id] = {
        fileName: src.fileName, files: src.files || null, headers: src.headers,
        mapping: src.mapping, raw: src.raw,
        knownFields: src.knownFields || S.fieldKeys(id)
      };
    });
    return payload;
  }

  var persistFailed = false;
  var saveWorkingSet = U.debounce(function () {
    if (!state.persist || !global.DB.available) return;
    if (!Object.keys(state.sources).length) return;
    global.DB.save(workingSet()).then(function () {
      state.savedAt = new Date();
      persistFailed = false;
    }).catch(function (err) {
      if (persistFailed) return;              // say it once, not on every keystroke
      persistFailed = true;
      U.toast(err.message + ' Your data is still loaded in this tab, but it will not come back ' +
              'next time — use "Save project" instead.', 'err', 10000);
    });
  }, 900);

  function restoreWorkingSet() {
    if (!state.persist || !global.DB.available) return Promise.resolve(false);
    var restoredFills = [];
    return global.DB.load().then(function (payload) {
      if (!payload || !payload.sources || !Object.keys(payload.sources).length) return false;
      Object.keys(payload.sources).forEach(function (id) {
        var src = payload.sources[id];
        if (!src || !src.raw) return;
        // A stored working set carries the mapping the build that saved it
        // produced, so fields added since are missing from it. Fill those in
        // rather than leaving their columns quietly blank.
        var res = S.fillMapping(id, src.headers, src.mapping, src.knownFields);
        state.sources[id] = {
          id: id, fileName: src.fileName, files: src.files || [src.fileName],
          headers: src.headers,
          mapping: res.mapping, raw: src.raw,
          knownFields: S.fieldKeys(id),
          filled: res.filled
        };
        if (res.filled.length) restoredFills.push({ source: id, filled: res.filled });
        project(id);
      });
      if (payload.cfg) state.cfg = global.Match.settings(payload.cfg);
      if (payload.enabledRules) state.enabledRules = payload.enabledRules;
      if (payload.customViews) state.customViews = payload.customViews;
      if (payload.fsConfig) state.fsConfig = mergeFsConfig(payload.fsConfig);
      if (payload.netCfg) state.netCfg = NM.settings(payload.netCfg);
      if (payload.netEnabledRules) state.netEnabledRules = payload.netEnabledRules;
      if (payload.netConfig) state.netConfig = mergeNetConfig(payload.netConfig);
      if (payload.siteOverrides) state.siteOverrides = payload.siteOverrides;
      if (payload.envLabels) state.envLabels = payload.envLabels;
      if (payload.envOrder) state.envOrder = payload.envOrder;
      state.restoredAt = payload.savedAt ? new Date(payload.savedAt) : null;
      state.savedAt = state.restoredAt;
      state.restoredFills = restoredFills;
      recompute();
      return true;
    }).catch(function () { return false; });
  }

  function forgetWorkingSet(alsoClearLoaded) {
    return global.DB.clear().then(function () {
      state.savedAt = null;
      state.restoredAt = null;
      if (alsoClearLoaded) {
        state.sources = {};
        state.result = null;
        state.siteFilter = null;
        state.issueFilter = null;
        global.EstateMap.reset();
      }
      render();
    });
  }

  function clearSource(id) {
    delete state.sources[id];
    recompute();
    if (!Object.keys(state.sources).length) global.DB.clear();
    render();
  }

  /* ==================================================================== */
  /*  views + filtering                                                   */
  /* ==================================================================== */

  function allViews() {
    return V.BUILT_IN.concat(state.customViews.map(function (v) {
      return Object.assign({}, v, { isCustom: true });
    }));
  }

  function viewById(id) {
    return allViews().filter(function (v) { return v.id === id; })[0] || V.BUILT_IN[1];
  }

  /* withSearch reproduces the quick-search box as well as the view's own
     filter, so "what the export covers" can be made to equal "what I was
     looking at". */
  function rowsForView(view, withSearch) {
    if (!state.result) return [];
    var rows = V.applyView(view, state.result.rows);
    if (state.siteFilter) {
      rows = rows.filter(function (r) { return r.locationKey === state.siteFilter.key; });
    }
    if (state.issueFilter) {
      rows = rows.filter(function (r) { return r.issues.indexOf(state.issueFilter) >= 0; });
    }
    if (withSearch && state.viewSearch) {
      rows = V.searchRows(rows, state.viewSearch);
    }
    return rows;
  }

  /* ---------------------------------------------------- network views */

  function netViews() { return NV.BUILT_IN; }

  function netViewById(id) {
    return netViews().filter(function (v) { return v.id === id; })[0] || NV.BUILT_IN[0];
  }

  function netRowsForView(view, withSearch) {
    if (!state.netResult) return [];
    var rows = NV.applyView(view, state.netResult.rows);
    if (withSearch && state.netSearch) rows = NV.searchRows(rows, state.netSearch);
    return rows;
  }

  function netViewCount(view) {
    if (!state.netResult) return 0;
    try { return NV.applyView(view, state.netResult.rows).length; } catch (e) { return 0; }
  }

  function netSelectedRows() {
    if (!state.netResult || !state.netSelectedIds.length) return [];
    var wanted = {};
    state.netSelectedIds.forEach(function (id) { wanted[id] = true; });
    return state.netResult.rows.filter(function (r) { return wanted[r.id]; });
  }

  function setNetView(id) {
    if (id !== state.netViewId) {
      state.netSearch = '';
      state.netSelectedIds = [];
    }
    state.netViewId = id;
    setTab('network');
  }

  function selectedRows() {
    if (!state.result || !state.selectedIds.length) return [];
    var wanted = {};
    state.selectedIds.forEach(function (id) { wanted[id] = true; });
    return state.result.rows.filter(function (r) { return wanted[r.id]; });
  }

  function viewCount(view) {
    if (!state.result) return 0;
    try { return V.applyView(view, state.result.rows).length; } catch (e) { return 0; }
  }

  /* ==================================================================== */
  /*  shell                                                               */
  /* ==================================================================== */

  function setTab(tab) {
    state.tab = tab;
    render();
    if (tab === 'map') global.EstateMap.invalidate();
  }

  function setView(id) {
    if (id !== state.viewId) {
      // A search typed against one view rarely means the same thing in
      // another, and silently carrying it over would hide rows.
      state.viewSearch = '';
      state.selectedIds = [];
    }
    state.viewId = id;
    state.issueFilter = null;
    setTab('devices');
  }

  function renderHeader() {
    var host = U.qs('#header');
    U.clear(host);

    var tabs = [
      ['data', 'Data'],
      ['dashboard', 'Dashboard'],
      ['dupes', 'Duplicates'],
      ['devices', 'Devices'],
      ['network', 'Network'],
      ['map', 'Map'],
      ['export', 'Freshservice import'],
      ['settings', 'Settings']
    ];
    tabs.forEach(function (t) {
      // The two populations load independently: network exports alone should
      // open the Network tab without the PC reconciliation being present.
      var needs = { network: !!state.netResult, data: true, settings: true };
      var disabled = !(Object.prototype.hasOwnProperty.call(needs, t[0]) ? needs[t[0]] : !!state.result);
      host.appendChild(U.el('button', {
        class: 'tab' + (state.tab === t[0] ? ' active' : ''),
        disabled: disabled,
        style: disabled ? { opacity: '0.4', cursor: 'not-allowed' } : null,
        onclick: function () { if (!disabled) setTab(t[0]); }
      }, t[1]));
    });

    host.appendChild(U.el('div', { class: 'spacer' }));

    if (state.tab === 'network' && state.netResult) {
      host.appendChild(U.el('span', { class: 'hint', style: { whiteSpace: 'nowrap' } },
        U.num(state.netResult.rows.length) + ' network devices \u00b7 ' +
        U.num(state.netResult.rows.filter(function (r) { return r.issueCount; }).length) + ' flagged'));
    } else if (state.result) {
      host.appendChild(U.el('span', { class: 'hint', style: { whiteSpace: 'nowrap' } },
        U.num(state.result.rows.length) + ' devices \u00b7 ' +
        U.num(state.result.rows.filter(function (r) { return r.issueCount; }).length) + ' flagged'));
    }

    host.appendChild(U.el('button', {
      class: 'btn sm ghost', title: 'Save everything loaded, including the data, to a file you can reopen later',
      onclick: saveProject
    }, 'Save project'));
    host.appendChild(U.el('button', {
      class: 'btn sm ghost', title: 'Reopen a saved project file', onclick: openProject
    }, 'Open'));

    var dark = document.documentElement.getAttribute('data-theme');
    host.appendChild(U.el('button', {
      class: 'btn sm ghost', title: 'Switch between light and dark',
      onclick: function () {
        var next = dark === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        global.Store.set('theme', next);
        render();
      }
    }, dark === 'dark' ? '☀' : '☾'));
  }

  function renderSidebar() {
    var host = U.qs('#sidebar');
    U.clear(host);

    /* sources */
    var sec = U.el('div', { class: 'side-section' });
    sec.appendChild(U.el('div', { class: 'side-head' }, 'Sources'));
    SOURCE_IDS.forEach(function (id) {
      var src = state.sources[id];
      var def = S.SOURCES[id];
      sec.appendChild(U.el('button', {
        class: 'side-item',
        onclick: function () { setTab('data'); }
      }, [
        U.el('span', { class: 'dot', style: { background: src ? 'var(--good)' : 'var(--surface-3)' } }),
        U.el('span', {}, def.short),
        src ? U.el('span', { class: 'count' }, U.num(src.records ? src.records.length : 0)) : U.el('span', { class: 'count' }, '—')
      ]));
    });
    host.appendChild(sec);

    if (state.netResult) {
      var nsec = U.el('div', { class: 'side-section' });
      nsec.appendChild(U.el('div', { class: 'side-head' }, 'Network views'));
      netViews().forEach(function (v) {
        var n = netViewCount(v);
        nsec.appendChild(U.el('button', {
          class: 'side-item' + (state.netViewId === v.id && state.tab === 'network' ? ' active' : ''),
          title: v.description || '',
          onclick: function () { setNetView(v.id); }
        }, [
          U.el('span', {}, v.name),
          U.el('span', { class: 'count' }, U.num(n))
        ]));
      });
      host.appendChild(nsec);
    }

    if (!state.result) return;

    /* views */
    var vsec = U.el('div', { class: 'side-section' });
    vsec.appendChild(U.el('div', { class: 'side-head' }, [
      'Views',
      U.el('button', {
        class: 'btn sm ghost', style: { padding: '0 4px' },
        title: 'Create a view with your own filter',
        // Wrapped, not passed by reference: the handler's first argument would
        // otherwise be the click event, which openViewBuilder reads as a view
        // to edit.
        onclick: function () { openViewBuilder(); }
      }, '+')
    ]));
    allViews().forEach(function (v) {
      var n = viewCount(v);
      vsec.appendChild(U.el('button', {
        class: 'side-item' + (state.viewId === v.id && state.tab === 'devices' ? ' active' : ''),
        title: v.description || '',
        onclick: function () { setView(v.id); }
      }, [
        U.el('span', {}, v.name),
        U.el('span', { class: 'count' }, U.num(n)),
        U.el('span', {
          class: 'del',
          title: v.isCustom ? 'Edit this view' : 'See how this view is defined',
          onclick: function (e) {
            e.stopPropagation();
            openViewBuilder(v, v.isCustom ? 'edit' : 'inspect');
          }
        }, '\u2699'),
        v.isCustom ? U.el('span', {
          class: 'del', title: 'Delete this view',
          onclick: function (e) {
            e.stopPropagation();
            if (!confirm('Delete the view "' + v.name + '"? Devices and notes are not affected.')) return;
            state.customViews = state.customViews.filter(function (x) { return x.id !== v.id; });
            global.Store.set('customViews', state.customViews);
            delete state.viewColumnsById[v.id];
            global.Store.set('viewColumns', state.viewColumnsById);
            if (state.viewId === v.id) state.viewId = 'attention';
            render();
          }
        }, '✕') : null
      ]));
    });
    host.appendChild(vsec);

    /* active filters */
    if (state.siteFilter || state.issueFilter) {
      var fsec = U.el('div', { class: 'side-section' });
      fsec.appendChild(U.el('div', { class: 'side-head' }, 'Active filter'));
      if (state.siteFilter) {
        fsec.appendChild(U.el('button', {
          class: 'side-item',
          onclick: function () { state.siteFilter = null; render(); }
        }, [U.el('span', {}, 'Site: ' + U.truncate(state.siteFilter.name, 18)), U.el('span', { class: 'del', style: { opacity: 1 } }, '✕')]));
      }
      if (state.issueFilter) {
        fsec.appendChild(U.el('button', {
          class: 'side-item',
          onclick: function () { state.issueFilter = null; render(); }
        }, [U.el('span', {}, (R.BY_CODE[state.issueFilter] || {}).label || state.issueFilter), U.el('span', { class: 'del', style: { opacity: 1 } }, '✕')]));
      }
      host.appendChild(fsec);
    }
  }

  /* Emptying the page fires change/blur on whichever field had focus, and those
     handlers commit their value and ask for a re-render - from inside the
     render that is already tearing the page down. Collapse that into one
     re-render after the current pass instead of letting them interleave. */
  var rendering = false;
  var renderQueued = false;

  function render() {
    if (rendering) { renderQueued = true; return; }
    rendering = true;
    try {
      renderHeader();
      renderSidebar();
      var main = U.qs('#main');
      U.clear(main);
      /* Every page but these three reads a reconciliation result and would
         throw without one. The tabs are disabled in that state, but a tab can
         also be reached from a restored session or a stale state, so the
         fallback lives here rather than in eight separate guards. */
      var page = {
        data: renderData,
        dashboard: renderDashboard,
        dupes: renderDupes,
        devices: renderDevices,
        network: renderNetwork,
        map: renderMap,
        export: renderExport,
        settings: renderSettings
      }[state.tab] || renderData;
      var ready = state.tab === 'data' || state.tab === 'settings'
        ? true
        : (state.tab === 'network' ? !!state.netResult : !!state.result);
      (ready ? page : renderData)(main);
    } finally {
      rendering = false;
    }
    if (renderQueued) { renderQueued = false; render(); }
  }

  /* ==================================================================== */
  /*  tab: data                                                           */
  /* ==================================================================== */

  function dropZone(sourceId) {
    var def = S.SOURCES[sourceId];
    var src = state.sources[sourceId];

    var input = U.el('input', {
      type: 'file', accept: '.csv,.txt,.tsv,.xlsx,.xls',
      multiple: !!MULTI_FILE[sourceId], style: { display: 'none' },
      onchange: function (e) { loadFiles(e.target.files, sourceId); e.target.value = ''; }
    });

    var zone = U.el('div', {
      class: 'drop' + (src ? ' loaded' : ''),
      tabindex: '0', role: 'button',
      onclick: function () { input.click(); },
      onkeydown: function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); input.click(); } },
      ondragover: function (e) { e.preventDefault(); zone.classList.add('over'); },
      ondragleave: function () { zone.classList.remove('over'); },
      ondrop: function (e) {
        e.preventDefault(); zone.classList.remove('over');
        loadFiles(e.dataTransfer.files, sourceId);
      }
    }, [
      U.el('div', { class: 'dz-title' }, def.label),
      U.el('div', { class: 'dz-sub' }, def.hint),
      src ? U.el('div', { class: 'dz-file' },
        MULTI_FILE[sourceId] && src.files && src.files.length > 1
          ? src.files.length + ' files loaded'
          : src.fileName) : null,
      src ? U.el('div', { class: 'dz-meta' }, U.num(src.raw.length) + ' rows \u00b7 ' +
            Object.keys(src.mapping).length + ' of ' + def.fields.length + ' columns mapped') : null,
      input
    ]);

    var wrap = U.el('div', {}, zone);
    if (src) {
      wrap.appendChild(U.el('div', { class: 'row tight', style: { marginTop: '8px', justifyContent: 'center' } }, [
        U.el('button', { class: 'btn sm', onclick: function () { openMappingModal(sourceId); } }, 'Check columns'),
        U.el('button', { class: 'btn sm ghost', onclick: function () { clearSource(sourceId); } }, 'Remove')
      ]));
      if (MULTI_FILE[sourceId] && src.files) {
        var envs = U.el('div', { style: { marginTop: '8px' } });
        envs.appendChild(U.el('div', { class: 'hint', style: { textAlign: 'center' } },
          src.files.length > 1
            ? 'Both exports are held together, unioned by column name.'
            : 'Drop the other environment\u2019s export here too \u2014 it is added, not replaced.'));
        src.files.forEach(function (fileName) {
          var key = environmentKey(fileName);
          var n = src.raw.filter(function (r) { return r.__env === key; }).length;
          envs.appendChild(U.el('div', { class: 'row tight', style: { marginTop: '4px' } }, [
            U.el('input', {
              type: 'text', value: envLabel(key), title: fileName,
              placeholder: 'Name this environment\u2026',
              style: { flex: '1', minWidth: '0', fontSize: '11.5px' },
              onchange: function (e) {
                var v = e.target.value.trim();
                if (v) state.envLabels[key] = v; else delete state.envLabels[key];
                global.Store.set('envLabels', state.envLabels);
                global.Store.set('envOrder', state.envOrder);
                render();
              }
            }),
            U.el('span', { class: 'hint', style: { whiteSpace: 'nowrap' } }, U.num(n) + ' rows')
          ]));
        });
        wrap.appendChild(envs);
      }

      var missingReq = def.fields.filter(function (f) { return f.required && !src.mapping[f.key]; });
      if (missingReq.length) {
        wrap.appendChild(U.el('div', {
          class: 'hint', style: { color: 'var(--critical)', textAlign: 'center', marginTop: '4px' }
        }, 'Missing required column: ' + missingReq.map(function (f) { return f.label; }).join(', ')));
      }
    }
    return wrap;
  }

  function renderData(main) {
    main.appendChild(U.el('div', { class: 'page-head' }, [
      U.el('h1', {}, 'Load your exports'),
      U.el('div', { class: 'sub' },
        'Drop the CSVs straight in. Nothing is uploaded anywhere — the files are read in this browser tab and the ' +
        'data never leaves your machine.' +
        (state.persist && global.DB.available
          ? ' It is kept in this browser so it is still here when you come back.'
          : ' It is held in this tab only, so closing it loses the data.'))
    ]));

    if (state.result && global.DB.available) {
      main.appendChild(U.el('div', {
        class: 'row', style: { marginBottom: '14px', fontSize: '12.5px', color: 'var(--text-secondary)' }
      }, [
        U.el('span', { class: 'badge ' + (state.persist ? 'ok' : 'low') }, [
          U.el('span', { class: 'sev sev-' + (state.persist ? 'ok' : 'low') }),
          state.persist ? 'Saved on this computer' : 'Not being saved'
        ]),
        state.persist && state.savedAt
          ? U.el('span', {}, 'last saved ' + state.savedAt.toLocaleString('en-GB', {
              day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }))
          : null,
        state.persist ? U.el('button', {
          class: 'btn sm ghost',
          onclick: function () {

        }, 'Clear and start again') : null,

          'Load a small set of made-up data to see what the tool does. It has the same shape as the real exports, ' +
          'with the same kinds of problems deliberately built in.'),

      ]));

    if (state.result) {
