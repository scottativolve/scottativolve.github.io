<script>
/* js/views.js */
/* Columns, the filter engine, and the built-in + saved views. */
(function (global) {
  'use strict';

  var U = global.U, N = global.Norm;

  /* ------------------------------------------------------------ columns */

  var COLUMNS = [
    { key: 'notes',       label: 'Notes',         width: 64, type: 'notes',
      get: function (r) { return global.Notes.countFor(r); },
      sortKey: function (r) { return -global.Notes.countFor(r); } },
    { key: 'name',        label: 'Device name',   width: 150, get: function (r) { return r.name; }, strong: true },
    { key: 'severity',    label: 'Severity',      width: 90,  get: function (r) { return r.severity || ''; },
      sortKey: function (r) { return r.severity ? -global.Rules.SEVERITY_ORDER[r.severity] : 9; } },
    { key: 'issues',      label: 'Issues',        width: 300, type: 'issues', get: function (r) { return r.issues; },
      sortKey: function (r) { return -r.issueCount; } },
    { key: 'issueCount',  label: 'Issue count',   width: 70,  type: 'number', get: function (r) { return r.issueCount; } },
    { key: 'location',    label: 'Location',      width: 150, get: function (r) { return r.location; } },
    { key: 'locationRaw', label: 'Location (raw)',width: 190, get: function (r) { return r.locationRaw; } },
    { key: 'region',      label: 'Region',        width: 120, get: function (r) { return r.region; } },
    { key: 'fsUser',      label: 'FS user',       width: 150, get: function (r) { return r.fsUser; } },
    { key: 'intuneUser',  label: 'Intune user',   width: 150, get: function (r) { return r.intuneUser; } },
    { key: 'userStatus',  label: 'User agrees?',  width: 100, get: function (r) { return r.userStatus; } },
    { key: 'lastLoginBy', label: 'Last login by', width: 150, get: function (r) { return r.lastLoginBy; } },
    { key: 'loginVsAssigned', label: 'Login vs assigned', width: 120, get: function (r) { return r.loginVsAssigned; } },
    { key: 'state',       label: 'FS state',      width: 110, get: function (r) { return r.state; } },
    { key: 'assetType',   label: 'Asset type',    width: 120, get: function (r) { return r.assetType; } },
    { key: 'serial',      label: 'Serial',        width: 130, get: function (r) { return r.serial; } },
    { key: 'assetTag',    label: 'Asset tag',     width: 110, get: function (r) { return r.assetTag; } },
    { key: 'model',       label: 'Model',         width: 160, get: function (r) { return r.model; } },
    { key: 'os',          label: 'OS',            width: 130, get: function (r) { return r.os; } },
    { key: 'osVersion',   label: 'OS version',    width: 110, get: function (r) { return r.osVersion; } },
    { key: 'compliance',  label: 'Compliance',    width: 110, get: function (r) { return r.compliance; } },
    { key: 'ownership',   label: 'Ownership',     width: 100, get: function (r) { return r.ownership; } },
    { key: 'ip',          label: 'Last seen IP',  width: 120, get: function (r) { return r.ip; } },
    { key: 'ipSiteName',  label: 'Site by IP',    width: 150, get: function (r) { return r.ipSiteName; } },
    { key: 'ipStatus',    label: 'IP vs location',width: 130, get: function (r) { return r.ipStatus; } },
    { key: 'ipSubnet',    label: 'Matched subnet',width: 170, get: function (r) { return r.ipSubnet; } },
    { key: 'ipFrom',      label: 'IP reported by',width: 110, get: function (r) { return r.ipFrom; } },
    { key: 'lastCheckIn', label: 'Intune check-in', width: 120, type: 'date', get: function (r) { return r.lastCheckIn; } },
    { key: 'daysSinceCheckIn', label: 'Days since check-in', width: 90, type: 'number', get: function (r) { return r.daysSinceCheckIn; } },
    { key: 'lastAudit',   label: 'FS last audit', width: 120, type: 'date', get: function (r) { return r.lastAudit; } },
    { key: 'department',  label: 'Department',    width: 130, get: function (r) { return r.department; } },
    { key: 'matchType',   label: 'Matched on',    width: 100, get: function (r) { return r.matchType; } },
    { key: 'verLocation', label: 'Site confirmed location', width: 150, get: function (r) { return r.ver ? N.clean(r.ver.confirmedLocation) : ''; } },
    { key: 'verUser',     label: 'Site confirmed user', width: 150, get: function (r) { return r.ver ? N.clean(r.ver.confirmedUser) : ''; } },
    { key: 'verNotes',    label: 'Site notes',    width: 200, get: function (r) { return r.ver ? N.clean(r.ver.notes) : ''; } },
    { key: 'address',     label: 'Address',       width: 220, get: function (r) { return r.site ? [N.clean(r.site.address), N.clean(r.site.town), N.clean(r.site.postcode)].filter(Boolean).join(', ') : ''; } },
    { key: 'postcode',    label: 'Postcode',      width: 90,  get: function (r) { return r.site ? N.clean(r.site.postcode) : ''; } }
  ];

  var COL_BY_KEY = {};
  COLUMNS.forEach(function (c) { COL_BY_KEY[c.key] = c; });

  function colValue(row, key) {
    var c = COL_BY_KEY[key];
    return c ? c.get(row) : '';
  }

  /* ------------------------------------------------------ filter engine */

  var OPERATORS = [
    { op: 'is',          label: 'is',             needsValue: true },
    { op: 'isNot',       label: 'is not',         needsValue: true },
    { op: 'contains',    label: 'contains',       needsValue: true },
    { op: 'notContains', label: 'does not contain', needsValue: true },
    { op: 'empty',       label: 'is empty',       needsValue: false },
    { op: 'notEmpty',    label: 'is not empty',   needsValue: false },
    { op: 'gt',          label: 'is more than',   needsValue: true, numeric: true },
    { op: 'lt',          label: 'is less than',   needsValue: true, numeric: true },
    { op: 'olderThan',   label: 'is older than (days)', needsValue: true, numeric: true },
    { op: 'newerThan',   label: 'is newer than (days)', needsValue: true, numeric: true }
  ];

  function testCondition(row, cond) {
    // Pseudo-field: issue codes.
    if (cond.field === '__issue') {
      var has = row.issues.indexOf(cond.value) >= 0;
      return cond.op === 'isNot' ? !has : has;
    }
    if (cond.field === '__anyIssue') {
      return cond.op === 'isNot' ? row.issueCount === 0 : row.issueCount > 0;
    }

    var v = colValue(row, cond.field);
    var col = COL_BY_KEY[cond.field] || {};
    var isDate = col.type === 'date' || v instanceof Date;
    var target = cond.value;

    switch (cond.op) {
      case 'empty':    return v === null || v === undefined || v === '' || (Array.isArray(v) && !v.length);
      case 'notEmpty': return !(v === null || v === undefined || v === '' || (Array.isArray(v) && !v.length));
      case 'gt':       return v !== null && v !== '' && Number(v) > Number(target);
      case 'lt':       return v !== null && v !== '' && Number(v) < Number(target);
      case 'olderThan': {
        var d1 = U.daysSince(v);
        return d1 !== null && d1 > Number(target);
      }
      case 'newerThan': {
        var d2 = U.daysSince(v);
        return d2 !== null && d2 < Number(target);
      }
      default: {
        var s = (Array.isArray(v) ? v.join(' ') : (isDate ? U.fmtDate(v) : String(v === null || v === undefined ? '' : v))).toLowerCase();
        var t = String(target === null || target === undefined ? '' : target).toLowerCase().trim();
        if (cond.op === 'is') return s === t;
        if (cond.op === 'isNot') return s !== t;
        if (cond.op === 'contains') return s.indexOf(t) >= 0;
        if (cond.op === 'notContains') return s.indexOf(t) < 0;
        return true;
      }
    }
  }

  function testFilter(row, filter) {
    if (!filter || !filter.conditions || !filter.conditions.length) return true;
    var results = filter.conditions.map(function (c) { return testCondition(row, c); });
    return filter.match === 'any' ? results.some(Boolean) : results.every(Boolean);
  }

  /* ------------------------------------------------------- built-in views */

  var BASE_COLS = ['name', 'location', 'fsUser', 'intuneUser', 'state', 'lastCheckIn', 'issues'];

  var BUILT_IN = [
    {
      id: 'all',
      name: 'All devices',
      description: 'Every record from both systems after matching, whether or not anything is wrong with it.',
      columns: ['name', 'severity', 'location', 'fsUser', 'intuneUser', 'state', 'serial', 'lastCheckIn', 'matchType', 'issues'],
      filter: null
    },
    {
      id: 'attention',
      name: 'Needs attention',
      description: 'Anything with at least one open discrepancy, worst first. The general working list.',
      columns: ['name', 'severity', 'location', 'fsUser', 'intuneUser', 'state', 'lastCheckIn', 'issues'],
      filter: { match: 'all', conditions: [{ field: '__anyIssue', op: 'is' }] },
      sort: { key: 'severity', dir: 'asc' }
    },
    {
      id: 'fix-user',
      name: 'Fix: assigned user',
      description: 'Freshservice disagrees with Intune about who has the device, or has nobody recorded at all. These are the rows the import file can correct automatically.',
      columns: ['name', 'location', 'fsUser', 'intuneUser', 'lastLoginBy', 'userStatus', 'lastCheckIn', 'issues'],
      filter: { match: 'any', conditions: [
        { field: '__issue', op: 'is', value: 'user-mismatch' },
        { field: '__issue', op: 'is', value: 'login-differs-from-assigned' },
        { field: '__issue', op: 'is', value: 'user-missing-fs' },
        { field: '__issue', op: 'is', value: 'user-similar' }
      ] }
    },
    {
      id: 'fix-location',
      name: 'Fix: location',
      description: 'Assets with no location, or a location that is not in the lookup file. These are the ones to send out to services to confirm.',
      columns: ['name', 'locationRaw', 'fsUser', 'intuneUser', 'state', 'lastCheckIn', 'issues'],
      filter: { match: 'any', conditions: [
        { field: '__issue', op: 'is', value: 'location-missing' },
        { field: '__issue', op: 'is', value: 'location-unknown' }
      ] }
    },
    {
      id: 'not-in-intune',
      name: 'Missing from Intune',
      description: 'Freshservice holds the asset but Intune does not manage it. Not enrolled, disposed of without an update, or switched off long-term.',
      columns: ['name', 'location', 'fsUser', 'state', 'assetType', 'serial', 'lastAudit', 'issues'],
      filter: { match: 'all', conditions: [{ field: '__issue', op: 'is', value: 'not-in-intune' }] }
    },
    {
      id: 'not-in-fs',
      name: 'Missing from Freshservice',
      description: 'Intune manages the device but there is no asset record. Usually a missing Freshservice agent.',
      columns: ['name', 'intuneUser', 'model', 'os', 'serial', 'lastCheckIn', 'ownership', 'issues'],
      filter: { match: 'all', conditions: [{ field: '__issue', op: 'is', value: 'not-in-freshservice' }] }
    },
    {
      id: 'stale',
      name: 'Stale devices',
      description: 'Nothing heard from Intune for longer than the staleness threshold. Candidates for a physical check.',
      columns: ['name', 'location', 'fsUser', 'state', 'lastCheckIn', 'daysSinceCheckIn', 'issues'],
      filter: { match: 'all', conditions: [{ field: '__issue', op: 'is', value: 'stale-intune' }] },
      sort: { key: 'daysSinceCheckIn', dir: 'desc' }
    },
    {
      id: 'state-conflicts',
      name: 'Status conflicts',
      description: 'The asset state in Freshservice contradicts what Intune sees — retired machines still in use, or in-use machines that went quiet.',
      columns: ['name', 'location', 'state', 'fsUser', 'intuneUser', 'lastCheckIn', 'daysSinceCheckIn', 'issues'],
      filter: { match: 'any', conditions: [
        { field: '__issue', op: 'is', value: 'state-conflict-active' },
        { field: '__issue', op: 'is', value: 'state-conflict-idle' }
      ] }
    },
    {
      id: 'site-check',
      name: 'Site verification pack',
      description: 'One row per device grouped by service, with blank columns for the site to complete. Export this and send it out.',
      columns: ['location', 'name', 'assetTag', 'fsUser', 'intuneUser', 'state', 'lastCheckIn'],
      filter: { match: 'all', conditions: [{ field: '__anyIssue', op: 'is' }] },
      group: 'location',
      pack: true
    },
    {
      id: 'moved-by-ip',
      name: 'Moved: IP says elsewhere',
      description: 'The network each device was last seen on belongs to a different site than Freshservice has it ' +
                   'assigned to. The strongest evidence you have that kit has physically moved.',
      columns: ['name', 'location', 'ipSiteName', 'ip', 'ipSubnet', 'fsUser', 'lastCheckIn', 'issues'],
      filter: { match: 'any', conditions: [
        { field: '__issue', op: 'is', value: 'ip-location-mismatch' },
        { field: '__issue', op: 'is', value: 'ip-suggests-location' }
      ] }
    },
    {
      id: 'off-network',
      name: 'Off the site network',
      description: 'Last seen on an address matching none of your site ranges — usually remote workers on home ' +
                   'broadband, but also sites whose subnet is missing from the lookup.',
      columns: ['name', 'location', 'ip', 'fsUser', 'intuneUser', 'lastCheckIn', 'issues'],
      filter: { match: 'all', conditions: [{ field: '__issue', op: 'is', value: 'ip-off-network' }] }
    },
    {
      id: 'duplicates',
      name: 'Duplicate names',
      description: 'The same device name appears more than once in a source export.',
      columns: ['name', 'location', 'fsUser', 'state', 'serial', 'lastCheckIn', 'matchType', 'issues'],
      filter: { match: 'all', conditions: [{ field: '__issue', op: 'is', value: 'duplicate-name' }] },
      sort: { key: 'name', dir: 'asc' }
    },
    {
      id: 'clean',
      name: 'Clean records',
      description: 'Matched in both systems with nothing flagged. Useful as a denominator, and for sense-checking the rules.',
      columns: ['name', 'location', 'fsUser', 'state', 'serial', 'model', 'lastCheckIn'],
      filter: { match: 'all', conditions: [{ field: '__anyIssue', op: 'isNot' }] }
    },
    {
      id: 'other-assets',
      name: 'Other asset types',
      description: 'Freshservice assets outside the computer types — network hardware, phones, screens. Not compared against Intune, but counted and mapped.',
      columns: ['name', 'assetType', 'location', 'fsUser', 'state', 'serial', 'model', 'assetTag'],
      filter: null,
      custom: function (rows) { return rows.filter(function (r) { return r.fs && !r.inScope; }); }
    }
  ];

  /* The quick-search box over a list of rows.

     It searches every field, not only the columns currently on screen. Tying
     it to the visible columns made the result depend on the column picker,
     which meant the table and the export could disagree about what "shown"
     meant - and typing a value whose column you had not added found nothing.
     Searching everything is both more useful (a serial number is findable
     without adding the column) and impossible to get out of step. */
  var SEARCHABLE = null;
  function searchRows(rows, q) {
    q = String(q || '').toLowerCase().trim();
    if (!q) return rows;
    if (!SEARCHABLE) SEARCHABLE = COLUMNS.map(function (c) { return c.key; });
    return rows.filter(function (r) {
      for (var i = 0; i < SEARCHABLE.length; i++) {
        var v = colValue(r, SEARCHABLE[i]);
        if (v === null || v === undefined || v === '') continue;
        if (Array.isArray(v)) v = v.join(' ');
        else if (v instanceof Date) v = global.U.fmtDate(v);
        if (String(v).toLowerCase().indexOf(q) >= 0) return true;
      }
      return false;
    });
  }

  function applyView(view, rows) {
    var out = rows;
    if (view.custom) out = view.custom(out);
    else if (view.filter) out = out.filter(function (r) { return testFilter(r, view.filter); });
    if (view.sort) {
      var col = COL_BY_KEY[view.sort.key];
      var keyFn = col && col.sortKey ? col.sortKey : function (r) { return colValue(r, view.sort.key); };
      out = U.sortBy(out, keyFn, view.sort.dir);
    }
    return out;
  }

  global.Views = {
    COLUMNS: COLUMNS,
    COL_BY_KEY: COL_BY_KEY,
    colValue: colValue,
    OPERATORS: OPERATORS,
    testFilter: testFilter,
    searchRows: searchRows,
    testCondition: testCondition,
    BUILT_IN: BUILT_IN,
    BASE_COLS: BASE_COLS,
    applyView: applyView
  };
})(window);

</script>
<script>
/* js/charts.js */
/* Inline-SVG charts. No chart library: two forms are all this tool needs, and
   hand-rolling them keeps the page dependency-free and theme-aware.

   Specs follow the house data-viz rules - bars capped at 24px with a 4px
   rounded data-end squared off at the baseline, hairline solid axes, one hue
   per single-series chart, values direct-labelled at the tip, and a table
   twin behind a toggle so no value is reachable only by hover. */
(function (global) {
  'use strict';

  var U = global.U;
  var SVGNS = 'http://www.w3.org/2000/svg';

  function svgEl(tag, attrs) {
    var n = document.createElementNS(SVGNS, tag);
    Object.keys(attrs || {}).forEach(function (k) { n.setAttribute(k, attrs[k]); });
    return n;
  }

  /* A rectangle with only its data-end rounded. Horizontal bars round the
     right edge; the baseline edge stays square. */
  function barPath(x, y, w, h, r, dir) {
    r = Math.max(0, Math.min(r, h / 2, Math.abs(w)));
    if (Math.abs(w) < 0.5) return 'M' + x + ',' + y + 'h0';
    if (dir === 'left') {
      var xe = x - w;
      return 'M' + x + ',' + y +
             'H' + (xe + r) + 'a' + r + ',' + r + ' 0 0 0 ' + (-r) + ',' + r +
             'V' + (y + h - r) + 'a' + r + ',' + r + ' 0 0 0 ' + r + ',' + r +
             'H' + x + 'Z';
    }
    return 'M' + x + ',' + y +
           'H' + (x + w - r) + 'a' + r + ',' + r + ' 0 0 1 ' + r + ',' + r +
           'V' + (y + h - r) + 'a' + r + ',' + r + ' 0 0 1 ' + (-r) + ',' + r +
           'H' + x + 'Z';
  }

  function measureText(text, size, weight) {
    // Rough advance-width estimate; good enough to decide whether a label fits.
    return String(text).length * size * (weight >= 600 ? 0.58 : 0.53);
  }

  function shell(container, opts) {
    U.clear(container);
    var wrap = U.el('div');
    container.appendChild(wrap);
    return wrap;
  }

  function tableTwin(rows, headers) {
    var t = U.el('table', { class: 'grid', style: { fontSize: '12px' } });
    var thead = U.el('thead');
    var tr = U.el('tr');
    headers.forEach(function (h, i) { tr.appendChild(U.el('th', { class: 'nosort' }, h)); });
    thead.appendChild(tr);
    t.appendChild(thead);
    var tb = U.el('tbody');
    rows.forEach(function (r) {
      var row = U.el('tr');
      r.forEach(function (c, i) {
        row.appendChild(U.el('td', { class: i > 0 ? 'num' : '' }, c));
      });
      tb.appendChild(row);
    });
    t.appendChild(tb);
    return t;
  }

  /* The table twin sits behind a toggle placed *below* the plot: anchoring it
     over the chart would cover the first bar's value label. */
  function addToggle(container, svgNode, tableNode) {
    var showing = 'chart';
    var btn = U.el('button', {
      class: 'btn sm ghost no-print',
      onclick: function () {
        showing = showing === 'chart' ? 'table' : 'chart';
        svgNode.style.display = showing === 'chart' ? '' : 'none';
        tableNode.style.display = showing === 'table' ? '' : 'none';
        btn.textContent = showing === 'chart' ? 'Show as table' : 'Show as chart';
      }
    }, 'Show as table');
    tableNode.style.display = 'none';
    container.appendChild(U.el('div', {
      class: 'no-print',
      style: { display: 'flex', justifyContent: 'flex-end', marginTop: '8px' }
    }, btn));
  }

  /* Swatch + label rows. Present whenever colour carries meaning, so identity
     never rests on hue alone. */
  function legendRow(items) {
    return U.el('div', {
      class: 'row tight',
      style: { marginBottom: '10px', fontSize: '11.5px', color: 'var(--text-secondary)' }
    }, items.map(function (it) {
      return U.el('span', { class: 'row tight', style: { gap: '5px' } }, [
        U.el('span', {
          style: {
            width: '10px', height: '10px', borderRadius: '2px',
            background: it.color, display: 'inline-block', flex: 'none'
          }
        }),
        it.label
      ]);
    }));
  }

  /* ------------------------------------------------------- ranked bars */

  /* data: [{ label, value, sub, onClick }] - one series, one colour. */
  function barChart(container, data, opts) {
    opts = opts || {};
    var wrap = shell(container);
    if (!data.length) {
      wrap.appendChild(U.el('div', { class: 'empty' }, opts.emptyText || 'Nothing to show.'));
      return;
    }
    if (opts.legend) wrap.appendChild(legendRow(opts.legend));

    var width = Math.max(320, container.clientWidth || 560);
    var barH = Math.min(24, opts.barHeight || 18);
    var band = barH + 8;                       // >= 2px surface gap between bars
    var padT = 4, padB = 4;
    var labelW = Math.min(opts.labelWidth || 190, Math.round(width * 0.42));
    var valueW = 54;
    var plotW = Math.max(60, width - labelW - valueW - 12);
    var height = padT + padB + data.length * band;

    var max = Math.max.apply(null, data.map(function (d) { return Math.abs(d.value); }));
    if (!max) max = 1;

    var svg = svgEl('svg', {
      class: 'chart', width: '100%', height: height,
      viewBox: '0 0 ' + width + ' ' + height, role: 'img',
      'aria-label': opts.ariaLabel || 'Bar chart'
    });

    data.forEach(function (d, i) {
      var y = padT + i * band;
      var w = (Math.abs(d.value) / max) * plotW;

      var label = svgEl('text', { x: labelW - 8, y: y + barH / 2 + 4, 'text-anchor': 'end' });
      label.textContent = U.truncate(d.label, Math.floor(labelW / 6.4));
      svg.appendChild(label);

      var bar = svgEl('path', {
        d: barPath(labelW, y, w, barH, 4, 'right'),
        fill: d.color || 'var(--series-1)',
        class: 'bar'
      });
      svg.appendChild(bar);

      var val = svgEl('text', {
        x: labelW + w + 7, y: y + barH / 2 + 4, class: 'value'
      });
      val.textContent = opts.format ? opts.format(d.value) : U.num(d.value);
      svg.appendChild(val);

      // Hit area spans the whole band so the target clears 24px.
      var hit = svgEl('rect', {
        x: 0, y: y - 4, width: width, height: band, class: 'hit'
      });
      hit.addEventListener('mousemove', function (ev) {
        bar.classList.add('hot');
        U.tooltip(
          '<div class="tt-title">' + U.escapeHtml(d.label) + '</div>' +
          '<div class="tt-row">' + U.escapeHtml(opts.valueLabel || 'Devices') + ': ' +
          (opts.format ? opts.format(d.value) : U.num(d.value)) + '</div>' +
          (d.sub ? '<div class="tt-row">' + U.escapeHtml(d.sub) + '</div>' : ''),
          ev.clientX, ev.clientY
        );
      });
      hit.addEventListener('mouseleave', function () { bar.classList.remove('hot'); U.tooltip(null); });
      if (d.onClick) {
        hit.style.cursor = 'pointer';
        hit.addEventListener('click', function () { U.tooltip(null); d.onClick(d); });
      }
      svg.appendChild(hit);
    });

    wrap.appendChild(svg);
    var twin = tableTwin(
      data.map(function (d) { return [d.label, opts.format ? opts.format(d.value) : U.num(d.value)]; }),
      [opts.categoryLabel || 'Item', opts.valueLabel || 'Devices']
    );
    wrap.appendChild(twin);
    addToggle(container, svg, twin);
  }

  /* ---------------------------------------------------- diverging bars */

  /* Signed values around a neutral zero line: two poles that read as opposite
     (red above expectation, blue below), grey axis as the "nothing" midpoint. */
  function divergingBarChart(container, data, opts) {
    opts = opts || {};
    var wrap = shell(container);
    if (!data.length) {
      wrap.appendChild(U.el('div', { class: 'empty' }, opts.emptyText || 'Nothing to show.'));
      return;
    }

    var width = Math.max(320, container.clientWidth || 560);
    var barH = Math.min(24, opts.barHeight || 18);
    var band = barH + 8;
    var padT = 18, padB = 4;
    var labelW = Math.min(opts.labelWidth || 170, Math.round(width * 0.38));
    var valueW = 44;
    var plotW = Math.max(80, width - labelW - valueW - 16);
    var mid = labelW + plotW / 2;
    var height = padT + padB + data.length * band;

    var max = Math.max.apply(null, data.map(function (d) { return Math.abs(d.value); })) || 1;
    var half = plotW / 2;

    var svg = svgEl('svg', {
      class: 'chart', width: '100%', height: height,
      viewBox: '0 0 ' + width + ' ' + height, role: 'img',
      'aria-label': opts.ariaLabel || 'Variance chart'
    });

    // Neutral midpoint rule.
    var axis = svgEl('line', { x1: mid, y1: padT - 6, x2: mid, y2: height - padB, class: 'axis-line' });
    svg.appendChild(axis);

    var capLeft = svgEl('text', { x: mid - 6, y: padT - 9, 'text-anchor': 'end', class: 'tick' });
    capLeft.textContent = opts.negLabel || 'fewer than expected';
    svg.appendChild(capLeft);
    var capRight = svgEl('text', { x: mid + 6, y: padT - 9, class: 'tick' });
    capRight.textContent = opts.posLabel || 'more than expected';
    svg.appendChild(capRight);

    data.forEach(function (d, i) {
      var y = padT + i * band;
      var w = (Math.abs(d.value) / max) * half;
      var positive = d.value >= 0;

      var label = svgEl('text', { x: labelW - 8, y: y + barH / 2 + 4, 'text-anchor': 'end' });
      label.textContent = U.truncate(d.label, Math.floor(labelW / 6.4));
      svg.appendChild(label);

      var bar = svgEl('path', {
        d: positive ? barPath(mid, y, w, barH, 4, 'right') : barPath(mid, y, w, barH, 4, 'left'),
        fill: positive ? 'var(--div-pos-strong)' : 'var(--div-neg-strong)',
        class: 'bar'
      });
      svg.appendChild(bar);

      var vx = positive ? mid + w + 6 : mid - w - 6;
      var val = svgEl('text', {
        x: vx, y: y + barH / 2 + 4, class: 'value',
        'text-anchor': positive ? 'start' : 'end'
      });
      val.textContent = (d.value > 0 ? '+' : '') + U.num(d.value);
      svg.appendChild(val);

      var hit = svgEl('rect', { x: 0, y: y - 4, width: width, height: band, class: 'hit' });
      hit.addEventListener('mousemove', function (ev) {
        bar.classList.add('hot');
        U.tooltip(
          '<div class="tt-title">' + U.escapeHtml(d.label) + '</div>' +
          '<div class="tt-row">' + U.escapeHtml(d.sub || '') + '</div>',
          ev.clientX, ev.clientY
        );
      });
      hit.addEventListener('mouseleave', function () { bar.classList.remove('hot'); U.tooltip(null); });
      if (d.onClick) {
        hit.style.cursor = 'pointer';
        hit.addEventListener('click', function () { U.tooltip(null); d.onClick(d); });
      }
      svg.appendChild(hit);
    });

    wrap.appendChild(svg);
    var twin = tableTwin(
      data.map(function (d) { return [d.label, (d.value > 0 ? '+' : '') + U.num(d.value), d.sub || '']; }),
      [opts.categoryLabel || 'Site', 'Variance', 'Detail']
    );
    wrap.appendChild(twin);
    addToggle(container, svg, twin);
  }

  /* --------------------------------------------------------- stat tiles */

  function tile(label, value, foot, onClick) {
    return U.el('div', {
      class: 'tile' + (onClick ? ' clickable' : ''),
      onclick: onClick || null,
      role: onClick ? 'button' : null,
      tabindex: onClick ? '0' : null,
      onkeydown: onClick ? function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onClick(); } } : null
    }, [
      U.el('div', { class: 'label' }, label),
      U.el('div', { class: 'value' }, typeof value === 'number' ? U.num(value) : value),
      foot ? U.el('div', { class: 'foot' }, foot) : null
    ]);
  }

  global.Charts = { barChart: barChart, divergingBarChart: divergingBarChart, tile: tile };
})(window);

</script>
<script>
/* js/table.js */
/* The data grid: sorting, paging, selection, grouping and the row detail
   drawer. Kept deliberately simple - a thousand rows is nothing for the DOM
   once it is paged. */
(function (global) {
  'use strict';

  var U = global.U, V = global.Views, R = global.Rules, N = global.Norm;

  function severityBadge(sev) {
    if (!sev) return U.el('span', { class: 'badge ok' }, [U.el('span', { class: 'sev sev-ok' }), 'Clean']);
    var label = sev === 'high' ? 'High' : sev === 'medium' ? 'Medium' : 'Low';
    return U.el('span', { class: 'badge ' + sev }, [U.el('span', { class: 'sev sev-' + sev }), label]);
  }

  function issueChips(row, onChipClick) {
    var frag = document.createDocumentFragment();
    if (!row.issues.length) {
      frag.appendChild(U.el('span', { class: 'badge ok' }, [U.el('span', { class: 'sev sev-ok' }), 'No issues']));
      return frag;
    }
    var ordered = row.issues.slice().sort(function (a, b) {
      return R.SEVERITY_ORDER[(R.BY_CODE[b] || {}).severity] - R.SEVERITY_ORDER[(R.BY_CODE[a] || {}).severity];
    });
    ordered.forEach(function (code) {
      var rule = R.BY_CODE[code];
      if (!rule) return;
      var chip = U.el('span', {
        class: 'badge ' + rule.severity,
        title: (row.details && row.details[code]) || rule.help
      }, [U.el('span', { class: 'sev sev-' + rule.severity }), rule.label]);
      if (onChipClick) {
        chip.style.cursor = 'pointer';
        chip.addEventListener('click', function (e) { e.stopPropagation(); onChipClick(code); });
      }
      frag.appendChild(chip);
    });
    return frag;
  }

  function renderCell(td, row, col, ctx) {
    var v = col.get(row);

    if (col.key === 'issues') {
      td.className = 'chips';
      td.appendChild(issueChips(row, ctx.onChipClick));
      return;
    }
    if (col.key === 'notes') {
      var n = v || 0;
      var flag = U.el('button', {
        class: 'btn sm ghost',
        style: { padding: '0 5px', lineHeight: '1.2', color: n ? 'var(--accent)' : 'var(--text-muted)' },
        title: n ? n + ' note' + (n === 1 ? '' : 's') + ' — click to read' : 'No notes yet — click to add one',
        onclick: function (e) { e.stopPropagation(); if (ctx.onNotesClick) ctx.onNotesClick(row); }
      }, n ? '\u2691 ' + n : '\u2690');
      td.appendChild(flag);
      return;
    }
    if (col.key === 'severity') {
      td.appendChild(severityBadge(row.severity));
      return;
    }
    if (col.key === 'userStatus') {
      var map = { match: ['ok', 'Agrees'], mismatch: ['high', 'Differs'], partial: ['medium', 'Similar'], unknown: ['low', 'Unknown'] };
      var m = map[v] || ['low', v || '—'];
      td.appendChild(U.el('span', { class: 'badge ' + m[0] }, [U.el('span', { class: 'sev sev-' + (m[0] === 'ok' ? 'ok' : m[0]) }), m[1]]));
      return;
    }
    if (col.type === 'date') {
      if (!v) { td.appendChild(U.el('span', { class: 'muted' }, 'never')); return; }
      td.appendChild(U.el('span', { title: U.fmtDate(v) }, U.fmtDate(v)));
      td.appendChild(U.el('div', { class: 'muted', style: { fontSize: '11px' } }, U.ageLabel(v) + ' ago'));

    }

    var s = v === null || v === undefined ? '' : String(v);
    if (!s) { td.appendChild(U.el('span', { class: 'muted' }, '—')); return; }

    // Highlight the two fields the reconciliation is really about when they
    // disagree, so a scan down the column finds the problems.
    var isDiff = (col.key === 'fsUser' || col.key === 'intuneUser') && row.userStatus === 'mismatch';
    td.appendChild(U.el('span', {

  function create(container, opts) {
    opts = opts || {};

    function visibleRows() {

    function render() {
      U.clear(host);
      var all = visibleRows();

      function addRow(r) {

      table.appendChild(tbody);

      /* -------------------------------------------------------- pager */
      var pager = U.el('div', { class: 'pager no-print' });

        : 'Showing ' + U.num(Math.min(all.length, state.page * state.pageSize + 1)) + '–' +
          U.num(Math.min(all.length, (state.page + 1) * state.pageSize)) + ' of ' + U.num(all.length)));

          U.num(state.selection.size) + ' selected'));

    }

    return {
      state: state,
      render: render,
      visibleRows: visibleRows,
      setRows: function (rows) { state.rows = rows; state.page = 0; },
      setColumns: function (cols) { state.columns = cols.slice(); },
      setSort: function (s) { state.sort = s; },
      setGroup: function (g) { state.group = g; },
      setSearch: function (q) { state.search = q; state.page = 0; },
      selected: function () {

  }

  /* ------------------------------------------------------- detail drawer */

  function fieldRows(row) {
    return [
      ['Device name', row.fs ? row.fs.name : '', row.intune ? row.intune.name : ''],
      ['Serial number', row.fs ? row.fs.serial : '', row.intune ? row.intune.serial : ''],
      ['Assigned user', row.fsUser, row.intuneUser],
      ['User email / UPN', row.fs ? row.fs.userEmail : '', row.intune ? row.intune.primaryUpn : ''],
      ['Location', row.locationRaw, '—'],
      ['Asset state', row.state, '—'],
      ['Asset type', row.assetType, '—'],
      ['Asset tag', row.assetTag, '—'],
      ['Model', row.fs ? row.fs.model : '', row.intune ? row.intune.model : ''],
      ['Manufacturer', row.fs ? row.fs.manufacturer : '', row.intune ? row.intune.manufacturer : ''],
      ['Operating system', row.fs ? row.fs.os : '', row.intune ? row.intune.os : ''],
      ['OS version', row.fs ? row.fs.osVersion : '', row.intune ? row.intune.osVersion : ''],
      ['Compliance', '—', row.compliance],
      ['Ownership', '—', row.ownership],
      ['Last seen', row.lastAudit ? U.fmtDate(row.lastAudit) : 'never', row.lastCheckIn ? U.fmtDate(row.lastCheckIn) : 'never'],
      ['Department', row.department, '—']

  }

  function openDrawer(row, onClose, opts) {
    opts = opts || {};
    var back = U.el('div', { class: 'drawer-back', onclick: close });
    var drawer = U.el('div', { class: 'drawer', role: 'dialog', 'aria-label': 'Device detail' });

    function close() {
      if (back.parentNode) document.body.removeChild(back);
      if (drawer.parentNode) document.body.removeChild(drawer);
      document.removeEventListener('keydown', esc);

      U.el('div', {}, [
        U.el('h2', {}, row.name),
        U.el('div', { class: 'hint' },

            : row.matchType === 'name' ? 'Matched on device name'
            : row.matchType === 'fs-only' ? 'Freshservice only — no Intune record'

    if (row.issues.length) {
      var issuesCard = U.el('div', { class: 'card', style: { marginBottom: '16px' } });
      issuesCard.appendChild(U.el('h3', { style: { marginBottom: '8px' } }, 'What is wrong'));
      row.issues.forEach(function (code) {
        var rule = R.BY_CODE[code];
        if (!rule) return;
        issuesCard.appendChild(U.el('div', { style: { marginBottom: '10px' } }, [
          U.el('div', { class: 'row tight' }, [
            U.el('span', { class: 'badge ' + rule.severity }, [U.el('span', { class: 'sev sev-' + rule.severity }), rule.label])
          ]),
          U.el('div', { style: { fontSize: '12.5px', marginTop: '3px' } }, (row.details && row.details[code]) || ''),

      body.appendChild(U.el('div', { class: 'card' }, [
        U.el('span', { class: 'badge ok' }, [U.el('span', { class: 'sev sev-ok' }), 'No issues found']),
        U.el('div', { class: 'hint', style: { marginTop: '6px' } },
          'Both systems agree on this device, and nothing is stale.')
      ]));
    }

    var cmp = U.el('div', { class: 'card' });
    cmp.appendChild(U.el('h3', { style: { marginBottom: '10px' } }, 'Side by side'));
    var kv = U.el('div', { class: 'kv' });
    kv.appendChild(U.el('div', { class: 'hdr' }, 'Field'));
    kv.appendChild(U.el('div', { class: 'hdr' }, 'Freshservice'));
    kv.appendChild(U.el('div', { class: 'hdr' }, 'Intune'));
    fieldRows(row).forEach(function (f) {
      var a = N.clean(f[1]), b = N.clean(f[2]);
      var differs = a && b && a !== '—' && b !== '—' && !N.looseEqual(a, b);
      if (f[0] === 'Assigned user') differs = row.userStatus === 'mismatch';
      kv.appendChild(U.el('div', { class: 'k' }, f[0]));
      kv.appendChild(U.el('div', { class: differs ? 'mismatch' : '' }, a || '—'));
      kv.appendChild(U.el('div', { class: differs ? 'mismatch' : '' }, b || '—'));
    });
    cmp.appendChild(kv);
    body.appendChild(cmp);

    if (row.ver) {
      var v = U.el('div', { class: 'card' });
      v.appendChild(U.el('h3', { style: { marginBottom: '8px' } }, 'Site verification return'));
      [['Device present', row.ver.confirmedPresent], ['Confirmed location', row.ver.confirmedLocation],
       ['Confirmed user', row.ver.confirmedUser], ['Confirmed status', row.ver.confirmedState],
       ['Notes', row.ver.notes]].forEach(function (p) {

        v.appendChild(U.el('div', { style: { fontSize: '12.5px' } }, [
          U.el('span', { style: { color: 'var(--text-secondary)' } }, p[0] + ': '),
          U.el('strong', {}, p[1])

      body.appendChild(v);
    }

    /* The running trail for this device, so the drawer answers "what have we

    var notesCard = U.el('div', { class: 'card' });
    function drawNotes() {
      U.clear(notesCard);
      var entries = global.Notes.entriesFor(row);
      notesCard.appendChild(U.el('header', {}, [
        U.el('h3', {}, 'Notes'),
        U.el('span', { class: 'sub' }, entries.length ? U.num(entries.length) + ' entries' : 'none yet'),
        U.el('div', { class: 'spacer' }),
        U.el('button', {
          class: 'btn sm',
          onclick: function () {
            if (opts.onAddNote) opts.onAddNote(row, drawNotes);

      if (!entries.length) {

          'Nothing recorded against this device yet.'));
      } else {
        entries.slice().reverse().forEach(function (e) {
          notesCard.appendChild(U.el('div', {
            style: { borderLeft: '2px solid var(--accent)', padding: '3px 0 5px 10px', marginBottom: '7px' }
          }, [
            U.el('div', { class: 'hint' }, new Date(e.ts).toLocaleString('en-GB')),
            U.el('div', { style: { whiteSpace: 'pre-wrap', fontSize: '12.5px' } }, e.text)

    body.appendChild(notesCard);

    if (row.site) {
      var st = U.el('div', { class: 'card' });
      st.appendChild(U.el('h3', { style: { marginBottom: '8px' } }, 'Site'));
      st.appendChild(U.el('div', { style: { fontSize: '12.5px' } }, N.clean(row.site.location)));
      var addr = global.Geo.addressOf(row.site);
      if (addr) st.appendChild(U.el('div', { class: 'hint' }, addr));
      if (row.region) st.appendChild(U.el('div', { class: 'hint' }, 'Region: ' + row.region));
      body.appendChild(st);

    document.body.appendChild(back);
    document.body.appendChild(drawer);
  }

  global.Table = { create: create, openDrawer: openDrawer, severityBadge: severityBadge, issueChips: issueChips };
})(window);

<script>
/* js/map.js */
/* Estate map: one dot per site, area proportional to the device count.

   Radius scales with the square root of the count so that area - not radius -
   carries magnitude, which is how people actually read bubble size. */
(function (global) {
  'use strict';

  var U = global.U, N = global.Norm;

  var map = null;
  var layer = null;
  var legendCtl = null;
  var lastFit = null;
  var savedView = null;

  /* Leaflet writes marker colours as SVG presentation attributes. Support for
     var() there is not universal, so resolve the tokens to concrete colours
     against the live theme before handing them over. */
  var varCache = {};
  function cssVar(name) {
    var key = name + '|' + (document.documentElement.getAttribute('data-theme') || 'auto');
    if (varCache[key]) return varCache[key];
    var v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    if (!v) v = '#2a78d6';
    varCache[key] = v;
    return v;
  }
  function resolve(c) {
    var m = /^var\((--[a-z0-9-]+)\)$/i.exec(String(c).trim());
    return m ? cssVar(m[1]) : c;
  }
  function clearVarCache() { varCache = {}; }

  var COLOUR_MODES = {
    count:    { label: 'Device count only', legend: 'One colour: size carries the count' },
    variance: { label: 'Variance vs expected', legend: 'Red = more devices than expected, blue = fewer' },
    issues:   { label: 'Share of devices with issues', legend: 'Darker = a higher proportion flagged' }
  };

  /* Roll reconciled rows up to sites. Rows whose location resolves to a row in
     the lookup get mapped; the rest are reported separately so nothing is
     silently dropped off the visual. */
  function aggregate(rows, opts) {
    opts = opts || {};
    var groups = new Map();
    var unlocated = [];       // no location at all
    var unmatched = new Map();// a location, but not in the lookup
    var unmapped = [];        // in the lookup, but no coordinates

    rows.forEach(function (r) {
      if (!opts.includeOther && r.fs && !r.inScope) return;
      if (!r.locationKey) { unlocated.push(r); return; }
      if (!r.site) {
        if (!unmatched.has(r.locationKey)) unmatched.set(r.locationKey, { name: r.location, rows: [] });
        unmatched.get(r.locationKey).rows.push(r);
        return;
      }
      var key = r.locationKey;
      if (!groups.has(key)) {
        groups.set(key, {
          key: key,
          name: N.clean(r.site.location) || r.location,
          site: r.site,
          rows: [],
          region: N.clean(r.site.region),
          expected: typeof r.site.expected === 'number' ? r.site.expected : null
        });
      }
      groups.get(key).rows.push(r);
    });

    var sites = [];
    groups.forEach(function (g) {
      var issues = g.rows.filter(function (r) { return r.issueCount > 0; }).length;
      var high = g.rows.filter(function (r) { return r.severity === 'high'; }).length;
      var lat = typeof g.site.lat === 'number' ? g.site.lat : null;
      var lon = typeof g.site.lon === 'number' ? g.site.lon : null;
      var s = {
        key: g.key,
        name: g.name,
        site: g.site,
        region: g.region,
        rows: g.rows,
        count: g.rows.length,
        issues: issues,
        high: high,
        issueRate: g.rows.length ? issues / g.rows.length : 0,
        expected: g.expected,
        variance: g.expected === null ? null : g.rows.length - g.expected,
        lat: lat, lon: lon,
        address: global.Geo.addressOf(g.site)
      };
      if (lat === null || lon === null) unmapped.push(s);
      sites.push(s);
    });

    return {
      sites: sites,
      mappable: sites.filter(function (s) { return s.lat !== null && s.lon !== null; }),
      unmapped: unmapped,
      unlocated: unlocated,
      unmatched: Array.from(unmatched.values())
    };
  }

  function radiusFor(count, maxCount) {
    var minR = 6, maxR = 34;
    if (maxCount <= 1) return minR + 4;
    var t = Math.sqrt(count) / Math.sqrt(maxCount);
    return minR + t * (maxR - minR);
  }

  function colourFor(site, mode, scale) {
    if (mode === 'variance') {
      if (site.variance === null) return 'var(--text-muted)';
      var v = site.variance;
      if (v === 0) return 'var(--div-mid)';
      var mag = Math.min(1, Math.abs(v) / (scale.maxAbsVariance || 1));
      if (v > 0) return mag > 0.5 ? 'var(--div-pos-strong)' : 'var(--div-pos)';
      return mag > 0.5 ? 'var(--div-neg-strong)' : 'var(--div-neg)';
    }
    if (mode === 'issues') {
      var r = site.issueRate;
      if (r >= 0.6) return 'var(--seq-700)';
      if (r >= 0.4) return 'var(--seq-550)';
      if (r >= 0.2) return 'var(--seq-400)';
      if (r > 0)    return 'var(--seq-250)';
      return 'var(--seq-100)';
    }
    return 'var(--series-1)';
  }

  /* Re-rendering the Map tab replaces the #map element, which would leave the
     cached Leaflet instance bound to a detached node - markers get drawn into
     a container that is no longer on the page, and the map reads as blank. So
     check the instance still owns the live element, and rebuild it if not,
     carrying the user's current pan and zoom across. */
  function ensureMap(elId) {
    if (!global.L) return null;
    var host = document.getElementById(elId);
    if (!host) return null;

    if (map) {
      var container = null;
      try { container = map.getContainer(); } catch (e) { container = null; }
      if (container === host && document.body.contains(container)) return map;

      try { savedView = { center: map.getCenter(), zoom: map.getZoom() }; } catch (e) { /* never rendered */ }
      try { map.remove(); } catch (e) { /* already torn down */ }
      map = null; layer = null; legendCtl = null;
    }

    map = global.L.map(host, { scrollWheelZoom: true, zoomControl: true, preferCanvas: false });
    if (savedView) map.setView(savedView.center, savedView.zoom);
    else map.setView([54.0, -2.4], 6);

    global.L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);
    return map;
  }

  function render(elId, agg, opts) {
    opts = opts || {};
    var host = document.getElementById(elId);
    if (!host) return;

    if (!global.L) {
      host.innerHTML = '';
      host.appendChild(U.el('div', { class: 'empty' }, [
        U.el('div', { style: { fontWeight: '600', marginBottom: '6px' } }, 'Map library unavailable'),
        U.el('div', {}, 'Leaflet is loaded from a CDN and could not be reached. Everything else in the tool works offline; the map needs internet access.')
      ]));
      return;
    }

    var m = ensureMap(elId);
    if (!m) return;
    clearVarCache();
    if (layer) { m.removeLayer(layer); layer = null; }
    layer = global.L.layerGroup().addTo(m);

    var mode = opts.mode || 'count';
    var pts = agg.mappable;
    if (!pts.length) {
      if (legendCtl) { m.removeControl(legendCtl); legendCtl = null; }
      setTimeout(function () { m.invalidateSize(); }, 60);
      return;
    }

    var maxCount = Math.max.apply(null, pts.map(function (s) { return s.count; }));
    var scale = {
      maxAbsVariance: Math.max.apply(null, pts.map(function (s) {
        return s.variance === null ? 0 : Math.abs(s.variance);
      })) || 1
    };

    // Bigger dots first so small ones stay clickable on top of them.
    pts.slice().sort(function (a, b) { return b.count - a.count; }).forEach(function (s) {
      var marker = global.L.circleMarker([s.lat, s.lon], {
        radius: radiusFor(s.count, maxCount),
        color: resolve('var(--surface-1)'),
        weight: 2,                       // surface ring, not a data border
        opacity: 0.9,
        fillColor: resolve(colourFor(s, mode, scale)),
        fillOpacity: 0.78
      });

      var lines = [
        '<h4>' + U.escapeHtml(s.name) + '</h4>',
        s.address ? '<div style="color:var(--text-secondary)">' + U.escapeHtml(s.address) + '</div>' : '',
        s.region ? '<div style="color:var(--text-muted)">' + U.escapeHtml(s.region) + '</div>' : '',
        '<div style="margin-top:8px"><strong>' + U.num(s.count) + '</strong> device' + (s.count === 1 ? '' : 's'),
        s.expected !== null ? ' · expected <strong>' + U.num(s.expected) + '</strong>' : '',
        '</div>',
        s.variance !== null && s.variance !== 0
          ? '<div style="color:' + (s.variance > 0 ? 'var(--div-pos-strong)' : 'var(--div-neg-strong)') + ';font-weight:600">' +
            (s.variance > 0 ? '+' : '') + s.variance + ' vs expected</div>'
          : '',
        '<div>' + U.num(s.issues) + ' flagged (' + Math.round(s.issueRate * 100) + '%)' +
          (s.high ? ' · <strong>' + s.high + '</strong> high severity' : '') + '</div>'
      ].join('');

      var content = U.el('div');
      content.innerHTML = lines;
      var btn = U.el('button', {
        class: 'btn sm primary',
        style: { marginTop: '10px' },
        onclick: function () { if (opts.onSelect) opts.onSelect(s); }
      }, 'View these ' + s.count + ' devices');
      content.appendChild(btn);

      marker.bindPopup(content, { maxWidth: 300 });
      marker.bindTooltip(s.name + ' · ' + s.count + ' device' + (s.count === 1 ? '' : 's'), { direction: 'top' });
      marker.addTo(layer);
    });

    /* --------------------------------------------------------- legend */
    if (legendCtl) { m.removeControl(legendCtl); legendCtl = null; }
    legendCtl = global.L.control({ position: 'bottomright' });
    legendCtl.onAdd = function () {
      var div = U.el('div', { class: 'map-legend' });
      div.appendChild(U.el('div', { class: 'lg-title' }, 'Dot size'));

      var sizes = U.uniq([1, Math.max(1, Math.round(maxCount / 4)), Math.max(2, Math.round(maxCount / 2)), maxCount])
        .filter(function (v) { return v > 0; });
      var sizeRow = U.el('div', { style: { display: 'flex', alignItems: 'flex-end', gap: '10px', margin: '4px 0 8px' } });
      sizes.forEach(function (v) {
        var r = radiusFor(v, maxCount);
        sizeRow.appendChild(U.el('div', { style: { textAlign: 'center' } }, [
          U.el('div', {
            style: {
              width: (r * 2) + 'px', height: (r * 2) + 'px', borderRadius: '50%',
              background: 'var(--series-1)', opacity: '0.55', margin: '0 auto 3px'
            }
          }),
          U.el('div', { style: { fontVariantNumeric: 'tabular-nums' } }, String(v))
        ]));
      });
      div.appendChild(sizeRow);

      if (mode !== 'count') {
        div.appendChild(U.el('div', { class: 'lg-title' }, mode === 'variance' ? 'Variance' : 'Issue rate'));
        var swatches = mode === 'variance'
          ? [['var(--div-neg-strong)', 'Well under'], ['var(--div-neg)', 'Under'], ['var(--div-mid)', 'On target'],
             ['var(--div-pos)', 'Over'], ['var(--div-pos-strong)', 'Well over']]
          : [['var(--seq-100)', 'None flagged'], ['var(--seq-250)', 'Under 20%'], ['var(--seq-400)', '20–40%'],
             ['var(--seq-550)', '40–60%'], ['var(--seq-700)', 'Over 60%']];
        swatches.forEach(function (s) {
          div.appendChild(U.el('div', { class: 'lg-row' }, [
            U.el('span', { class: 'lg-sw', style: { background: s[0] } }),
            U.el('span', {}, s[1])
          ]));
        });
      }
      global.L.DomEvent.disableClickPropagation(div);
      return div;
    };
    legendCtl.addTo(m);

    // Fit once per distinct set of points, so re-colouring doesn't yank the view.
    // A map rebuilt from scratch with no remembered view needs the fit too.
    var sig = pts.length + ':' + pts.map(function (s) { return s.key; }).join(',');
    if (sig !== lastFit || !savedView) {
      lastFit = sig;
      try {
        m.fitBounds(global.L.latLngBounds(pts.map(function (s) { return [s.lat, s.lon]; })).pad(0.12));
      } catch (e) { /* single point or bad coords: leave the default view */ }
    }
    setTimeout(function () { m.invalidateSize(); }, 60);
  }

  function invalidate() {
    if (!map) return;
    setTimeout(function () {
      try {
        map.invalidateSize();
        savedView = { center: map.getCenter(), zoom: map.getZoom() };
      } catch (e) { /* container gone; the next ensureMap rebuilds */ }
    }, 60);
  }

  /* Called when the underlying site set changes enough that the view should be
     re-fitted rather than preserved. */
  function reset() { lastFit = null; savedView = null; }

  global.EstateMap = {
    aggregate: aggregate,
    render: render,
    invalidate: invalidate,
    reset: reset,
    COLOUR_MODES: COLOUR_MODES,
    radiusFor: radiusFor
  };
})(window);

</script>
<script>
/* js/fsexport.js */
/* Builds the files that go back out: the Freshservice update import, the
   change log that documents it, and the site verification packs. */
(function (global) {
  'use strict';

  var U = global.U, N = global.Norm, R = global.Rules;

  /* Freshservice's import expects your instance's own column labels, and
     those differ between tenants (and between the default and custom fields).
     Every header here is editable in the UI and remembered. */
  var DEFAULT_HEADERS = {
    name:      'Name',
    assetTag:  'Asset Tag',
    serial:    'Serial Number',
    user:      'Used By',
    location:  'Location',
    state:     'Asset State',
    model:     'Product',
    os:        'OS',
    osVersion: 'OS Version',
    department:'Department'
  };

  var UPDATABLE = [
    { field: 'user',      label: 'Assigned user (Used By)', sources: ['intune', 'verification'], defaultSource: 'intune' },
    { field: 'location',  label: 'Location',                sources: ['verification', 'ip'],     defaultSource: 'verification' },
    { field: 'state',     label: 'Asset state',             sources: ['verification', 'manual'], defaultSource: 'verification' },
    { field: 'serial',    label: 'Serial number',           sources: ['intune'],                 defaultSource: 'intune' },
    { field: 'model',     label: 'Model',                   sources: ['intune'],                 defaultSource: 'intune' },
    { field: 'os',        label: 'Operating system',        sources: ['intune'],                 defaultSource: 'intune' },
    { field: 'osVersion', label: 'OS version',              sources: ['intune'],                 defaultSource: 'intune' }
  ];

  var SOURCE_LABELS = {
    intune: 'Intune',
    verification: 'Site verification return',
    ip: 'Site matching the last-seen IP',
    manual: 'Fixed value'
  };

  /* Columns that appear on every row regardless of what is being corrected.

     Freshservice rejects an asset import that is missing a mandatory field, so
     these are not decoration: an instance that requires Workspace, Name and
     Product needs all three present on every line, including lines where none
     of them is the thing being changed. A column can take a fixed value or the
     value Freshservice already holds for a field. Where a column names a field
     that is also being corrected, the corrected value wins for the rows that
     have one and the current value fills the rest, so the column is never
     blank. */

  /* Where a column's value comes from. Which system is authoritative differs
     per field and is not something the tool can decide: Freshservice's Product
     is written by its own discovery agent and Intune reports hardware
     separately, so for that column Freshservice is right and copying Intune
     over it would be destructive - while for the assigned user Intune is the
     fresher of the two. So the choice is explicit, per column. */
  var COLUMN_SOURCES = {
    fs: [
      { field: 'name',        label: 'Device name (Display Name)' },
      { field: 'model',       label: 'Product / model' },
      { field: 'assetTag',    label: 'Asset tag' },
      { field: 'serial',      label: 'Serial number' },
      { field: 'location',    label: 'Location' },
      { field: 'user',        label: 'Assigned user' },
      { field: 'state',       label: 'Asset state' },
      { field: 'assetType',   label: 'Asset type' },
      { field: 'department',  label: 'Department' },
      { field: 'os',          label: 'Operating system' },
      { field: 'osVersion',   label: 'OS version' },
      { field: 'ipAddress',   label: 'Last seen IP address' }
    ],
    intune: [
      { field: 'name',        label: 'Device name' },
      { field: 'user',        label: 'Primary user' },
      { field: 'serial',      label: 'Serial number' },
      { field: 'model',       label: 'Model' },
      { field: 'manufacturer',label: 'Manufacturer' },
      { field: 'os',          label: 'Operating system' },
      { field: 'osVersion',   label: 'OS version' },
      { field: 'lastCheckIn', label: 'Last check-in' },
      { field: 'compliance',  label: 'Compliance' },
      { field: 'ownership',   label: 'Ownership' },
      { field: 'category',    label: 'Category' },
      { field: 'ipAddress',   label: 'Last seen IP address' }
    ]
  };

  function fsFieldValue(row, field) {
    if (field === 'name') return row.name;
    if (field === 'ipAddress') return row.fsIp || '';
    if (field === 'assetTag') return row.assetTag;
    if (field === 'assetType') return row.assetType;
    if (field === 'department') return row.department;
    return R.currentValue(row, field);
  }

  function intuneFieldValue(row, field) {
    var i = row.intune;
    if (!i) return '';
    if (field === 'user') return N.personDisplay(i.primaryUser, i.primaryUpn);
    if (field === 'lastCheckIn') return row.lastCheckIn ? U.fmtDate(row.lastCheckIn) : '';
    if (field === 'ipAddress') return row.intuneIp || '';
    return N.clean(i[field]);
  }

  /* One accessor for any column spec. */
  function columnValue(row, col) {
    if (!col) return '';
    if (col.kind === 'fixed') return col.value === undefined ? '' : col.value;
    if (col.kind === 'intune') return intuneFieldValue(row, col.field);
    return fsFieldValue(row, col.field);          // 'fs', and legacy 'field'
  }

  function sourceLabel(col) {
    if (!col) return '';
    if (col.kind === 'fixed') return 'Fixed value';
    var group = col.kind === 'intune' ? 'intune' : 'fs';
    var def = COLUMN_SOURCES[group].filter(function (f) { return f.field === col.field; })[0];
    return (group === 'intune' ? 'Intune: ' : 'Freshservice: ') + (def ? def.label : col.field);
  }

  /* The three columns a stock Freshservice asset import will not accept a file
     without. Product deliberately comes from Freshservice: overwriting it with
     Intune's wording would change good data on every row. */
  function defaultAlwaysColumns() {
    return [
      { header: 'Workspace', kind: 'fixed', value: 'IT' },
      { header: 'Name',      kind: 'fs', field: 'name' },
      { header: 'Product',   kind: 'fs', field: 'model' }
    ];
  }

  function defaultConfig() {
    return {
      matchField: 'name',
      headers: Object.assign({}, DEFAULT_HEADERS),
      fields: {
        user:      { enabled: true,  source: 'intune' },
        location:  { enabled: true,  source: 'verification' },
        state:     { enabled: false, source: 'verification', manualValue: '' },
        serial:    { enabled: false, source: 'intune' },
        model:     { enabled: false, source: 'intune' },
        os:        { enabled: false, source: 'intune' },
        osVersion: { enabled: false, source: 'intune' }
      },
      onlyChanged: true,
      requireIntuneMatch: true,
      skipRetired: true,
      alwaysColumns: defaultAlwaysColumns()
    };
  }

  function matchValue(row, matchField) {
    if (matchField === 'assetTag') return row.assetTag;
    if (matchField === 'serial') return N.clean(row.fs && row.fs.serial) || row.serial;
    return row.name;
  }

  /* Work out every change the current configuration would make.
     Returns [{ row, key, changes: [{field, current, proposed, source, reason}] }] */
  function buildProposals(rows, cfg) {
    cfg = cfg || defaultConfig();
    var out = [];

    rows.forEach(function (row) {
      if (!row.fs) return;                                   // nothing to update
      // Skipping retired assets is about not disturbing genuinely dead kit. An
      // asset flagged "retired but still in use" is demonstrably not dead, and
      // correcting that state is the whole point of the row - so the skip must
      // not remove exactly the assets the rule was written to find.
      if (cfg.skipRetired && N.isRetiredState(row.state) &&
          row.issues.indexOf('state-conflict-active') < 0) return;
      if (cfg.requireIntuneMatch && !row.intune && !row.ver) return;

      var key = matchValue(row, cfg.matchField);
      if (N.isBlank(key)) return;                            // cannot be matched on import

      var changes = [];
      Object.keys(cfg.fields).forEach(function (field) {
        var fcfg = cfg.fields[field];
        if (!fcfg || !fcfg.enabled) return;

        var proposed;
        if (fcfg.source === 'manual') {
          proposed = N.clean(fcfg.manualValue);
          // A fixed value only applies where the rule that motivated it fired.
          if (field === 'state' && row.issues.indexOf('state-conflict-active') < 0) return;
        } else {
          proposed = R.proposedValue(row, field, fcfg.source);
        }
        if (proposed === null || proposed === undefined || N.isBlank(proposed)) return;

        var current = R.currentValue(row, field);
        if (cfg.onlyChanged) {
          if (field === 'user') {
            if (N.comparePeople(current, proposed) === 'match') return;
          } else if (N.text(current) === N.text(proposed)) return;
        }

        changes.push({
          field: field,
          label: (UPDATABLE.filter(function (u) { return u.field === field; })[0] || {}).label || field,
          current: current === null || current === undefined ? '' : String(current),
          proposed: String(proposed),
          source: fcfg.source,
          reason: reasonFor(row, field)
        });
      });

      if (changes.length) out.push({ row: row, key: key, changes: changes });
    });

    return out;
  }

  function reasonFor(row, field) {
    var codes = row.issues.filter(function (c) {
      var rule = R.BY_CODE[c];
      return rule && rule.fix && rule.fix.field === field;
    });
    if (!codes.length) return '';
    return codes.map(function (c) { return R.BY_CODE[c].label; }).join('; ');
  }

  /* The file to upload to Freshservice: the match column plus one column per
     field being corrected. Rows carry only the fields that actually change,
     so an unrelated blank never overwrites good data. */
  function toImportCsv(proposals, cfg) {
    cfg = cfg || defaultConfig();
    var H = cfg.headers;
    var matchHeader = H[cfg.matchField] || 'Name';

    var fieldsUsed = [];
    proposals.forEach(function (p) {
      p.changes.forEach(function (c) {
        if (fieldsUsed.indexOf(c.field) < 0) fieldsUsed.push(c.field);
      });
    });
    var order = UPDATABLE.map(function (u) { return u.field; });
    fieldsUsed.sort(function (a, b) { return order.indexOf(a) - order.indexOf(b); });

    /* Build the column list once, each with its own accessor, so headers and
       values cannot drift apart. Order: the match column, then the always-on
       columns, then whatever is left of the corrections. */
    var columns = [];
    var taken = {};

    function add(header, get) {
      header = String(header || '').trim();
      if (!header || taken[header]) return;      // never emit a duplicate heading
      taken[header] = true;
      columns.push({ header: header, get: get });
    }

    function changeFor(p, field) {
      return p.changes.filter(function (c) { return c.field === field; })[0] || null;
    }

    add(matchHeader, function (p) { return p.key; });

    // A column says where its value comes from, and that is what it gets. A
    // correction never quietly overrides it - Product is configured to come
    // from Freshservice precisely so that a Model correction cannot rewrite it.
    (cfg.alwaysColumns || []).forEach(function (col) {
      add(col.header, function (p) { return columnValue(p.row, col); });
    });

    // Corrections fill the rows that have one; the rest keep their current
    // Freshservice value so the column is never blank on an unchanged row.
    fieldsUsed.forEach(function (f) {
      add(H[f] || f, function (p) {
        var ch = changeFor(p, f);
        return ch ? ch.proposed : fsFieldValue(p.row, f);
      });
    });

    var headers = columns.map(function (c) { return c.header; });
    var rows = proposals.map(function (p) {
      var obj = {};
      columns.forEach(function (c) { obj[c.header] = c.get(p); });
      return obj;
    });
    return global.CSV.stringify(rows, headers);
  }

  /* Columns whose heading is claimed by a correction, or vice versa - the
     always-column wins, so say so rather than let the correction vanish. */
  function columnConflicts(cfg) {
    var out = [];
    (cfg.alwaysColumns || []).forEach(function (col) {
      if (col.kind === 'fixed') return;
      var f = cfg.fields[col.field];
      if (f && f.enabled) {
        out.push({ header: col.header, field: col.field, source: sourceLabel(col) });
      }
    });
    return out;
  }

  /* How many rows would have nothing in a given column. */
  function blankCount(proposals, col) {
    return proposals.filter(function (p) {
      return N.isBlank(columnValue(p.row, col));
    }).length;
  }

  /* Which mandatory columns are missing from the current configuration. */
  function missingRequired(cfg) {
    var have = {};
    var matchHeader = (cfg.headers[cfg.matchField] || '').trim().toLowerCase();
    if (matchHeader) have[matchHeader] = true;
    (cfg.alwaysColumns || []).forEach(function (c) {
      var h = String(c.header || '').trim().toLowerCase();
      if (h) have[h] = true;
    });
    return ['Workspace', 'Name', 'Product'].filter(function (r) {
      return !have[r.toLowerCase()];
    });
  }

  /* A separate audit file: what changed, from what, to what, and why. */
  function toChangeLogCsv(proposals, cfg) {
    var headers = ['Device name', 'Asset tag', 'Match value', 'Field', 'Current value in Freshservice',
                   'Proposed value', 'Source of proposed value', 'Reason', 'Location', 'Last Intune check-in'];
    var rows = [];
    proposals.forEach(function (p) {
      p.changes.forEach(function (c) {
        rows.push({
          'Device name': p.row.name,
          'Asset tag': p.row.assetTag,
          'Match value': p.key,
          'Field': c.label,
          'Current value in Freshservice': c.current,
          'Proposed value': c.proposed,
          'Source of proposed value': SOURCE_LABELS[c.source] || c.source,
          'Reason': c.reason,
          'Location': p.row.location,
          'Last Intune check-in': p.row.lastCheckIn ? U.fmtDate(p.row.lastCheckIn) : ''
        });
      });
    });
    return global.CSV.stringify(rows, headers);
  }

  /* The sheet that goes out to a service. Freshservice's view of each device
     plus blank columns for the site to complete; drop the completed file back
     in as a verification return and the answers feed the import builder. */
  var PACK_BLANKS = ['Device present?', 'Confirmed location', 'Confirmed user', 'Confirmed status', 'Notes'];

  function sitePackCsv(rows, siteName) {
    var headers = ['Device name', 'Asset tag', 'Serial number', 'Freshservice location',
                   'Freshservice user', 'Intune user', 'Freshservice status',
                   'Last seen by Intune', 'What we think is wrong'].concat(PACK_BLANKS);

    var data = rows.map(function (r) {
      var obj = {
        'Device name': r.name,
        'Asset tag': r.assetTag,
        'Serial number': r.serial,
        'Freshservice location': r.locationRaw,
        'Freshservice user': r.fsUser,
        'Intune user': r.intuneUser,
        'Freshservice status': r.state,
        'Last seen by Intune': r.lastCheckIn ? U.fmtDate(r.lastCheckIn) : 'never',
        'What we think is wrong': r.issues.map(function (c) {
          return (R.BY_CODE[c] || {}).label || c;
        }).join('; ')
      };
      PACK_BLANKS.forEach(function (b) { obj[b] = ''; });
      return obj;
    });
    return global.CSV.stringify(data, headers);
  }

  /* Export whatever the user is currently looking at. */
  function viewCsv(rows, columnKeys) {
    var V = global.Views;
    var headers = columnKeys.map(function (k) {
      return (V.COL_BY_KEY[k] || { label: k }).label;
    });
    var data = rows.map(function (r) {
      var obj = {};
      columnKeys.forEach(function (k, i) {
        var v = V.colValue(r, k);
        if (Array.isArray(v)) {
          v = v.map(function (c) { return (R.BY_CODE[c] || {}).label || c; }).join('; ');
        } else if (v instanceof Date) {
          v = U.fmtDate(v);
        }
        obj[headers[i]] = v === null || v === undefined ? '' : v;
      });
      return obj;
    });
    return global.CSV.stringify(data, headers);
  }

  /* Re-export the location lookup with any coordinates that were found, so
     geocoding is a one-time job. */
  function locationsCsv(locations) {
    var headers = ['Location', 'Address', 'Town', 'Postcode', 'Latitude', 'Longitude',
                   'Expected devices', 'Region', 'Site type', 'Contact'];
    var rows = locations.map(function (l) {
      return {
        'Location': l.location,
        'Address': l.address || '',
        'Town': l.town || '',
        'Postcode': l.postcode || '',
        'Latitude': typeof l.lat === 'number' ? l.lat : '',
        'Longitude': typeof l.lon === 'number' ? l.lon : '',
        'Expected devices': typeof l.expected === 'number' ? l.expected : '',
        'Region': l.region || '',
        'Site type': l.siteType || '',
        'Contact': l.contact || ''
      };
    });
    return global.CSV.stringify(rows, headers);
  }

  global.FSExport = {
    DEFAULT_HEADERS: DEFAULT_HEADERS,
    UPDATABLE: UPDATABLE,
    COLUMN_SOURCES: COLUMN_SOURCES,
    columnValue: columnValue,
    sourceLabel: sourceLabel,
    columnConflicts: columnConflicts,
    blankCount: blankCount,
    fsFieldValue: fsFieldValue,
    defaultAlwaysColumns: defaultAlwaysColumns,
    missingRequired: missingRequired,
    SOURCE_LABELS: SOURCE_LABELS,
    defaultConfig: defaultConfig,
    buildProposals: buildProposals,
    toImportCsv: toImportCsv,
    toChangeLogCsv: toChangeLogCsv,
    sitePackCsv: sitePackCsv,
    viewCsv: viewCsv,
    locationsCsv: locationsCsv,
    matchValue: matchValue
  };
})(window);

</script>
<script>
/* js/sampledata.js */
/* Sample data for the "Load sample data" button.

   Entirely invented: fictional sites, fictional people, fictional serials.
   It is shaped like the real exports and carries the same kinds of problems
   on purpose, so the tool can be demonstrated without anyone's estate data.
